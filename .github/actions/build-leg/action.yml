name: build-leg
description: >
  One release-matrix leg (plan Q2 pipeline shape): construct the patched tjs
  tree from committed material (PINS.md tag+sha, spike/quickjs/patches/* in
  the documented order) -> build tjs (natively, or inside a guest via
  ./.github/actions/guest) -> esbuild clode-main -> fuse the self-contained
  builder (clode build --self, embedded pristine template) -> self-smoke
  (--version always; full = ephemeral quaude fuse + PONG + attest
  against a fetched provider, artifact NEVER uploaded) -> attest -> upload.
  Only BUILDERS are ever published; quaudes are ephemeral runner files.
  Exec modes: `clode build` EXECS the tjs template (the fuse worker runs
  under it) and then execs the fused output. Foreign-LINUX-arch legs get away
  with host-side fuse+smoke because qemu-user binfmt execs the guest binaries;
  BSD/illumos/Solaris binaries have no such escape, so for VM legs the whole
  fuse + smoke runs INSIDE the guest (exec=guest, derived from the platform),
  with tjs-vendor/tjs-out under the workspace — the VM sync boundary.
inputs:
  leg:
    description: Leg tag; names the artifact clode-<version>-<leg>
    required: true
  guest-platform:
    description: "'native' or a ./.github/actions/guest platform (alpine | netbsd | freebsd | openbsd | dragonflybsd | omnios | solaris)"
    required: false
    default: native
  guest-arch:
    description: Guest arch (see the guest action)
    required: false
    default: x86_64
  guest-version:
    description: Guest OS version (see the guest action)
    required: false
    default: "3.22"
  guest-packages:
    description: Packages for the guest, named in the guest's package system (VM legs)
    required: false
    default: ""
  macos-min:
    description: "macOS deployment-target floor (native darwin legs). Empty: stock SDK, no floor."
    required: false
    default: ""
  macos-sdk:
    description: "Pinned old-SDK id to build against (known ids: '10.6', '10.4u'). Empty: the runner's stock SDK."
    required: false
    default: ""
  macos-arch:
    description: "Explicit target arch for the darwin floor build (e.g. 'i386'). Empty: the host arch."
    required: false
    default: ""
  no-exec:
    description: "'true': the runner cannot execute the target output (darwin-x86 i386). Build + floor-gate + upload the BARE engine only — no exec smoke, no fuse, no builder artifact."
    required: false
    default: "false"
  cross-image:
    description: "Docker image (digest-pinned) providing a cross toolchain; when set, the engine is cross-built INSIDE it on an ubuntu runner (darwin-ppc). Implies no-exec."
    required: false
    default: ""
  cross-dockerfile:
    description: "Directory with a Dockerfile for the cross-toolchain image, BUILT IN CI with GHA layer caching (no registry — the darwin osxcross legs, so the phracker Apple SDKs are never re-hosted). Mutually exclusive with cross-image; implies no-exec."
    required: false
    default: ""
  cross-file:
    description: "CMake toolchain file (repo-relative) the exec=cross build passes as CLODE_TJS_CROSS_FILE. Default = the darwin-ppc file (back-compat); the tier-2 Debian cross legs point it at scripts/linux-<arch>.toolchain.cmake."
    required: false
    default: "scripts/darwin-ppc.toolchain.cmake"
  cross-apt:
    description: "Space-separated apt packages installed INSIDE the cross-image before the build (e.g. 'cmake make gcc-riscv64-linux-gnu g++-riscv64-linux-gnu'). Empty for images that bake their toolchain (darwin-ppc)."
    required: false
    default: ""
  cosmo:
    description: "'true': the Cosmopolitan APE leg. build-tjs.mjs's CLODE_TJS_TARGET=cosmo self-provisions cosmocc, forces the lean profile, applies patches/libuv-cosmo.patch + patches/libtjs-cosmo.patch, and builds the tjs-cli APE via scripts/cosmo.toolchain.cmake. Runs the normal native (exec=host) source+build+fuse+smoke path — the fat APE execs on the ubuntu runner via clode-fuse's isApeFile /bin/sh route. The SAME .com is then exercised on other-OS runners downstream (the multi-OS fan-out)."
    required: false
    default: "false"
  atomic-shim:
    description: "'true': link the __atomic_*_8 pthread shim (CLODE_TJS_ATOMIC_SHIM=1) for 32-bit targets lacking 8-byte libatomic (darwin-ppc, netbsd-m68k). 'false' for native-64-bit-atomic targets (s390x/riscv64)."
    required: false
    default: "false"
  darwin-poll:
    description: "'true': build libuv's generic poll(2) event backend instead of kqueue (CLODE_TJS_DARWIN_POLL=1) — the 10.4-floor darwin legs, where Darwin 8's kqueue drops socket/pipe/SIGCHLD/async delivery under load. 'false' everywhere else: kqueue is correct and proven on 10.6+."
    required: false
    default: "false"
  tier2:
    description: "'true': after the cross-built target engine lands, cross-fuse a tier-2 clode BUILDER against it via ./.github/actions/cross-fuse and upload it (ELF-only — darwin is excluded, Mach-O needs a pre-signed template)."
    required: false
    default: "false"
  verify:
    description: "post-build validation rung: 'smoke' (qemu-system fuse+PONG, the sparc leg), 'qemu-user' (binfmt-run the cross-fused builder: level-2 --version required, level-2.5 full fuse attempted+logged), 'none' (tier-2, built-not-run — NetBSD has no qemu-user)."
    required: false
    default: smoke
  netbsd-src:
    description: "When set, cross-build the engine with a NetBSD build.sh toolchain (./.github/actions/netbsd-crossbuild) instead of a Debian cross-image. The value is the NetBSD src git rev/tag/branch to pin (netbsd-m68k). Implies exec=cross."
    required: false
    default: ""
  netbsd-machine:
    description: "NetBSD MACHINE (port) for build.sh -m; any m68k port shares the m68k--netbsdelf toolchain (e.g. atari, sun3, mac68k). Required when netbsd-src is set."
    required: false
    default: ""
  netbsd-arch:
    description: "NetBSD MACHINE_ARCH for build.sh -a. Required for multi-arch ports with no default (evbarm/sbmips/evbsh3); leave empty for single-arch ports."
    required: false
    default: ""
  netbsd-sysroot:
    description: "Sysroot build mode for netbsd-crossbuild: 'full' (build.sh distribution, default) or 'light' (make includes + runtime libs only, skips userland). See netbsd-crossbuild."
    required: false
    default: "full"
  static:
    description: "'true': fully-static tjs (musl legs) + verify with file/ldd"
    required: false
    default: "false"
  wasm:
    description: >
      'off': build tjs without WASM/WAMR (Linux arches where WAMR's MAP_32BIT
      is undefined: s390x/ppc64le/riscv64/loongarch64/armv7/x86 — and ALL
      non-Linux VM legs: WAMR maps every non-Darwin/Windows/Android system to
      its "linux" platform, whose posix_memmap.c needs Linux's 4-arg mremap).
    required: false
    default: "on"
  mimalloc:
    description: "'off': system malloc instead of mimalloc (mimalloc 3.2.7 does not compile on NetBSD; VM legs start off and re-enable as they prove)"
    required: false
    default: "on"
  ffi:
    description: "'off': no tjs:ffi (spares the guest a libffi dep; nothing shipped imports it)"
    required: false
    default: "on"
  msvc:
    description: "'true': build the Windows engine with MSVC cl.exe (VS dev env) instead of mingw gcc"
    required: false
    default: "false"
  msvc-arch:
    description: "MSVC target arch for the dev-env (x64 | arm64); default x64"
    required: false
    default: "x64"
  floor:
    description: "Compat floor token in the published asset name (canonical dashed clode-<ver>-<os>-<floor>-<arch>, via scripts/canonical-name.cjs); empty = bare name"
    required: false
    default: ""
  smoke:
    description: "'full' (provider fetch + ephemeral quaude PONG) or 'version' (--version only)"
    required: false
    default: full
  attest:
    description: "'true': actions/attest-build-provenance over the builder (caller must grant id-token+attestations write)"
    required: false
    default: "false"
  publish:
    description: "'true': artifact named for release collection; 'false': smoke- prefix (never attached to a release)"
    required: false
    default: "false"
outputs:
  asset:
    description: The builder artifact filename
    value: ${{ steps.name.outputs.asset }}
runs:
  using: composite
  steps:
    - name: Resolve the exec mode and tree locations
      id: mode
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${{ inputs.cross-image }}" ] || [ -n "${{ inputs.cross-dockerfile }}" ] || [ -n "${{ inputs.netbsd-src }}" ]; then
          exec=cross   # cross-built on ubuntu: inside a docker toolchain image —
                       # pinned+pulled (darwin-ppc) OR built-in-CI from a Dockerfile
                       # (darwin-x64/x86 osxcross) — OR against a NetBSD build.sh
                       # toolchain (netbsd-m68k). vendor/out live under runner.temp
                       # (bind-mounted into the container where one is used); no
                       # host exec/fuse runs, and nothing here syncs to a separate
                       # machine, so the checkout is never touched.
        else
          case "${{ inputs.guest-platform }}" in
            qemu-*) exec=qemu ;;  # own-qemu leg (netbsd-sparc): engine bakes in-guest, builder cross-fuses on the x64 runner, smoke runs via a backend recipe — see the qemu-* steps below
            netbsd|freebsd|openbsd|dragonflybsd|omnios|solaris|midnightbsd|haiku|openindiana) exec=guest ;;
            *) exec=host ;;
          esac
        fi
        echo "exec=$exec" >> "$GITHUB_OUTPUT"
        if [ "$exec" = guest ]; then
          # cpa.sh (cross-platform-actions) is the only backend here that moves
          # bytes to/from a genuinely SEPARATE machine, and its only channel is
          # an rsync of the WORKSPACE — nothing else. So for exec=guest alone,
          # vendor/out must live inside it: the guest needs the host-constructed
          # vendor tree to arrive via that sync, and the built engine has to
          # leave the same way (the host-side tjs-cache save and the
          # unconditional "Upload the bare tjs binary" step both read it back
          # from the synced workspace afterward). See the guest script below for
          # exactly what stays in-checkout for this reason and what does not.
          #
          # exec=cross bind-mounts the workspace into a docker container on
          # THIS SAME machine (no remote sync), and exec=qemu's own driver
          # reads/writes host paths directly — neither needs the checkout for
          # that, so both now take the plain runner-scratch branch below, same
          # as exec=host always has.
          echo "vendor=$GITHUB_WORKSPACE/.matrix/tjs-vendor" >> "$GITHUB_OUTPUT"
          echo "out=$GITHUB_WORKSPACE/.matrix/tjs-out" >> "$GITHUB_OUTPUT"
        else
          echo "vendor=$RUNNER_TEMP/tjs-vendor" >> "$GITHUB_OUTPUT"
          echo "out=$RUNNER_TEMP/tjs-out" >> "$GITHUB_OUTPUT"
        fi

    - name: Name the builder artifact
      id: name
      shell: bash
      run: |
        set -euo pipefail
        if [ "${GITHUB_REF_TYPE:-}" = tag ]; then V="${GITHUB_REF_NAME#v}"; else V="$(cat VERSION)"; fi
        LEG="${{ inputs.leg }}"; FLOOR="${{ inputs.floor }}"
        # ONE source of truth: the canonical asset name is produced by
        # scripts/canonical-name.cjs (assetName) so this bash and the JS can never
        # drift (they used to — this bash re-implemented an OLD glued os<floor>-arch
        # form). The runner's system node + the checked-out dep-free CJS script are
        # enough; assetName handles both floored (dashed <os>-<floor>-<arch>) and bare
        # (empty floor) names, and canonicalizes os/arch (macos, amd64, port names).
        ASSET="$(node scripts/canonical-name.cjs asset "$LEG" "$V" "$FLOOR")"
        echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

    # The cache key carries the BUILD ENVIRONMENT axes, not just the leg
    # name: guest-version varies per tier (ci = newest, release = oldest
    # floor) and per floor-walk probe, and the runner IMAGE varies for native
    # legs (release builds on the oldest hosted label, ci the newest). A
    # version-blind key restored a 7.9-built tjs into an openbsd@7.6 probe
    # (ld.so: can't load libc) and a 10.1-built one into netbsd@9.x
    # (Undefined PLT symbol) — silently smoking the WRONG binary; a bumped
    # pin (Renovate's included) would do the same. ImageOS is a hosted-runner
    # machine env var (macos14/ubuntu24/...), not in the env context — read
    # it in its own step. For guest legs it names the HOST image (irrelevant
    # to the artifact; occasionally invalidates a cache early — harmless).
    - name: Cache axes (runner image)
      id: axes
      shell: bash
      run: echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
    # The engine-source half of the key is now COMPUTED, not inlined. It used to
    # be a literal hashFiles('spike/quickjs/PINS.md', 'spike/quickjs/patches/
    # *.patch', 'scripts/build-tjs.mjs', 'scripts/*.toolchain.cmake', 'spike/
    # quickjs/atomic-shim.c', 'ci/osxcross-darwin/Dockerfile') — a good list, and
    # the ONLY place in the repo that said what an engine is made of. Anything
    # ELSE that needs that answer (scripts/templates-drift.mjs, which asks
    # whether the PUBLISHED engine templates were built from these same sources)
    # would have had to copy it, and a copied list is a list that drifts —
    # see test/release-gate-globs.test.cjs for what that costs. So the list moved
    # into scripts/engine-recipe.mjs and this reads it from there. Node is
    # already required on the host before this point (the asset-name step runs
    # canonical-name.cjs), and git is present from actions/checkout.
    #
    # This DOES change the key's value once, so every leg rebuilds its engine on
    # the first run after this lands. That is a one-time cost on a cache that
    # already invalidates whenever any patch moves (14 times since v0.20260801.2).
    - name: Engine recipe (the identity of the engine sources)
      id: recipe
      shell: bash
      run: echo "hash=$(node scripts/engine-recipe.mjs)" >> "$GITHUB_OUTPUT"
    - name: Restore the built tjs (PINS+patches+recipe+build-env keyed)
      id: tjs-cache
      uses: actions/cache@v6.1.0
      with:
        path: ${{ steps.mode.outputs.out }}
        key: tjs-${{ inputs.leg }}-${{ steps.axes.outputs.image }}-${{ inputs.guest-version }}-${{ inputs.macos-min }}-${{ inputs.macos-sdk }}-${{ inputs.cross-image }}-${{ inputs.cross-dockerfile }}-${{ steps.recipe.outputs.hash }}

    - name: Force LF line endings for the tjs checkout (native Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf

    # Windows legs are exec=host, not exec=guest, so the probe folded into the
    # guest script block never runs for them — this is the equivalent
    # reports-only invocation. Non-gating: task 6 is measurement only.
    - name: Probe scratch exec-ability (native Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: node scripts/exec-probe.mjs || true

    - name: Construct the patched tjs tree from pins (host, native speed)
      if: steps.tjs-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        CLODE_TJS_VENDOR: ${{ steps.mode.outputs.vendor }}
        # cosmo: the source phase applies the two named cosmo patches (they are
        # OUT of the auto-apply globs), so it needs the target token too.
        CLODE_TJS_TARGET: ${{ inputs.cosmo == 'true' && 'cosmo' || '' }}
      run: node scripts/build-tjs.mjs --source-only

    - name: Install the runtime dep closure (fuse member inputs)
      shell: bash
      run: npm ci --prefix deps/claude

    - name: esbuild the clode-main bundle
      shell: bash
      run: node scripts/build-clode-main.mjs

    # The honest-floor SDK (darwin-x64 floor walk, spec 2026-07-11): build
    # against the REAL old headers so every post-floor API is a compile
    # error, not a weak-linked runtime crash on old hardware. The pin is
    # permanent (phracker/MacOSX-SDKs is archived) — no Renovate entry; the
    # sha256 fails the build on any drift.
    - name: Restore the pinned macOS SDK
      if: steps.tjs-cache.outputs.cache-hit != 'true' && inputs.guest-platform == 'native' && inputs.macos-sdk != ''
      id: sdk-cache
      uses: actions/cache@v6.1.0
      with:
        path: ${{ runner.temp }}/MacOSX${{ inputs.macos-sdk }}.sdk
        # v2: the SDK dir now carries the Csu-built crt1.10.6.o graft.
        key: macos-sdk-${{ inputs.macos-sdk }}-v2
    - name: Fetch the pinned macOS SDK
      if: steps.tjs-cache.outputs.cache-hit != 'true' && inputs.guest-platform == 'native' && inputs.macos-sdk != ''
      id: sdk
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.macos-sdk }}" in
          10.6)
            URL="https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX10.6.sdk.tar.xz"
            SHA="ad93f3e25c1ee71e457ced1a9c106c2e6741afb96252f259a5b7c625d1156fe8" ;;
          # 10.4u ships its own startup objects (usr/lib/crt1.o, fat
          # ppc/i386/ppc64/x86_64) — no Csu graft, unlike the stripped
          # 10.6 repack.
          10.4u)
            URL="https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX10.4u.sdk.tar.xz"
            SHA="d28276ce6b0f14af30f3bfdc171f8ef4033652da593578568f8be189506c1021" ;;
          *) echo "ERROR: unknown macos-sdk id '${{ inputs.macos-sdk }}'" >&2; exit 1 ;;
        esac
        DEST="${{ runner.temp }}/MacOSX${{ inputs.macos-sdk }}.sdk"
        if [ ! -d "$DEST/usr/include" ]; then
          curl -fsSL -o "${{ runner.temp }}/sdk.tar.xz" "$URL"
          echo "$SHA  ${{ runner.temp }}/sdk.tar.xz" | shasum -a 256 -c -
          tar -xJf "${{ runner.temp }}/sdk.tar.xz" -C "${{ runner.temp }}"
          test -d "$DEST/usr/include"
        fi
        # phracker repacks strip the startup objects, and every pre-10.8
        # deployment target needs crt1.10.6.o (10.8+ switched to LC_MAIN) —
        # probe 1 (run 29165326041) died on exactly this. Build it from
        # Apple's open-source Csu (APSL) and graft it into the SDK: the v3
        # recipe from Csu-85's own Makefile, proven locally 2026-07-11
        # (816-byte .o; hello-world links and carries LC_VERSION_MIN 10.6).
        if [ "${{ inputs.macos-sdk }}" = "10.6" ] && [ ! -f "$DEST/usr/lib/crt1.10.6.o" ]; then
          CSU_URL="https://github.com/apple-oss-distributions/Csu/archive/refs/tags/Csu-85.tar.gz"
          CSU_SHA="87a6bfb1030455e17128d5803e02815e35a1c8bd8bda7bd7f4141431a4d0eac6"
          curl -fsSL -o "${{ runner.temp }}/csu.tar.gz" "$CSU_URL"
          echo "$CSU_SHA  ${{ runner.temp }}/csu.tar.gz" | shasum -a 256 -c -
          tar -xzf "${{ runner.temp }}/csu.tar.gz" -C "${{ runner.temp }}"
          cc -r -arch x86_64 -Os -mmacosx-version-min=10.6 -isysroot "$DEST" \
            -nostdlib -keep_private_externs \
            "${{ runner.temp }}/Csu-Csu-85/start.s" "${{ runner.temp }}/Csu-Csu-85/crt.c" \
            -o "$DEST/usr/lib/crt1.10.6.o" -DADD_PROGRAM_VARS
          test -f "$DEST/usr/lib/crt1.10.6.o"
        fi
        echo "path=$DEST" >> "$GITHUB_OUTPUT"

    - name: Activate the MSVC dev environment (native Windows cl.exe leg)
      if: runner.os == 'Windows' && steps.tjs-cache.outputs.cache-hit != 'true' && inputs.msvc == 'true'
      uses: ilammy/msvc-dev-cmd@v1.13.0
      with:
        arch: ${{ inputs.msvc-arch }}

    # cosmo: cache the provisioned cosmocc toolchain (a 441MB download) so only
    # the first build on a fresh runner pays for it. build-tjs's provisionCosmocc
    # sha256-verifies against the pin regardless, so a stale/partial cache can't
    # poison the build. Keyed on the pinned cosmocc version (bump = new cache).
    - name: Cache the cosmocc toolchain (cosmo APE leg)
      if: inputs.cosmo == 'true' && steps.tjs-cache.outputs.cache-hit != 'true'
      uses: actions/cache@v6.1.0
      with:
        path: ~/.cache/clode/cosmocc
        key: cosmocc-4.0.2

    # netbsd-src legs are exec=cross but keep guest-platform 'native' (they run
    # on the ubuntu runner), so they must be excluded here too — else this host
    # build pre-populates tjs-out (runner.temp, not the checkout) with an x86-64 CMakeCache that the
    # later NetBSD cross-build (--build-only) reuses (CMake caches the compiler
    # per build dir), silently shipping a HOST binary. Caught the m68k leg
    # 2026-07-14 (run 29354107445 uploaded an x86-64 ELF labeled netbsd-m68k).
    - name: Build tjs (native)
      if: steps.tjs-cache.outputs.cache-hit != 'true' && inputs.guest-platform == 'native' && inputs.cross-image == '' && inputs.cross-dockerfile == '' && inputs.netbsd-src == ''
      shell: bash
      env:
        CLODE_TJS_VENDOR: ${{ steps.mode.outputs.vendor }}
        CLODE_TJS_OUT: ${{ steps.mode.outputs.out }}
        CLODE_TJS_STATIC: ${{ inputs.static == 'true' && '1' || '' }}
        CLODE_TJS_WASM: ${{ inputs.wasm }}
        CLODE_TJS_MIMALLOC: ${{ inputs.mimalloc }}
        CLODE_TJS_FFI: ${{ inputs.ffi }}
        CLODE_TJS_MACOS_MIN: ${{ inputs.macos-min }}
        CLODE_TJS_MACOS_SDK: ${{ steps.sdk.outputs.path }}
        CLODE_TJS_MACOS_ARCH: ${{ inputs.macos-arch }}
        CLODE_TJS_SMOKE: ${{ inputs.no-exec == 'true' && 'off' || 'on' }}
        # cosmo: CLODE_TJS_TARGET=cosmo makes build-tjs provision cosmocc, drive
        # scripts/cosmo.toolchain.cmake, force the lean profile, and build the
        # tjs-cli APE. Inert ('') for every other native leg. The wasm/mimalloc/
        # ffi env above is already 'off' for the cosmo leg (tjs-legs.mjs).
        CLODE_TJS_TARGET: ${{ inputs.cosmo == 'true' && 'cosmo' || '' }}
        # Windows compiler: build-tjs.mjs now defaults to MSVC (cl) on win32, so the
        # msvc legs need no explicit flag (the msvc-dev-cmd step above puts cl + the
        # Windows SDK + ninja on PATH). mingw is retired — kept only as the explicit
        # opt-in for a hypothetical non-msvc Windows leg.
        CLODE_TJS_WIN_MINGW: ${{ runner.os == 'Windows' && inputs.msvc != 'true' && '1' || '' }}
      run: node scripts/build-tjs.mjs --build-only

    - name: Build tjs (alpine guest)
      if: steps.tjs-cache.outputs.cache-hit != 'true' && inputs.guest-platform == 'alpine'
      uses: ./.github/actions/guest
      with:
        platform: ${{ inputs.guest-platform }}
        arch: ${{ inputs.guest-arch }}
        version: ${{ inputs.guest-version }}
        packages: build-base cmake git linux-headers nodejs
        cache-key: tjs-${{ inputs.leg }}
        script: |
          export CLODE_TJS_VENDOR="${{ steps.mode.outputs.vendor }}"
          export CLODE_TJS_OUT="${{ steps.mode.outputs.out }}"
          export CLODE_TJS_STATIC="${{ inputs.static == 'true' && '1' || '' }}"
          export CLODE_TJS_WASM="${{ inputs.wasm }}"
          export CLODE_TJS_MIMALLOC="${{ inputs.mimalloc }}"
          export CLODE_TJS_FFI="${{ inputs.ffi }}"
          node scripts/build-tjs.mjs --build-only

    # Cross-build the engine inside a toolchain image on the ubuntu runner —
    # the generic exec=cross path. The source phase already ran on the host
    # (node + esbuild), so the container drives build-tjs --build-only against
    # the bind-mounted patched tree using the LEG's toolchain file
    # (inputs.cross-file) + atomic-shim policy (inputs.atomic-shim). Two image
    # styles: (a) a BAKED-toolchain image (darwin-ppc's VariantXYZ: cmake +
    # cross gcc + 10.4u SDK all baked, cross-apt empty); (b) a stock Debian
    # image where the leg names its toolchain via cross-apt (cmake + make +
    # gcc-<triple> + g++-<triple>). node comes from apt if the image lacks it.
    # Canonical-LE means the shipped LE bundles boot on every-endian targets —
    # no regen. atomic-shim links the __atomic_*_8 pthread shim for 32-bit
    # targets lacking 8-byte libatomic (darwin-ppc: run 29182716872; m68k).
    # Option-2 (darwin osxcross): build the toolchain image IN CI with GHA layer
    # caching instead of pulling a registry image — the phracker Apple SDKs are
    # fetched during the build and never re-hosted. Cache-hit reuses the identical
    # image; only a cache miss (Dockerfile change / ~7-day eviction) pays the
    # ~20-min osxcross compile. Loaded as a local tag the run step below consumes.
    - name: Set up buildx (cross-dockerfile legs)
      if: steps.tjs-cache.outputs.cache-hit != 'true' && inputs.cross-dockerfile != ''
      uses: docker/setup-buildx-action@v4.3.0
    - name: Build the cross-toolchain image (GHA-cached, no registry)
      if: steps.tjs-cache.outputs.cache-hit != 'true' && inputs.cross-dockerfile != ''
      uses: docker/build-push-action@v7.3.0
      with:
        context: ${{ inputs.cross-dockerfile }}
        load: true
        tags: clode-cross-toolchain:${{ inputs.leg }}
        cache-from: type=gha,scope=xc-${{ inputs.leg }}
        cache-to: type=gha,mode=max,scope=xc-${{ inputs.leg }}

    - name: Build tjs (cross container)
      if: steps.tjs-cache.outputs.cache-hit != 'true' && (inputs.cross-image != '' || inputs.cross-dockerfile != '')
      shell: bash
      env:
        CROSS_APT: ${{ inputs.cross-apt }}
        CROSS_FILE: ${{ inputs.cross-file }}
        ATOMIC_SHIM: ${{ inputs.atomic-shim == 'true' && '1' || '0' }}
        DARWIN_POLL: ${{ inputs.darwin-poll == 'true' && '1' || '0' }}
        WASM: ${{ inputs.wasm }}
        MIMALLOC: ${{ inputs.mimalloc }}
        FFI: ${{ inputs.ffi }}
        CROSS_IMAGE: ${{ inputs.cross-image }}
      run: |
        set -euo pipefail
        # cross-image → pull the pinned registry image (ppc); else use the local
        # tag the buildx step just loaded (darwin osxcross, built from Dockerfile).
        if [ -n "$CROSS_IMAGE" ]; then IMG="$CROSS_IMAGE"; docker pull "$IMG";
        else IMG="clode-cross-toolchain:${{ inputs.leg }}"; fi
        docker run --rm \
          -e CROSS_APT -e CROSS_FILE -e ATOMIC_SHIM -e DARWIN_POLL -e WASM -e MIMALLOC -e FFI \
          -v "${{ github.workspace }}:/w" -v "${{ runner.temp }}:/scratch" -w /w "$IMG" bash -c '
          set -euxo pipefail
          if [ -n "$CROSS_APT" ]; then apt-get update -q && apt-get install -y -q $CROSS_APT >/dev/null; fi
          if ! command -v node >/dev/null; then apt-get update -q && apt-get install -y -q nodejs >/dev/null 2>&1; fi
          node --version
          # /scratch is runner.temp bind-mounted alongside /w: vendor (already
          # constructed on the host by the earlier native "Construct the
          # patched tjs tree" step, at the same runner.temp path) and the
          # engine this build produces both live there, not in the checkout.
          # /w stays mounted only for the repo sources build-tjs.mjs reads and
          # for CROSS_FILE.
          mkdir -p /scratch/tjs-vendor /scratch/tjs-out
          export CLODE_TJS_VENDOR=/scratch/tjs-vendor
          export CLODE_TJS_OUT=/scratch/tjs-out
          export CLODE_TJS_CROSS_FILE=/w/$CROSS_FILE
          export CLODE_TJS_ATOMIC_SHIM=$ATOMIC_SHIM
          export CLODE_TJS_DARWIN_POLL=$DARWIN_POLL
          export CLODE_TJS_WASM=$WASM CLODE_TJS_MIMALLOC=$MIMALLOC CLODE_TJS_FFI=$FFI CLODE_TJS_SMOKE=off
          node scripts/build-tjs.mjs --build-only
        '

    # ---- NetBSD build.sh cross legs (netbsd-m68k): the other exec=cross path.
    # Instead of a docker toolchain image, a NetBSD build.sh cross-toolchain +
    # sysroot are produced on the runner (the showcase — any NetBSD arch is one
    # build.sh command), then build-tjs cross-compiles against them via the
    # netbsd-<arch> CMake toolchain file. No docker; the cross gcc is an x86_64
    # binary emitting m68k NetBSD ELF. atomic-shim on (m68k lacks 8-byte
    # libatomic, like sparc/ppc). The build.sh toolchain is heavy but cached in
    # the composite, and only runs on a tjs-cache miss.
    - name: Build the NetBSD cross-toolchain (build.sh)
      id: nbxc
      if: steps.tjs-cache.outputs.cache-hit != 'true' && inputs.netbsd-src != ''
      uses: ./.github/actions/netbsd-crossbuild
      with:
        machine: ${{ inputs.netbsd-machine }}
        arch: ${{ inputs.netbsd-arch }}
        src-rev: ${{ inputs.netbsd-src }}
        sysroot-mode: ${{ inputs.netbsd-sysroot }}
    - name: Cross-build tjs against the NetBSD toolchain
      if: steps.tjs-cache.outputs.cache-hit != 'true' && inputs.netbsd-src != ''
      shell: bash
      env:
        CLODE_TJS_VENDOR: ${{ steps.mode.outputs.vendor }}
        CLODE_TJS_OUT: ${{ steps.mode.outputs.out }}
        CLODE_TJS_CROSS_FILE: ${{ inputs.cross-file }}
        CLODE_NETBSD_TOOLDIR: ${{ steps.nbxc.outputs.tooldir }}
        CLODE_NETBSD_DESTDIR: ${{ steps.nbxc.outputs.destdir }}
        CLODE_TJS_ATOMIC_SHIM: ${{ inputs.atomic-shim == 'true' && '1' || '0' }}
        CLODE_TJS_WASM: ${{ inputs.wasm }}
        CLODE_TJS_MIMALLOC: ${{ inputs.mimalloc }}
        CLODE_TJS_FFI: ${{ inputs.ffi }}
        CLODE_TJS_SMOKE: 'off'
      run: node scripts/build-tjs.mjs --build-only

    # ---- own-qemu qemu-* legs (netbsd-sparc: first user, plan
    # netbsd-sparc-matrix-leg Task 3 — STRUCTURAL first pass). Unlike a
    # guest/cross leg (fuse + smoke run wholly inside/under the foreign
    # environment), a qemu-* leg splits three ways because the guest has no
    # node (guest-sparc-*.sh's cc/cmake/gmake-direct recipes, not
    # build-tjs.mjs): (A) here — the ENGINE alone bakes in-guest via the
    # own-qemu backend on a tjs-cache miss, synced OUT to
    # steps.mode.outputs.out by the backend (Task 4 tunes the exact recipe +
    # sync — the GUEST-DONE/*-exit marker vocabulary already used by
    # spike/quickjs/qemu/guest-sparc-*.sh); (B) below — the clode --self
    # BUILDER cross-fuses ON the x64 runner; (C) further below — the SMOKE
    # hands the backend a recipe. Guarded so every other leg (exec=host/
    # guest/cross, windows) is untouched.
    - name: Prepare the pinned tjs source + simde for the in-guest engine bake (qemu-* cache miss)
      if: steps.tjs-cache.outputs.cache-hit != 'true' && startsWith(inputs.guest-platform, 'qemu-')
      shell: bash
      env:
        CLODE_TJS_VENDOR: ${{ steps.mode.outputs.vendor }}
      run: |
        set -euo pipefail
        # The patched canonical-LE txiki source (clones txiki + quickjs-ng, applies
        # patches/ — incl. the canonical-LE bytecode patch the cross-fuse REQUIRES;
        # a non-canonical-LE engine gives "checksum error" on the cross-fused
        # builder — proven in the docker-loop wall-walk 2026-07-14) was ALREADY
        # constructed at $CLODE_TJS_VENDOR by the "Construct the patched tjs tree
        # from pins" step above (same --source-only, same vendor). Do NOT re-run it
        # here: patches now apply unconditionally onto a PRISTINE clone (no
        # already-applied fallback), so a second --source-only over the patched
        # tree fails at the first patch.
        #
        # REGENERATE THE BYTECODE HERE, on the runner, before tarring. txiki
        # git-tracks src/bundles/c/** as pre-compiled bytecode of its OWN
        # src/js/**, so our src/js/** patches (the JS half of
        # txiki-engine-module-meta.patch, and everything after it) reach a binary
        # only through a tjsc regen. Every other leg gets that from build-tjs.mjs's
        # own build phase; the guest bake compiles by hand and cannot run node at
        # all, so it used to get NO regen — and shipped an engine whose fuse died
        # with "this engine does not report moduleMeta" after a 927-second carve.
        # --regen-only runs the SAME generation code, using a host-native tjsc
        # whose canonical-LE output is valid for the sparc target by construction
        # (scripts/build-tjs.mjs, buildHostTjsc). ci-guest-bake.sh refuses a tree
        # that arrives without the regen trailer, so this cannot be dropped again.
        node scripts/build-tjs.mjs --regen-only
        mkdir -p .matrix/qemu-bake
        tar czf .matrix/qemu-bake/txiki-canonical-le.tar.gz -C "$CLODE_TJS_VENDOR" txiki.js
        # The shared engine-API floor check the bake runs against the engine it
        # just built (ONE list, scripts/engine-api-floor.mjs — not a fourth
        # hand-written `typeof __tjs_fs_sync` copy).
        node scripts/engine-api-floor.mjs --emit-check > .matrix/qemu-bake/engine-api-floor.js
        # simde (txiki v26.6.0 pins v0.8.2 — the guest build is offline, so stage
        # it; repackage so it extracts to simde-src/ as the bake recipe expects).
        curl -fsSL https://github.com/simd-everywhere/simde/archive/refs/tags/v0.8.2.tar.gz -o "$RUNNER_TEMP/simde.tgz"
        rm -rf "$RUNNER_TEMP/simde-src"; mkdir -p "$RUNNER_TEMP/simde-src"
        tar xzf "$RUNNER_TEMP/simde.tgz" -C "$RUNNER_TEMP/simde-src" --strip-components=1
        tar czf .matrix/qemu-bake/simde-v0.8.2.tar.gz -C "$RUNNER_TEMP" simde-src

    - name: Load the sparc bake recipe (single committed source)
      id: bake-recipe
      if: steps.tjs-cache.outputs.cache-hit != 'true' && startsWith(inputs.guest-platform, 'qemu-')
      shell: bash
      run: |
        set -euo pipefail
        { echo 'script<<CLODE_BAKE_EOF'
          cat spike/quickjs/qemu/ci-guest-bake.sh
          echo 'CLODE_BAKE_EOF'; } >> "$GITHUB_OUTPUT"

    - name: Bake the sparc engine in-guest (own-qemu, qemu-* cache miss)
      if: steps.tjs-cache.outputs.cache-hit != 'true' && startsWith(inputs.guest-platform, 'qemu-')
      uses: ./.github/actions/guest
      with:
        platform: ${{ inputs.guest-platform }}
        arch: ${{ inputs.guest-arch }}
        version: ${{ inputs.guest-version }}
        # BAKED image (gmake+cmake preinstalled) for the cache-miss bake — see CI-IMAGES.md.
        cache-key: wd0-baked-${{ inputs.guest-version }}-gmake-cmake.img.zst
        # Distinct from the smoke's below: both invocations share one workdir
        # and the smoke's driver truncates this console log, so this artifact
        # has to be taken here, under its own name.
        log-name: ${{ inputs.leg }}-bake
        script: ${{ steps.bake-recipe.outputs.script }}

    - name: Decode + verify the synced-out sparc engine (qemu-* cache miss)
      if: steps.tjs-cache.outputs.cache-hit != 'true' && startsWith(inputs.guest-platform, 'qemu-')
      shell: bash
      run: |
        set -euo pipefail
        # The bake syncs the tjs OUT as a gzip|base64 block on the serial console;
        # ci-sparc-driver.py wrote that console to $CI_SPARC_WORKDIR (set in
        # GITHUB_ENV by the guest action). Decode it to steps.mode.outputs.out/tjs
        # (where the cross-fuse reads CLODE_TARGET_TEMPLATE, and what the tjs-cache
        # saves). Verify against the guest's cksum marker.
        LOG="$CI_SPARC_WORKDIR/ci-sparc-console.log"
        test -f "$LOG" || { echo "no console log at $LOG" >&2; exit 1; }
        OUT="${{ steps.mode.outputs.out }}"; mkdir -p "$OUT"
        awk '/TJS-GZB64-BEGIN/{f=1;next} /TJS-GZB64-END/{f=0} f' "$LOG" \
          | tr -d '\r' | grep -E '^[A-Za-z0-9+/=]+$' | base64 -d | gunzip > "$OUT/tjs"
        chmod +x "$OUT/tjs"
        want=$(grep -oE 'bake-tjs-cksum=[0-9]+ bake-tjs-len=[0-9]+' "$LOG" | tail -1)
        got=$(cksum "$OUT/tjs" | awk '{print "bake-tjs-cksum="$1" bake-tjs-len="$2}')
        echo "want: $want"; echo "got : $got"
        { [ -n "$want" ] && [ "$want" = "$got" ]; } || { echo "engine sync-out cksum/len mismatch" >&2; exit 1; }
        file "$OUT/tjs"

    # (B) Cross-fuse the clode --self BUILDER on the x64 runner, targeting
    # the sparc engine synced out above (the retired windows cross-file
    # leg's mechanism — git show 594f53c~1 — adapted for sparc): build a
    # HOST (linux) tjs to run the fuse worker, then fuse against the
    # foreign-arch TEMPLATE via CLODE_TARGET_TEMPLATE. Unlike windows (whose
    # no-exec native build already produced a bare tjs.exe locally), the
    # sparc bare engine only exists after the guest step above (or a
    # tjs-cache hit) landed it at steps.mode.outputs.out.
    - name: Cross-fuse the qemu-* builder against the in-guest engine
      if: startsWith(inputs.guest-platform, 'qemu-')
      uses: ./.github/actions/cross-fuse
      with:
        target-template: ${{ steps.mode.outputs.out }}/tjs
        out-asset: ${{ steps.name.outputs.asset }}

    # Tier-2 cross legs (linux-s390x/riscv64, netbsd-m68k): the exec=cross
    # build above cross-compiled a foreign-ELF engine to steps.mode.outputs.out
    # that this ubuntu runner cannot execute (no-exec). Cross-fuse a tier-2
    # clode BUILDER against it on the runner exactly like the qemu-* path (host
    # linux tjs runs the fuse worker; CLODE_TARGET_TEMPLATE = the foreign
    # engine). ELF-only — darwin cross legs are excluded (Mach-O needs a
    # pre-signed template). Validation is verify=qemu-user|none (Task 3), not a
    # host exec. Because these legs are no-exec, the normal fuse/upload path is
    # skipped, so this block owns the builder artifact upload.
    # Arch gate (all tier-2 cross legs): the cross-built engine MUST be the
    # target arch, not the host. A cross leg that emits an x86-64 binary means
    # the toolchain file was bypassed (e.g. a stale host CMakeCache — the m68k
    # bug, run 29354107445). For verify=none legs (m68k) nothing runs the
    # binary, so this `file` check is the ONLY arch proof — fail loud here,
    # before a wrong-arch builder is fused + uploaded.
    - name: Arch gate — the cross-built engine is the target arch, not the host
      if: inputs.tier2 == 'true'
      shell: bash
      env:
        ARCH: ${{ inputs.guest-arch }}
      run: |
        set -euo pipefail
        f=$(file -b "${{ steps.mode.outputs.out }}/tjs"); echo "engine: $f"
        echo "$f" | grep -qiE 'x86-64|x86_64' \
          && { echo "ERROR: cross engine is host x86-64 — the $ARCH toolchain was not used" >&2; exit 1; } || true
        case "$ARCH" in
          riscv64) want='RISC-V' ;;
          s390x)   want='S/390' ;;
          m68k)    want='Motorola|m68k' ;;
          sparc64) want='SPARC' ;;
          alpha)   want='Alpha' ;;
          hppa)    want='PA-RISC' ;;
          powerpc) want='PowerPC' ;;
          mipsel|mipseb|mips64eb) want='MIPS' ;;
          i386)    want='80386|Intel 386' ;;
          earmv7hf) want='ARM' ;;
          sh3el)   want='Renesas SH|SuperH|SH,' ;;
          *)       want='' ;;
        esac
        if [ -n "$want" ]; then
          echo "$f" | grep -qiE "$want" \
            || { echo "ERROR: engine is not $ARCH (want /$want/) — got: $f" >&2; exit 1; }
        fi
        echo "arch gate ok: $ARCH"

    - name: Cross-fuse the tier-2 builder against the cross-built engine
      if: inputs.tier2 == 'true'
      uses: ./.github/actions/cross-fuse
      with:
        target-template: ${{ steps.mode.outputs.out }}/tjs
        out-asset: ${{ steps.name.outputs.asset }}

    - name: Upload the tier-2 cross-fused builder
      if: inputs.tier2 == 'true'
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ inputs.publish == 'true' && steps.name.outputs.asset || format('smoke-{0}', steps.name.outputs.asset) }}
        path: ${{ steps.name.outputs.asset }}
        if-no-files-found: error

    # Validate the cross-fused builder under qemu-user (verify=qemu-user, the
    # s390x/riscv64 tier-2 legs). docker/setup-qemu-action registers binfmt, then
    # the foreign ELF runs INSIDE a matching-arch Debian rootfs (the runner has
    # no target glibc — the alpine musl legs get away with bare-host binfmt only
    # because they are fully static; these are glibc cross builds, so they need a
    # target libc, and the rootfs provides it). libatomic is linked statically
    # (toolchain file), so glibc is the only runtime dep. level-2 = the builder
    # self-loads + prints its version (proves the bootstrap canonical-LE bytecode
    # reads + runs on $ARCH — for 64-bit-BE s390x this IS the
    # canonical-LE-on-64-bit-BE runtime proof). level-2.5 = the full fuse+PONG in
    # the same rootfs (provider carved on the x64 host), ATTEMPTED and its outcome
    # LOGGED — never a silent downgrade; tier-2 stands on level-2 either way.
    - name: Register qemu-user binfmt (verify=qemu-user)
      if: inputs.verify == 'qemu-user'
      uses: docker/setup-qemu-action@v4.2.0
    - name: Validate the tier-2 builder under qemu-user (verify=qemu-user)
      if: inputs.verify == 'qemu-user'
      shell: bash
      env:
        ARCH: ${{ inputs.guest-arch }}          # s390x | riscv64
        ASSET: ${{ steps.name.outputs.asset }}
        ROOTFS: ${{ inputs.guest-arch }}/debian:trixie-slim
      run: |
        set -euo pipefail
        # level-2 (required): self-load + version, foreign ELF under binfmt in a
        # target-arch glibc rootfs.
        docker run --rm --platform "linux/$ARCH" -v "$PWD:/w" -w /w "$ROOTFS" \
          ./"$ASSET" --version | tee "$RUNNER_TEMP/qu-ver.txt"
        grep -qE '^clode ' "$RUNNER_TEMP/qu-ver.txt" \
          || { echo "level-2 FAILED: no 'clode <ver>' from the $ARCH builder under qemu-user" >&2; exit 1; }
        echo "level-2 (self-load) OK on $ARCH"
        # level-2.5 (attempted, logged): the full fuse+PONG. The fuse compiles the
        # 19MB cli.cjs under the emulated engine — slow/heavy; if qemu-user cannot
        # carry it, record the bound and keep the leg green on level-2. The
        # minimal provider is carved on the x64 host (fast), then read in-rootfs.
        V=$(sed -n 's/^claude-code //p' UPSTREAM_PIN)
        echo "provider pin: @anthropic-ai/claude-code@$V (deliberately behind upstream — see UPSTREAM_PIN)"
        npm i -g @anthropic-ai/claude-code@"$V" 2>&1 | tail -3
        PROV="$(node scripts/stage-provider.mjs --out .matrix/qu-provider)" || exit 1
        echo "provider: $PROV"
        # The level-2.5 RESULT is still soft (qemu-user may not carry a full build, and
        # that is a recorded bound, not a fault). STAGING a provider is not soft: it is
        # the same step on every leg and it fails the same way. Conflating the two is
        # what let "our minimiser is broken" print as "no provider available to carve".
        if docker run --rm --platform "linux/$ARCH" -v "$PWD:/w" -w /w \
             -e CLODE_CLAUDE_BIN=/w/.matrix/qu-provider/provider-min -e CLODE_CACHE=/w/.matrix/qu-cache \
             "$ROOTFS" ./"$ASSET" build --out /w/.matrix/quaude-qu \
             2>&1 | tee "$RUNNER_TEMP/qu-fuse.txt" | grep -q 'PONG round-trip ok'; then
          echo "level-2.5 (full fuse+PONG under qemu-user) OK on $ARCH"
        else
          echo "level-2.5 NOT achieved on $ARCH (qemu-user could not carry the full fuse) — tier-2 self-load stands; see the log above."
        fi
        rm -f .matrix/quaude-qu

    # (C) The runtime smoke: hand the own-qemu backend a recipe that stages
    # the cross-fused sparc clode builder + an x64 provider binary on :8180
    # and runs clode-on-sparc to `build --out quaude` + a PONG check. Uses
    # the PRISTINE image (no toolchain needed for a runtime smoke) — see
    # CI-IMAGES.md.
    - name: Stage the builder + minimal provider for the own-qemu smoke (qemu-* legs)
      if: startsWith(inputs.guest-platform, 'qemu-') && inputs.smoke == 'full' && inputs.verify == 'smoke'
      shell: bash
      run: |
        set -uo pipefail
        V=$(sed -n 's/^claude-code //p' UPSTREAM_PIN)
        echo "provider pin: @anthropic-ai/claude-code@$V (deliberately behind upstream — see UPSTREAM_PIN)"
        npm i -g @anthropic-ai/claude-code@"$V" 2>&1 | tail -3
        PROV="$(node scripts/stage-provider.mjs)" || exit 1
        echo "provider: $PROV"
        mkdir -p .matrix/qemu-smoke
        # Pre-carve the 240MB Bun provider to a ~17.5MB synthetic provider: the
        # in-guest carve of the full binary OOMs the 512MB sun4m + is TCG-glacial
        # (>35min); the minimal one fits and is fast. Arch-independent — the
        # extracted cli.cjs is identical. (proven: docker-loop wall-walk 2026-07-14)
        cp "$PROV" .matrix/qemu-smoke/provider-min
        cp "${{ steps.name.outputs.asset }}" .matrix/qemu-smoke/clode-builder

    - name: Load the sparc smoke recipe (single committed source)
      id: smoke-recipe
      if: startsWith(inputs.guest-platform, 'qemu-') && inputs.smoke == 'full' && inputs.verify == 'smoke'
      shell: bash
      run: |
        set -euo pipefail
        { echo 'script<<CLODE_SMOKE_EOF'
          cat spike/quickjs/qemu/ci-guest-smoke.sh
          echo 'CLODE_SMOKE_EOF'; } >> "$GITHUB_OUTPUT"

    - name: Smoke via the own-qemu backend (qemu-* legs)
      if: startsWith(inputs.guest-platform, 'qemu-') && inputs.smoke == 'full' && inputs.verify == 'smoke'
      uses: ./.github/actions/guest
      with:
        platform: ${{ inputs.guest-platform }}
        arch: ${{ inputs.guest-arch }}
        version: ${{ inputs.guest-version }}
        cache-key: wd0-pristine-${{ inputs.guest-version }}.img.zst
        # The proven fuse+PONG recipe (spike/quickjs/qemu/ci-guest-smoke.sh): fetch
        # clode-builder + provider-min over :8180, clode-on-sparc fuses a quaude +
        # internal PONG/attest smoke. smoke-exit=0 == fused + PONG + attest.
        log-name: ${{ inputs.leg }}-smoke
        script: ${{ steps.smoke-recipe.outputs.script }}

    # A cache HIT skips the guest setup, so foreign-arch legs still need
    # fix-binary binfmt on the host to exec the cached tjs (fuse worker,
    # smokes). Cheap and idempotent.
    - name: Ensure qemu binfmt for foreign-arch host execution
      if: inputs.guest-platform == 'alpine' && inputs.guest-arch != 'x86_64' && runner.arch == 'X64'
      uses: docker/setup-qemu-action@v4.2.0

    - name: Stage the provider for the in-VM full smoke
      if: steps.mode.outputs.exec == 'guest' && inputs.smoke == 'full'
      shell: bash
      run: |
        set -uo pipefail
        V=$(sed -n 's/^claude-code //p' UPSTREAM_PIN)
        echo "provider pin: @anthropic-ai/claude-code@$V (deliberately behind upstream — see UPSTREAM_PIN)"
        npm i -g @anthropic-ai/claude-code@"$V" 2>&1 | tail -3
        PROV="$(node scripts/stage-provider.mjs)" || exit 1
        echo "provider: $PROV"
        mkdir -p .matrix
        cp "$PROV" .matrix/provider-claude   # bytes only — clode EXTRACTS from it, never execs it

    # The whole exec surface in one guest invocation: build tjs (unless the
    # cache delivered it), fuse the builder UNDER it, smoke the builder, and
    # have the builder build an ephemeral quaude (internal PONG + attest).
    # The guest's node only interprets our scripts; every exec'd artifact
    # (fuse worker, builder, quaude) is guest-native.
    - name: Build + fuse + smoke (inside the guest VM)
      if: steps.mode.outputs.exec == 'guest'
      uses: ./.github/actions/guest
      with:
        platform: ${{ inputs.guest-platform }}
        arch: ${{ inputs.guest-arch }}
        version: ${{ inputs.guest-version }}
        packages: ${{ inputs.guest-packages }}
        cache-key: tjs-${{ inputs.leg }}
        script: |
          # Scratch lives OUTSIDE the checkout wherever it CAN. $HOME is
          # guest-local and measured exec-able on every hardened image
          # (phase-1 Task 6, run 33552485691) — including the OpenBSD one
          # that forced this in the first place: /tmp is noexec there, which
          # is what made the fuse's mkdtemp-and-exec of its own template die
          # with exit 127 (dispatch #7) before .matrix existed as the
          # workaround. TMPDIR (the fuse's own scratch, and — via
          # build-tjs.mjs's localScratchRoot() — the CMake build dir, the
          # actual bulk of the reported ~23k files) and the full-smoke's own
          # CLODE_CACHE/CLODE_DEPS never need to leave this guest, so they
          # move to $CLODE_BUILD_SCRATCH under $HOME.
          #
          # tjs-vendor, tjs-out and provider-claude stay under $PWD/.matrix
          # (inside the checkout) because cpa.sh's ONLY channel to/from this
          # VM is an rsync of the WORKSPACE, nothing else: the vendor tree
          # has to arrive here that way (the host constructs it before this
          # step runs — see "Construct the patched tjs tree from pins"
          # above), the built engine has to leave the same way (the
          # host-side tjs-cache save and the unconditional "Upload the bare
          # tjs binary" step both read it back from the synced workspace
          # after this script returns), and provider-claude is bytes the
          # host staged for exactly this sync ("Stage the provider for the
          # in-VM full smoke" above). These three are load-bearing, not
          # vestigial — moving them to $HOME would silently strand the vendor
          # source / built engine on the VM and fail the job.
          CLODE_BUILD_SCRATCH="$HOME/clode-scratch"; export CLODE_BUILD_SCRATCH
          mkdir -p "$CLODE_BUILD_SCRATCH"
          TMPDIR="$CLODE_BUILD_SCRATCH/tmp"; export TMPDIR
          mkdir -p "$TMPDIR"
          # TCG-emulated guests run 10-20x slower than metal; scale the build
          # pipeline's hang guards accordingly (harmless on KVM legs — these
          # are guards, not pacing; dispatch #14 freebsd-arm64 finding).
          CLODE_TIMEOUT_SCALE=10; export CLODE_TIMEOUT_SCALE
          node scripts/exec-probe.mjs || true
          CLODE_TJS_VENDOR="$PWD/.matrix/tjs-vendor"; export CLODE_TJS_VENDOR
          CLODE_TJS_OUT="$PWD/.matrix/tjs-out"; export CLODE_TJS_OUT
          CLODE_TJS_WASM="${{ inputs.wasm }}"; export CLODE_TJS_WASM
          CLODE_TJS_MIMALLOC="${{ inputs.mimalloc }}"; export CLODE_TJS_MIMALLOC
          CLODE_TJS_FFI="${{ inputs.ffi }}"; export CLODE_TJS_FFI
          if [ ! -x "$CLODE_TJS_OUT/tjs" ]; then
            node scripts/build-tjs.mjs --build-only
          else
            echo "tjs cache hit: skipping the in-guest build"
          fi
          # The fuse needs only tjs-out + the repo tree; dropping the vendor
          # checkout (+ its object files) here spares the vm-to-runner sync —
          # it is reconstructable from pins and never cached.
          rm -rf "$CLODE_TJS_VENDOR"
          # Bare-engine spawn probe: separates "tjs spawn is broken on this
          # OS" from "something about the builder's specific spawn is" (the
          # openbsd exit-127 hunt, dispatch #9 — template bytes verified
          # perfect, exec still fails under the builder only).
          "$CLODE_TJS_OUT/tjs" eval 'tjs.spawn(["/bin/sh","-c","echo tjs-spawn-probe-ok"]).wait().then(function(r){console.log("tjs-spawn-exit:",JSON.stringify(r))})'
          # So any build/<artifact-name>/ this invocation touches matches the
          # SHIPPED name (floor included), not the guest's own honest,
          # floor-less OS version — see scripts/platform-tag.cjs's artifactDir.
          CLODE_ASSET_NAME="${{ steps.name.outputs.asset }}"; export CLODE_ASSET_NAME
          CLODE_TJS="$CLODE_TJS_OUT/tjs" node bin/clode build --self --out "./${{ steps.name.outputs.asset }}"
          ./"${{ steps.name.outputs.asset }}" --version
          if [ "${{ inputs.smoke }}" = full ]; then
            CLODE_CLAUDE_BIN="$PWD/.matrix/provider-claude" \
            CLODE_CACHE="$CLODE_BUILD_SCRATCH/clode-cache" \
            CLODE_DEPS="$CLODE_BUILD_SCRATCH/clode-deps" \
              ./"${{ steps.name.outputs.asset }}" build --out ./quaude-smoke
            rm -rf ./quaude-smoke
          fi

    - name: Verify the binary is truly static (musl legs)
      if: inputs.static == 'true'
      shell: bash
      run: |
        set -euo pipefail
        TJS="${{ steps.mode.outputs.out }}/tjs"
        f=$(file -b "$TJS"); echo "file: $f"
        case "${{ inputs.guest-arch }}" in
          x86_64) want="x86-64" ;;
          aarch64) want="aarch64" ;;
          s390x) want="S/390" ;;
          x86) want="80386" ;;
          armv7|armhf) want="ARM" ;;
          ppc64le) want="PowerPC" ;;
          riscv64) want="RISC-V" ;;
          loongarch64) want="LoongArch" ;;
          *) want="" ;;
        esac
        case "$f" in *"$want"*) ;; *) echo "ERROR: arch marker '$want' not in file output" >&2; exit 1 ;; esac
        case "$f" in *"statically linked"*|*"static-pie linked"*) ;; *) echo "ERROR: not statically linked" >&2; exit 1 ;; esac
        ldd "$TJS" 2>&1 | head -3 || true   # informational: expect "not a dynamic executable"

    # Resolves the built tjs path once ahead of the exec=host steps below
    # (.exe on native Windows, plain `tjs` everywhere else). Same shape as
    # `steps.bare` further down, but that resolver runs AFTER these steps
    # (it feeds the tail bare-tjs upload), so it can't be reused here
    # without reordering it — this is a second, narrower resolver instead.
    # exec=qemu is excluded throughout this block: the sparc engine cannot
    # host-exec on the x64 runner, and qemu-* legs fuse+smoke via the
    # dedicated cross-fuse + own-qemu-backend steps above instead.
    - name: Resolve the built tjs path (.exe on native Windows)
      id: tjsbin
      if: steps.mode.outputs.exec != 'guest' && steps.mode.outputs.exec != 'qemu'
      shell: bash
      run: |
        set -euo pipefail
        P="${{ steps.mode.outputs.out }}/tjs.exe"
        [ -f "$P" ] || P="${{ steps.mode.outputs.out }}/tjs"
        [ -f "$P" ]
        echo "path=$P" >> "$GITHUB_OUTPUT"

    - name: Host-exec smoke of the built tjs
      if: steps.mode.outputs.exec != 'guest' && steps.mode.outputs.exec != 'qemu' && inputs.no-exec != 'true'
      shell: bash
      run: |
        set -euo pipefail
        # The shared engine-API floor (scripts/engine-api-floor.mjs), not a second
        # hand-written copy of one typeof check. It prints MISSING-ENGINE-API: with
        # the binding name and the patch that provides it, then exits nonzero.
        node scripts/engine-api-floor.mjs --emit-check > "$RUNNER_TEMP/engine-api-floor.js"
        out=$("${{ steps.tjsbin.outputs.path }}" run "$RUNNER_TEMP/engine-api-floor.js")
        echo "tjs host-exec: $out"
        [ "$out" = tjs-shim-ok ]

    - name: Fuse the self-contained builder (clode build --self)
      if: steps.mode.outputs.exec != 'guest' && steps.mode.outputs.exec != 'qemu' && inputs.no-exec != 'true'
      shell: bash
      env:
        CLODE_TJS: ${{ steps.tjsbin.outputs.path }}
        # So any build/<artifact-name>/ this invocation touches matches the
        # SHIPPED name (floor included) instead of this runner's own honest,
        # floor-less OS version — see scripts/platform-tag.cjs's artifactDir.
        CLODE_ASSET_NAME: ${{ steps.name.outputs.asset }}
      run: node bin/clode build --self --out "${{ steps.name.outputs.asset }}"

    - name: Self-smoke --version (host exec of the fused builder)
      if: steps.mode.outputs.exec != 'guest' && steps.mode.outputs.exec != 'qemu' && inputs.no-exec != 'true'
      shell: bash
      run: |
        set -euo pipefail
        ./"${{ steps.name.outputs.asset }}" --version

    # Resolves the bare-engine path once (.exe on windows, plain `tjs`
    # everywhere else) — feeds the bare-tjs upload at the tail.
    - name: Resolve the bare-engine path (.exe on windows)
      id: bare
      shell: bash
      run: |
        set -euo pipefail
        P="${{ steps.mode.outputs.out }}/tjs.exe"
        [ -f "$P" ] || P="${{ steps.mode.outputs.out }}/tjs"
        [ -f "$P" ]
        echo "path=$P" >> "$GITHUB_OUTPUT"

    # The static floor gate: pre-10.14 dyld requires the old
    # LC_VERSION_MIN_MACOSX load command and refuses LC_BUILD_VERSION-only
    # binaries — and the version must be exactly the pinned floor. Gating
    # the SHIPPED asset (the fuse always runs) covers cache-hit paths too;
    # the floor-carrying cache key guarantees the cached tjs matches. On
    # no-exec legs there is no asset (nothing on the runner can exec the
    # target): gate the bare engine, plus its arch marker.
    # Cross legs run on ubuntu (no host otool): gate the bare engine with the
    # host `file` for the arch marker + the image's otool for the floor.
    - name: Floor gate (cross container) — ppc Mach-O + LC_VERSION_MIN_MACOSX
      if: inputs.macos-min != '' && inputs.cross-image != ''
      shell: bash
      run: |
        set -euo pipefail
        TJS="${{ steps.mode.outputs.out }}/tjs"
        f=$(file -b "$TJS"); echo "file: $f"
        case "$f" in *Mach-O*"${{ inputs.macos-arch }}"*) echo "arch marker ok" ;; *) echo "ERROR: not a ${{ inputs.macos-arch }} Mach-O" >&2; exit 1 ;; esac
        LC=$(docker run --rm -v "${{ runner.temp }}:/scratch" "${{ inputs.cross-image }}" \
          bash -c 'powerpc-apple-darwin8-otool -l /scratch/tjs-out/tjs')
        echo "$LC" | grep -q LC_BUILD_VERSION && { echo "ERROR: LC_BUILD_VERSION present — pre-10.14 dyld needs LC_VERSION_MIN_MACOSX" >&2; exit 1; } || true
        got=$(echo "$LC" | awk '/cmd LC_VERSION_MIN_MACOSX/{f=1} f && /version /{print $2; exit}')
        [ "$got" = "${{ inputs.macos-min }}" ] || { echo "ERROR: LC_VERSION_MIN_MACOSX=$got, want ${{ inputs.macos-min }}" >&2; exit 1; }
        echo "floor gate ok (cross): $f, LC_VERSION_MIN_MACOSX $got"

    # osxcross cross-dockerfile legs (darwin-x64/x86): verify the bare engine is
    # the TARGET Mach-O arch, not a host x86-64 (the cross-file was bypassed). Host
    # `file` needs no otool. The 10.6/10.4 floor is fixed by the toolchain file's
    # -mmacosx-version-min and printed per-slice by the universal lipo job.
    - name: Arch gate (cross-dockerfile) — bare engine is the target Mach-O arch
      if: inputs.macos-arch != '' && inputs.cross-dockerfile != ''
      shell: bash
      run: |
        set -euo pipefail
        f=$(file -b "${{ steps.mode.outputs.out }}/tjs"); echo "file: $f"
        case "$f" in
          *Mach-O*"${{ inputs.macos-arch }}"*) echo "arch marker ok: ${{ inputs.macos-arch }}" ;;
          *) echo "ERROR: not a ${{ inputs.macos-arch }} Mach-O (cross-file bypassed?) — got: $f" >&2; exit 1 ;;
        esac

    - name: Floor gate — shipped asset carries LC_VERSION_MIN_MACOSX = the pinned floor
      if: inputs.macos-min != '' && runner.os == 'macOS' && inputs.cross-image == ''
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ inputs.no-exec }}" = "true" ]; then
          TARGET="${{ steps.mode.outputs.out }}/tjs"
        else
          TARGET="./${{ steps.name.outputs.asset }}"
        fi
        if [ -n "${{ inputs.macos-arch }}" ]; then
          f=$(file -b "$TARGET"); echo "file: $f"
          case "$f" in *"${{ inputs.macos-arch }}"*) ;; *) echo "ERROR: arch marker '${{ inputs.macos-arch }}' not in file output" >&2; exit 1 ;; esac
        fi
        LOADCMDS="$RUNNER_TEMP/floor-gate-loadcmds"
        otool -l "$TARGET" > "$LOADCMDS"
        if grep -q LC_BUILD_VERSION "$LOADCMDS"; then
          echo "ERROR: LC_BUILD_VERSION present — pre-10.14 dyld needs LC_VERSION_MIN_MACOSX" >&2
          exit 1
        fi
        got=$(awk '/cmd LC_VERSION_MIN_MACOSX/{f=1} f && /version /{print $2; exit}' "$LOADCMDS")
        if [ "$got" != "${{ inputs.macos-min }}" ]; then
          echo "ERROR: LC_VERSION_MIN_MACOSX=$got, want ${{ inputs.macos-min }}" >&2
          exit 1
        fi
        echo "floor gate ok: LC_VERSION_MIN_MACOSX $got"

    # UPLOADED BEFORE THE PRODUCT GATE, DELIBERATELY. This is the ENGINE; the
    # smoke below tests the PRODUCT built from it, and the two fail for different
    # reasons. When the rg gate went red on four legs, this step never ran, so
    # node-shim-oracle and node-shim-oracle-darwin died at download-artifact with
    # "Artifact not found" — taking test/node-shim-constants.test.cjs, the
    # ratcheted diff of our OS constants against real node, down with them. A
    # product-level failure must not confiscate the engine-level diagnostics
    # somebody needs to DEBUG it.
    #
    # This does NOT loosen any release gate, but not for the reason you might
    # reach for first: tjs-* is not merely a CI artifact. release.yml downloads
    # `pattern: tjs-darwin-*` to lipo the four slices into the universal engine
    # (:168-178), and templates-pack consumes leg artifacts too. What protects
    # the release is the JOB edges, not the step order: a failed smoke still
    # fails the leg job, and darwin-universal `needs: darwin-slices`,
    # templates-pack `needs: [leg, darwin-slices]`, release `needs: [leg,
    # darwin-slices, darwin-universal, templates-pack, suite]`. A red leg blocks
    # all of them regardless of which artifacts it managed to upload first.
    # No `if:` here on purpose — a step defaults to if: success(), so this is
    # still skipped when an EARLIER step (the engine build, the floor gates)
    # failed. It is now only the PRODUCT smoke that no longer confiscates it.
    # The two steps that ship — Attest build provenance and Upload the builder
    # artifact — stay after the smoke, still gated on it.
    - name: Upload the bare tjs binary (oracle jobs + debugging)
      uses: actions/upload-artifact@v7.0.1
      with:
        name: tjs-${{ inputs.leg }}
        path: ${{ steps.bare.outputs.path }}
        if-no-files-found: error

    # quaude translates rg to ugrep/bfs ON PURPOSE (rg is Rust and cannot exist
    # everywhere quaude does) and clode does NOT provision them — so a runner
    # without them is not running the supported configuration at all, and the
    # smoke below exercises the applet-missing fallback instead of the product.
    # (The five rg-to-ugrep fixture rows that have logged "# SKIP needs bfs (not
    # installed)" on every CI run live in the suite job, not here; suite.yml
    # installs them for the same reason.)
    - name: Install the rg applets (ugrep + bfs) — the configuration quaude requires
      id: applets
      if: steps.mode.outputs.exec != 'guest' && steps.mode.outputs.exec != 'qemu' && inputs.smoke == 'full' && inputs.no-exec != 'true'
      shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_OS" in
          Linux)
            # Both are in the archive for every runner image we use (noble,
            # questing, resolute) and for both arches. The musl leg's smoke runs
            # on the ubuntu HOST (the static binary execs there), not in the
            # alpine container, so apt is the right package manager for it too.
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ugrep bfs
            ;;
          macOS)
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ugrep bfs
            ;;
          Windows)
            # bfs has never been ported to native Windows (it is built on POSIX
            # fts/openat). ugrep alone would still leave `rg --files --no-ignore`
            # untranslatable, so this leg answers the INVENTORY question only and
            # says so out loud via --allow-untranslated below. Everything the gate
            # observes is still observed — refused calls carry their argv.
            echo "allow=--allow-untranslated" >> "$GITHUB_OUTPUT"
            echo "no ugrep/bfs install on Windows: bfs has no native port"
            exit 0
            ;;
        esac
        # Assert on the WIRE, not on the package manager's exit code: apt and brew
        # both report success for things that leave nothing runnable on PATH.
        for a in ugrep bfs; do
          command -v "$a" >/dev/null 2>&1 \
            || { echo "ERROR: $a is not on PATH after install — the rg gate would be blind" >&2; exit 1; }
        done
        ugrep --version | head -1
        bfs --version | head -1
        echo "allow=" >> "$GITHUB_OUTPUT"

    - name: Full smoke — the builder builds the product (ephemeral, NEVER uploaded)
      if: steps.mode.outputs.exec != 'guest' && steps.mode.outputs.exec != 'qemu' && inputs.smoke == 'full' && inputs.no-exec != 'true'
      shell: bash
      run: |
        set -uo pipefail
        V=$(sed -n 's/^claude-code //p' UPSTREAM_PIN)
        echo "provider pin: @anthropic-ai/claude-code@$V (deliberately behind upstream — see UPSTREAM_PIN)"
        npm i -g @anthropic-ai/claude-code@"$V" 2>&1 | tail -3
        PROV="$(node scripts/stage-provider.mjs)" || exit 1
        echo "provider: $PROV"
        set -e
        # .exe ON WINDOWS, and it has to be here rather than in clode. The probes
        # below run on the RUNNER'S NODE, and node does not set libuv's
        # UV_PROCESS_WINDOWS_FILE_PATH_EXACT_NAME, so an extensionless path is
        # simply not spawnable: libuv tries <name>.com and <name>.exe and gives up.
        # txiki DOES set it (src/mod_process.c), which is why clode's own smoke
        # spawned this exact file seconds earlier and reported "PONG round-trip ok"
        # while the very next step got "(nothing arrived)" and blamed SSE.
        # NOT fixable in resolveBuildOut: a native windows `--out` is returned
        # verbatim ON PURPOSE — the builder leg publishes an extensionless
        # clode-<ver>-windows-amd64 and attest looks for that exact name
        # (test/clode-fuse-args.test.cjs records the release it broke).
        SMOKE="$RUNNER_TEMP/quaude-smoke"; [ "$RUNNER_OS" = "Windows" ] && SMOKE="$SMOKE.exe"
        CLODE_CLAUDE_BIN="$PROV" CLODE_CACHE="$RUNNER_TEMP/clode-cache" \
          ./"${{ steps.name.outputs.asset }}" build --out "$SMOKE"
        # MCP transports, on the one binary CI actually builds. The PONG smoke
        # above proves the quaude boots and answers; it says nothing about whether
        # an MCP server can be reached, and all three transports we have driven
        # were broken at some point WITHOUT the boot smoke noticing:
        #   stdio  no ChildProcess 'spawn'   http  fetch(URL) died pre-socket
        #   sse    every POST went to /[object Object]
        # Hermetic: a local mock server, no network and no credentials. Asserts on
        # what ARRIVED, because the SSE failure was invisible from the client side.
        node scripts/mcp-transport-probe.mjs "$SMOKE" --transport=sse
        # rg usage, on the same binary. We translate rg to portable applets ON
        # PURPOSE (rg is Rust and cannot exist everywhere quaude does; ugrep and
        # bfs can), and that bargain holds only while we can translate what
        # upstream actually invokes — which upstream can change in any release,
        # with no change on our side. A call we cannot translate fails here; a
        # call that merely CHANGED fails against the recorded inventory, because
        # that one still "works" while quietly meaning something else.
        # A host with no ugrep/bfs cannot translate, which is a statement about
        # the HOST, not about upstream — the gate now says which, and refuses to
        # call an unobserved run an upstream change. --allow-untranslated is set
        # only where an applet genuinely cannot exist (see the applets step).
        node scripts/rg-inventory.mjs "$SMOKE" ${{ steps.applets.outputs.allow }}
        rm -f "$SMOKE"   # quaude is derived work: ephemeral, never leaves the runner

    - name: Attest build provenance
      if: inputs.attest == 'true' && inputs.no-exec != 'true'
      uses: actions/attest-build-provenance@v4.2.2
      with:
        subject-path: ${{ steps.name.outputs.asset }}

    - name: Upload the builder artifact
      if: inputs.no-exec != 'true'
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ inputs.publish == 'true' && steps.name.outputs.asset || format('smoke-{0}', steps.name.outputs.asset) }}
        path: ${{ steps.name.outputs.asset }}
        if-no-files-found: error
