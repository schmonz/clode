name: guest
description: >
  The ONE non-native entry point for the release matrix (plan Q2 "The guest
  action"): run a script on a guest platform, same contract for every leg.
  The script runs with cwd = the synced workspace on every backend.
  Backends: "native" (host passthrough); "alpine" (musl build environment as a
  docker container — one mechanism for every host/guest arch pair; foreign
  arches run under qemu-user via tonistiigi/binfmt fix-binary, which ALSO lets
  later host steps exec the guest-built static binaries directly); "vm" via
  cross-platform-actions (netbsd/freebsd/openbsd/dragonflybsd/omnios — QEMU,
  KVM-accelerated on x64 Linux runners; the action starts a persistent VM and
  cpa.sh runs the script inside it with rsync both ways); "solaris" via
  vmactions/solaris-vm (the one v1 platform cross-platform-actions lacks).
  jirutka/setup-alpine was tried first for the musl legs but its post-run
  chroot teardown breaks when invoked from a nested composite action
  (dispatch 29063991061). Remaining dispatcher stubs reserve the phase-3
  backend (own-qemu guest recipes) so workflow YAML shape never changes; the
  endgame is own-qemu absorbing platforms one by one. "qemu-netbsd-sparc" is
  the first own-qemu leg: it boots a pinned, pre-fetched NetBSD/sparc image
  under qemu-system-sparc (sun4m) and drives it over the serial console via
  spike/quickjs/qemu/ci-sparc-driver.py — there is no GHA-native "run a
  script in this VM" shell for it (unlike cpa.sh below), so the driver runs
  the recipe itself instead of a `shell:` step.
inputs:
  platform:
    description: >
      Guest platform: native | alpine | netbsd | freebsd | openbsd |
      dragonflybsd | omnios | solaris. Reserved (phase 3): qemu-*.
    required: true
  arch:
    description: >
      Guest architecture (alpine: x86_64 aarch64 s390x x86 armv7 ppc64le
      riscv64 loongarch64; vm backends: x86_64 or arm64 where the image
      exists — cross-platform-actions accepts x86_64 as an alias).
    required: false
    default: x86_64
  version:
    description: >
      Guest OS version (alpine: release like 3.22; netbsd: 10.1; freebsd:
      14.4; openbsd: 7.9; dragonflybsd: 6.4.2; omnios: r151058; solaris:
       11.4-gcc).
    required: false
    default: "3.22"
  script:
    description: Shell script to run inside the guest (POSIX sh -e semantics)
    required: true
  cache-key:
    description: >
      Image/toolchain cache key (reserved for the qemu backends). For
      qemu-netbsd-sparc this is the exact ci-images release asset filename
      to fetch (e.g. wd0-pristine-10.1.img.zst or
      wd0-baked-10.1-gmake-cmake.img.zst, see spike/quickjs/qemu/CI-IMAGES.md);
      empty defaults to the pristine per-run image at `version`.
    required: false
    default: ""
  packages:
    description: >
      Packages to install in the guest before the script runs, named in the
      GUEST's package system (apk / pkgin / pkg / pkg_add / IPS). IPS backends
      (omnios, solaris) install per-package and log misses loudly instead of
      failing the whole transaction — one run surfaces every missing name.
    required: false
    default: ""
outputs:
  elapsed-seconds:
    description: Wall-clock seconds the guest script took (including VM boot)
    value: ${{ steps.timing.outputs.elapsed }}
runs:
  using: composite
  steps:
    - name: Dispatch (validate the backend)
      id: dispatch
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.platform }}" in
          native) ;;
          alpine)
            case "${{ inputs.arch }}" in
              x86_64)      p=linux/amd64 ;;
              aarch64)     p=linux/arm64 ;;
              s390x)       p=linux/s390x ;;
              ppc64le)     p=linux/ppc64le ;;
              riscv64)     p=linux/riscv64 ;;
              x86)         p=linux/386 ;;
              armv7|armhf) p=linux/arm/v7 ;;
              loongarch64) p=linux/loong64 ;;
              *) echo "guest: unknown alpine arch '${{ inputs.arch }}'" >&2; exit 64 ;;
            esac
            echo "docker-platform=$p" >> "$GITHUB_OUTPUT" ;;
          netbsd|freebsd|openbsd|dragonflybsd|omnios|midnightbsd|haiku) ;;  # cross-platform-actions
          solaris|openindiana) ;;                                           # vmactions
          qemu-netbsd-sparc) ;;  # own-qemu backend (ci-sparc-driver.py) — see below; the first phase-3 leg
          qemu-*)
            echo "guest: '${{ inputs.platform }}' is a phase-3 backend stub (own-qemu guest-recipe subsystem not implemented yet)" >&2
            exit 64 ;;
          *)
            echo "guest: unknown platform '${{ inputs.platform }}'" >&2
            exit 64 ;;
        esac
        echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"

    # binfmt (fix-binary) for every non-host arch: makes both the container
    # AND later host steps able to exec foreign-arch binaries. Cheap (~5s),
    # harmless when the guest arch is native.
    - name: Register qemu binfmt
      if: inputs.platform == 'alpine'
      uses: docker/setup-qemu-action@v4.2.0

    # Docker Hub's official alpine publishes NO loong64 manifest on any tag
    # (matrix dispatch #5, 2026-07-10). Alpine itself ships loongarch64 since
    # 3.21 — import the sha512-verified minirootfs straight from dl-cdn
    # (provenance BETTER than Hub: the bytes come from alpinelinux.org) under
    # the same local tag the run step expects.
    - name: Import alpine from the official minirootfs (arches Docker Hub lacks)
      if: inputs.platform == 'alpine' && inputs.arch == 'loongarch64'
      shell: bash
      run: |
        set -euo pipefail
        docker image inspect "alpine:${{ inputs.version }}" >/dev/null 2>&1 && exit 0
        BASE="https://dl-cdn.alpinelinux.org/alpine/v${{ inputs.version }}/releases/loongarch64"
        REL=$(curl -fsSL "$BASE/latest-releases.yaml" | awk '$1 == "file:" && $2 ~ /^alpine-minirootfs-.*\.tar\.gz$/ {print $2; exit}')
        [ -n "$REL" ] || { echo "guest: no minirootfs entry in $BASE/latest-releases.yaml" >&2; exit 1; }
        cd "$RUNNER_TEMP"
        curl -fsSLO "$BASE/$REL"
        curl -fsSL "$BASE/$REL.sha512" -o "$REL.sha512"
        sha512sum -c "$REL.sha512"
        docker import --platform linux/loong64 "$REL" "alpine:${{ inputs.version }}"

    - name: Run the guest script (alpine container)
      if: inputs.platform == 'alpine'
      shell: bash
      env:
        CLODE_GUEST_SCRIPT: ${{ inputs.script }}
        CLODE_GUEST_PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        printf '%s\n' "$CLODE_GUEST_SCRIPT" > "$RUNNER_TEMP/guest-script.sh"
        docker run --rm \
          --platform "${{ steps.dispatch.outputs.docker-platform }}" \
          -v /home/runner/work:/home/runner/work \
          -w "$GITHUB_WORKSPACE" \
          -e RUNNER_TEMP -e GITHUB_WORKSPACE \
          -e CLODE_GUEST_PACKAGES \
          "alpine:${{ inputs.version }}" \
          sh -e -c '[ -z "$CLODE_GUEST_PACKAGES" ] || apk add -q $CLODE_GUEST_PACKAGES; sh -e "$RUNNER_TEMP/guest-script.sh"'

    # ---- cross-platform-actions backend: boots a persistent QEMU VM (KVM on
    # x64 Linux runners) and installs cpa.sh on the runner's PATH; the next
    # step executes inside the VM with the workspace rsynced both ways.
    - name: Start the guest VM (cross-platform-actions)
      if: contains('netbsd freebsd openbsd dragonflybsd omnios midnightbsd haiku', inputs.platform)
      uses: cross-platform-actions/action@v1.4.0
      with:
        operating_system: ${{ inputs.platform }}
        version: ${{ inputs.version }}
        architecture: ${{ inputs.arch }}
        cpu_count: 4

    - name: Run the guest script (in the VM via cpa.sh)
      if: contains('netbsd freebsd openbsd dragonflybsd omnios midnightbsd haiku', inputs.platform)
      shell: cpa.sh {0}
      run: |
        set -e
        PKGS="${{ inputs.packages }}"
        case "${{ inputs.platform }}" in
          netbsd)
            # PINNED to the 2026Q1 quarterly. pkgin's default repo tracks the
            # CURRENT quarterly (the 10.1 path 302s to 10.0_<currentQ>), and the
            # 2026Q2 NetBSD/x86_64 bulk build shipped NO nodejs package at all —
            # verified against the repo index: 2026Q2 has only unrelated node-*
            # /nodejs-version entries, while 2026Q1 has nodejs-20/22/24/25. This
            # guest NEEDS node to run scripts/build-tjs.mjs, so the leg died with
            # "nodejs is not available in the repository" (green 2026-07-19, red
            # from 2026-07-22). Deliberately NOT tolerating pkgin's nonzero exit:
            # that would mask the missing interpreter and fail later as
            # "node: not found" (exactly how the midnightbsd leg failed).
            # REVISIT: drop this pin once a later quarterly publishes nodejs again
            # (2026Q1 will eventually be pruned from the mirror).
            [ -z "$PKGS" ] || {
              printf '%s\n' \
                "https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/$(uname -p)/10.0_2026Q1/All" \
                | sudo tee /usr/pkg/etc/pkgin/repositories.conf >/dev/null
              sudo pkgin -y update
              sudo pkgin -y install $PKGS
            } ;;
          freebsd|dragonflybsd)
            [ -z "$PKGS" ] || sudo env ASSUME_ALWAYS_YES=YES pkg install -y $PKGS ;;
          openbsd)
            [ -z "$PKGS" ] || sudo pkg_add $PKGS ;;
          midnightbsd)
            # mport exits nonzero for already-installed packages ("The most
            # recent version of bash is already installed" -> exit 1, tag run
            # 2026-07-10) — tolerate it; a genuinely missing tool fails
            # loudly at its first use in the script.
              # TOLERATE ONLY WHAT WE MEANT TO TOLERATE. mport exits nonzero for an
              # already-installed package, so this used to swallow EVERY nonzero exit —
              # including a failed download. On 2026-08-26 the mirror was unreachable
              # ("Fetch error: https://www.midnightbsd.org/ftp/..." x7), the swallow hid
              # it, and the leg died two commands later with `/bin/sh: node: not found`
              # and exit 127 — naming the consequence instead of the cause.
              #
              # The netbsd branch above had already written this exact prediction down:
              # "that would mask the missing interpreter and fail later as node: not
              # found (exactly how the midnightbsd leg failed)". A diagnosis we made and
              # did not act on.
              if [ -n "$PKGS" ]; then
                if out=$(sudo mport install $PKGS 2>&1); then
                  printf '%s\n' "$out"
                else
                  printf '%s\n' "$out"
                  if printf '%s' "$out" | grep -qiE 'already installed'; then
                    echo "guest(midnightbsd): nonzero is the already-installed report — tolerated"
                  else
                    echo "guest(midnightbsd): mport FAILED, and not for the already-installed reason" >&2
                    exit 1
                  fi
                fi
              fi ;;
          haiku)
            # Single-user system: the runner IS the (only) user; no sudo.
            #
            # HaikuPorts DELETED the r1beta5 ports repo. Probed 2026-08-24:
            # https://eu.hpkg.haiku-os.org/haikuports/ lists exactly ["master"],
            # and the beta5 index serves an empty package set — which is the
            # `100% repochecksum-1 [2 bytes]` in the failing logs, followed by
            # "Failed to download package c_ares". Upstream says it was
            # deliberate; they cannot staff ports for two releases.
            #
            # We cannot move the GUEST: cross-platform-actions/haiku-builder
            # publishes exactly one image, haiku-r1beta5-x86-64.qcow2 (checked
            # every release). The base haiku repo does carry r1beta6, but an OS
            # repo without a runner image is no use.
            #
            # So: point pkgman at the master ports repo, which is the only one
            # that still exists. Whether master packages RESOLVE against a beta5
            # system is an open question — Haiku packages carry
            # `requires: haiku >= hrevNNNNN` and master is built against a much
            # newer hrev — so this is an experiment, and it says so out loud
            # rather than failing with a checksum error nobody can read.
            if [ -n "$PKGS" ]; then
              echo "guest(haiku): beta5 HaikuPorts is gone upstream; adding the master ports repo"
              pkgman add-repo https://eu.hpkg.haiku-os.org/haikuports/master/x86_64/current 2>&1 || \
                echo "guest(haiku): add-repo failed — install will likely fail below, and that is the finding"
              pkgman install -y $PKGS
            fi ;;
          omnios)
            # IPS: per-package so one run reports EVERY missing name (exit 4 =
            # already installed / nothing to do — fine). The script then fails
            # loudly at the first missing tool.
            # It used to only ECHO a miss and carry on, trusting "the script then fails
            # loudly at the first missing tool" — the same deferral that made midnightbsd
            # report `node: not found` instead of a fetch error. Collect, then fail HERE,
            # where the cause is.
            omnios_missed=''
            for p in $PKGS; do
              sudo pkg install -q "$p" || [ $? -eq 4 ] || omnios_missed="$omnios_missed $p"
            done
            if [ -n "$omnios_missed" ]; then
              echo "guest(omnios): pkg install FAILED for:$omnios_missed" >&2
              exit 1
            fi
            # ooce packages land outside the default PATH
            PATH="/opt/ooce/bin:$PATH"; export PATH ;;
        esac
        # VERIFY WHAT WE ASKED FOR IS ACTUALLY THERE, on every platform, right here where
        # the cause is knowable. Three legs failed today because a package step reported
        # success (or was told to ignore failure) and the absence surfaced later as a bare
        # `command: not found` — dragonfly, midnightbsd and netbsd-amd64, three different
        # package managers, same shape. The install branches above now fail honestly; this
        # catches the remaining case where a manager exits 0 and installs nothing.
        #
        # THE NAME MAP IS ABOUT PACKAGING SPELLINGS, NOT PLATFORMS. The same tool is
        # `gmake` on the BSDs and `developer/build/gnu-make` under IPS; node is `nodejs20`
        # on Haiku and `runtime/nodejs` on omnios. Anything unmapped is checked under its
        # own last path component, which is right for cmake/git/bash everywhere.
        if [ -n "$PKGS" ]; then
          guest_missing=''
          for p in $PKGS; do
            # Normalise the SPELLING first: IPS names are paths (developer/gcc14,
            # ooce/runtime/node-22) and Haiku's are provides (cmd:gcc, cmd:make). Doing
            # the match on the raw string got cmd:gcc, cmd:make and developer/gcc14
            # wrong — checked against the REAL strings from scripts/tjs-legs.mjs, which
            # is what I should have used the first time instead of a plausible-looking
            # list I made up.
            base=${p##*/}; base=${base#cmd:}
            case "$base" in
              *cmake*)                cmd=cmake ;;
              *gnu-make*|gmake)       cmd=gmake ;;
              make)                   cmd=make ;;
              *bash*)                 cmd=bash ;;
              *git*)                  cmd=git ;;
              *node*)                 cmd=node ;;
              gcc*)                   cmd=gcc ;;
              *)                      cmd=$base ;;
            esac
            command -v "$cmd" >/dev/null 2>&1 || guest_missing="$guest_missing $cmd($p)"
          done
          if [ -n "$guest_missing" ]; then
            echo "guest: package step reported success but these are NOT on PATH:$guest_missing" >&2
            echo "guest: that is a package-repo or naming problem, not a build failure — do not" >&2
            echo "guest: read the next error as the cause." >&2
            exit 1
          fi
          echo "guest: verified on PATH -> $PKGS"
        fi
        ${{ inputs.script }}

    # ---- vmactions backend: the platforms cross-platform-actions lacks
    # (Solaris; OpenIndiana). Boots, rsyncs the workspace in, runs prepare +
    # run as root in the VM, rsyncs back (copyback defaults true). Env vars
    # are copied into the VM. One step per OS — `uses:` cannot be dynamic.
    - name: Run the guest script (vmactions solaris VM)
      if: inputs.platform == 'solaris'
      uses: vmactions/solaris-vm@v1.3.9
      with:
        release: ${{ inputs.version }}
        usesh: true
        prepare: |
          for p in ${{ inputs.packages }}; do
            pkg install -q "$p" || [ $? -eq 4 ] || echo "guest: SOLARIS-PKG-MISS: $p" >&2
          done
        run: |
          set -e
          ${{ inputs.script }}

    - name: Run the guest script (vmactions openindiana VM)
      if: inputs.platform == 'openindiana'
      uses: vmactions/openindiana-vm@v1.1.6
      with:
        release: ${{ inputs.version }}
        usesh: true
        prepare: |
          for p in ${{ inputs.packages }}; do
            pkg install -q "$p" || [ $? -eq 4 ] || echo "guest: OI-PKG-MISS: $p" >&2
          done
        run: |
          set -e
          ${{ inputs.script }}

    # ---- own-qemu backend: qemu-netbsd-sparc. No GHA-native "run in
    # qemu-sun4m" shell exists (unlike cpa.sh above), so ci-sparc-driver.py
    # itself drives the guest over the serial console. Structural first pass
    # (netbsd-sparc-matrix-leg Task 2): the mechanism (provision, fetch+
    # verify the pinned image, invoke the driver) is wired end to end here;
    # the driver's boot/recipe behavior is proven and tuned in the Task-4 CI
    # wall-walk, not here.
    - name: Provision qemu-system-sparc + anita (own-qemu backend)
      if: inputs.platform == 'qemu-netbsd-sparc'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends qemu-system-sparc zstd
        # NB: the REAL anita (Andreas Gustafsson's NetBSD test tool, whose
        # anita.Anita/anita.ISO/shell_cmd API ci-sparc-driver.py uses) is on
        # gson.org, NOT PyPI — `pip install anita` grabs an unrelated logic-proof
        # teaching package (RUNBOOK.md "DRIFT (wrong anita)"). Pin 2.18.
        pip install --user pexpect http://www.gson.org/netbsd/anita/download/anita-2.18.tar.gz
        python3 -c "import anita, pexpect"   # fail loud if the wrong package slipped in

    - name: Fetch + verify the pinned NetBSD/sparc image (own-qemu backend)
      if: inputs.platform == 'qemu-netbsd-sparc'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        # cache-key doubles as the exact ci-images asset filename for this
        # backend (see the input's description above); empty falls back to
        # the pristine per-run image at `version`.
        ASSET: ${{ inputs.cache-key != '' && inputs.cache-key || format('wd0-pristine-{0}.img.zst', inputs.version) }}
      run: |
        set -euo pipefail
        WORK="$RUNNER_TEMP/qemu-sparc"
        mkdir -p "$WORK"
        gh release download ci-images -R "${{ github.repository }}" -p "$ASSET" -D "$WORK" --clobber
        PIN=$(awk -v f="$ASSET" '$2 == f' spike/quickjs/qemu/sparc-images.sha256)
        [ -n "$PIN" ] || { echo "guest: no sha256 pin for '$ASSET' in spike/quickjs/qemu/sparc-images.sha256" >&2; exit 1; }
        ( cd "$WORK" && echo "$PIN" | sha256sum -c - )
        zstd -d -f "$WORK/$ASSET" -o "$WORK/wd0.img"
        echo "CI_SPARC_WORKDIR=$WORK" >> "$GITHUB_ENV"

    - name: Run the guest script (own-qemu sparc via ci-sparc-driver.py)
      if: inputs.platform == 'qemu-netbsd-sparc'
      shell: bash
      env:
        CLODE_GUEST_SCRIPT: ${{ inputs.script }}
      run: |
        set -euo pipefail
        # Bridge inputs.script into ci-sparc-driver.py's recipe-file model:
        # the guest fetches this file over :8180 and runs it with sh. For
        # the driver's GUEST-DONE/*-exit verdict to mean anything, the
        # recipe must follow the marker vocabulary already used by
        # spike/quickjs/qemu/guest-sparc-*.sh — build-leg recipes (Task 3)
        # are expected to emit it; exact wiring refined in Task 3/4.
        RECIPE_REL=".ci-sparc-guest-script.sh"
        printf '%s\n' "$CLODE_GUEST_SCRIPT" > "$GITHUB_WORKSPACE/$RECIPE_REL"
        python3 spike/quickjs/qemu/ci-sparc-driver.py \
          --workdir "$CI_SPARC_WORKDIR" \
          --workspace "$GITHUB_WORKSPACE" \
          --recipe "$RECIPE_REL" \
          --machine SS-20 \
          --memory 512M

    # ---- native backend: host passthrough (exists so every leg can share one
    # YAML shape; native legs may also just run steps directly).
    - name: Run the guest script (native)
      if: inputs.platform == 'native'
      shell: bash
      run: ${{ inputs.script }}

    - name: Timing
      id: timing
      shell: bash
      run: echo "elapsed=$(( $(date +%s) - ${{ steps.dispatch.outputs.t0 }} ))" >> "$GITHUB_OUTPUT"
