name: suite

# Reusable full-suite job — the ONE place `npm test` is defined for CI.
#
# Same doctrine as tjs-legs.yml (user decision 2026-07-11: no duplication
# between the per-push and release builds). This file exists because the
# alternative was tried and immediately rotted: on 2026-08-01 the suite was
# hand-mirrored into release.yml to close a real gap (a tag ran build + smoke +
# be-oracle and NOTHING else — ci.yml has no tag trigger), and that copy was a
# second hand-maintained definition of the same job. This repo has already paid
# for that shape twice in one day: the release gate's asset globs stopped
# matching canonical-name.cjs's `.exe`, and SHA256SUMS's glob stopped matching
# the templates blob. Two lists that must agree, with nothing making them agree.
#
# Callers: ci.yml (every push to main / PR) and release.yml (every tag, gating
# `release`). Both get byte-identical steps; there is no tier knob because there
# is no legitimate reason for a tag to run a weaker suite than main does.
#
# Permissions are NOT declared here: a called workflow can only downgrade the
# caller's grant, so each caller passes what it needs (both need contents: read).

on:
  workflow_call: {}

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest    # linux-x64
          - os: windows-latest   # windows-amd64
    runs-on: ${{ matrix.os }}
    # SCRATCH GOES ON THE ROOMY VOLUME. On Windows runners `os.tmpdir()` resolves to
    # C:\Users\RUNNER~1\AppData\Local\Temp, on the small C: volume, while RUNNER_TEMP is
    # on the much larger D:. The suite decompresses a ~4 MB zstd frame to 6 MB in the
    # deadlock guard, and twice (2026-08-29, 2026-08-30) that job died with
    # `zstd: error 70 : Write error : cannot write block : No space left on device`,
    # which the guard then reported as its own deadlock. Measured on the first
    # occurrence: the repo change under suspicion wrote ZERO bytes on this job, so the
    # volume was already tight. POSIX runners are unaffected (their TMPDIR is already
    # roomy); setting these on every row keeps one definition rather than a per-OS branch.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Put scratch on the roomy volume
        run: |
          set -euo pipefail
          for v in TMP TEMP TMPDIR; do echo "$v=$RUNNER_TEMP" >> "$GITHUB_ENV"; done
          echo "scratch -> $RUNNER_TEMP"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .tool-versions
      # A Renovate bump to the pin that the runner has not actually installed
      # makes `node --test` no-op; test/run.mjs's evidence floor catches a
      # zero-test run, but failing HERE names the cause instead.
      - name: Assert Node matches the .tool-versions pin
        run: |
          set -euo pipefail
          want=$(sed -n 's/^nodejs //p' .tool-versions)
          have=$(node -v); have=${have#v}
          [ "$have" = "$want" ] || { echo "node skew: .tool-versions=$want but runtime=$have" >&2; exit 1; }
      # Five rows in test/rg-to-ugrep.test.cjs drive the REAL ugrep/bfs and have
      # logged "# SKIP needs bfs (not installed)" on every CI run this repo has
      # ever done, because no runner ships them. They pin MEASURED behaviour —
      # bfs keeps zero-length files, ugrep's -l drops them, `-L '$^'` lists
      # everything — which is exactly the kind of claim that must not be taken on
      # faith, and skipping is how it has been. quaude requires these applets
      # anyway (we translate rg to them on purpose); a runner without them is not
      # the supported configuration.
      #
      # apt's ugrep/bfs are OLDER than a dev box's (noble: ugrep 5.0.0, bfs
      # 3.1.2). If their semantics differ from what those rows pin, the rows will
      # say so — which is the point of pinning them to a real binary. Windows is
      # excluded: bfs has never been ported there. Keyed to Linux specifically, so
      # adding a macOS row to the matrix fails here (wrong package manager)
      # instead of silently going back to skipping.
      - name: Install the rg applets (ugrep + bfs) so the fixture rows stop skipping
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ugrep bfs
          for a in ugrep bfs; do
            command -v "$a" >/dev/null 2>&1 \
              || { echo "ERROR: $a is not on PATH after install" >&2; exit 1; }
          done
          ugrep --version | head -1
          bfs --version | head -1
      - name: Install runtime deps (the six Bun-backing packages, locked) for the fidelity gate
        run: npm ci --prefix deps/claude
      - name: Full node:test suite (includes the shim-fidelity gate)
        run: npm test
