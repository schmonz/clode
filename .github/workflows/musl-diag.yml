name: musl-sigkill-diag

# TEMPORARY diagnostic (not a gate): reproduce the node-shim-oracle SIGKILL hang
# on the linux-x64-musl engine, which passes cleanly on NetBSD. Instruments the
# async spawn -> kill('SIGKILL') -> wait/exit path to tell whether the child dies,
# whether an orphan holds the pipe, and whether 'exit' ever fires. Delete once the
# red is fixed.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  legs:
    uses: ./.github/workflows/tjs-legs.yml
    permissions:
      contents: read
    with:
      tier: ci
      only: linux-x64-musl

  diag:
    needs: legs
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: tjs-linux-x64-musl
          path: engine
      - name: Diagnose the SIGKILL async-reap path under the musl engine
        run: |
          set -uo pipefail
          TJS="$PWD/engine/tjs"; chmod +x "$TJS"
          "$TJS" eval 'console.log("musl tjs alive", tjs.version)'
          LOADER="$PWD/libexec/node-shim/loader.cjs"
          cat > diag.cjs <<'JS'
          const cp = require('node:child_process');
          function log(...a){ console.log('[diag]', ...a); }
          function run(label, argv, next){
            log('--- variant', label, JSON.stringify(argv));
            const c = cp.spawn(argv[0], argv.slice(1));
            log(label, 'pid', c.pid);
            let exited = false;
            c.on('exit', (code, signal) => { exited = true; log(label, 'EXIT', JSON.stringify({code, signal})); });
            c.on('close', (code, signal) => log(label, 'CLOSE', JSON.stringify({code, signal})));
            c.on('error', (e) => log(label, 'ERROR', String(e)));
            setTimeout(() => { log(label, 'kill SIGKILL', c.pid, '->', c.kill('SIGKILL')); }, 300);
            setTimeout(() => {
              log(label, '5s exited=', exited);
              try { const a = cp.spawnSync('/bin/sh', ['-c', `kill -0 ${c.pid} 2>/dev/null && echo ALIVE || echo DEAD`], {encoding:'utf8'}); log(label, 'liveness', (a.stdout||'').trim()); } catch(e){ log(label,'live err',String(e)); }
              try { const p = cp.spawnSync('/bin/sh', ['-c', 'ps -o pid,ppid,stat,args 2>/dev/null | grep -w sleep | grep -v grep'], {encoding:'utf8'}); log(label, 'sleep procs', JSON.stringify((p.stdout||'').trim())); } catch(e){ log(label,'ps err',String(e)); }
              next(exited);
            }, 5000);
          }
          // A: single external command (may fork or exec-replace, shell-dependent)
          run('A:sh-c-sleep', ['/bin/sh','-c','sleep 30'], () => {
            // B: force exec-replace so the killed pid IS the sleep (no orphan)
            run('B:sh-c-exec-sleep', ['/bin/sh','-c','exec sleep 30'], () => {
              log('DONE'); process.exit(0);
            });
          });
          JS
          echo "=== /bin/sh is: $(ls -l /bin/sh) ==="
          CLODE_TJS="$TJS" timeout 40 "$TJS" run "$LOADER" diag.cjs 2>&1
          echo "--- diag exit: $? (124 = whole diag hung) ---"
