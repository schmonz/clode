name: ci
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
  # Read-only, additive: the workflow-level ceiling a job's own `permissions:` cannot
  # exceed. Granted here so the `tjs`/`tjs-slow` jobs can request it for
  # scripts/ci-ccache.sh's repo cache-usage line (report_usage()) -- see those jobs'
  # own comments. No job that does not also request it gets it: job-level permissions
  # narrow this ceiling, never widen it.
  actions: read
# One live run per ref: a newer push (or PR update) cancels the superseded run
# instead of piling four full matrices onto the runners at once. main and each PR
# get their own group so they never cancel each other.
concurrency:
  group: ci-${{ github.ref }}
  # SETTLED 2026-09-12 by the ModernMavericks family rule (mavericks-shipyard's
  # conventions check 1b and its release-concurrency design): **a run that can PUBLISH is
  # cancelled by nothing; a run that is only BUILD FEEDBACK is superseded by the newer
  # commit's.** This workflow cannot publish — release.yml is tag- and dispatch-only, and
  # now declares the never-cancelled half explicitly — so ci.yml is the feedback half, on
  # main as much as anywhere, and `true` is unconditional here by that rule.
  #
  # It replaces `${{ github.ref != 'refs/heads/main' }}` (2026-09-04), whose evidence was
  # real and is not being denied: 194e237, a BACKLOG.md-only commit, cancelled the run
  # carrying 06c6c96, a real test fix. What changed is the cost — after the fast/slow
  # matrix split and the smoke decoupling the suite reports in ~1-3 min and the fast legs
  # in ~6, against a 113-minute time-to-oracle before — and the discovery of never-cancel's
  # own cost: consecutive pushes queue behind each other's 22 qemu legs (run 33970393353
  # sat pending until 33966318977 was cancelled by hand, 2026-09-05).
  #
  # KNOWN RESIDUAL, recorded rather than papered over: `concurrency` is resolved at RUN
  # level, before the `changes` gatekeeper below can see the diff, so a docs-only push
  # still cancels a code run — and, because it then skips the heavy matrix, the run that
  # replaces it carries LESS signal, which is the one place this family rule's premise
  # ("the newer run reproduces the feedback") does not hold here. Recovery is
  # `gh run rerun <id>`. The fix that would remove it, workflow-level `paths-ignore`, is
  # deliberately NOT taken: it is a DECLARED path list whose failure mode is a code push
  # creating no run at all, silently — the opposite of `changes`'s derived, fail-open
  # default. See BACKLOG.md; if this bites, that entry is where the trade gets re-opened.
  cancel-in-progress: true
jobs:
  # PER-JOB timeout-minutes: the BACKSTOP behind test/file-watchdog.cjs's per-file limit. Without it a hang the
  # watchdog cannot see (a step outside node --test, a runner wedge) burns GitHub's 6-hour default. Each value is about
  # three times the job's longest duration across the 15 most recent ci.yml runs (measured 2026-11-19, gh api run jobs:
  # changes and tjs-fast-plan 0 min, tjs-fast-smoke 8, windows-amd64-tests 2, windows-amd64-tui 2,
  # windows-arm64-tests 3, node-shim-oracle 4, native-builder-oracle 7, node-shim-oracle-darwin 7, linux-x64-pty 31,
  # test / suite 4), and never under 45 for a job that runs node --test, so the watchdog's DEFAULT 30-minute per-file
  # limit fires first and NAMES the file. A file with a longer OVERRIDES entry can outlast its job: suite.yml's job
  # runs files with 65-minute overrides and gets 90; native-builder-oracle keeps 45 under clode-native's 80-minute
  # override and relies on that job's measured 285-472 s instead (see its own comment), so there the JOB timeout fires
  # first and names the job, not the file. A job that calls
  # a reusable workflow (tjs, tjs-slow, test) takes its timeouts from that workflow's jobs. test/file-watchdog.test.cjs
  # refuses a job without one in ANY workflow under .github/workflows.
  # Derives whether this push touched anything but docs, so the heavy `tjs`
  # matrix (and everything that consumes its artifacts) can skip on a
  # docs-only push without losing signal on a real one. concurrency.group
  # above is evaluated before any job runs and cannot see the diff — this is
  # the job that CAN, per scripts/changed-paths.mjs's own header.
  #
  # MUST FAIL OPEN: `code=true` on any failure to compute the diff, wired
  # explicitly (not left to a default), because a classifier that emits
  # nothing here would silently skip the whole matrix — worse than the
  # cancellation problem this file exists to fix. Two independent layers:
  # scripts/changed-paths.mjs itself catches every internal failure and
  # still prints `code=true`; the `||` below is a second layer for the case
  # the process cannot even start (missing node, a syntax error — the sort
  # of failure that fires before any try/catch in that file could run).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      # Full history: the classifier diffs against the push's "before" SHA
      # (or the PR's base SHA), neither of which the default shallow
      # (fetch-depth: 1) checkout would have on disk.
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
          fetch-depth: 0
      - name: Classify the push's changed paths (fails open — code=true on any error)
        id: classify
        env:
          GH_BEFORE_SHA: ${{ github.event.before }}
          GH_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/changed-paths.mjs >> "$GITHUB_OUTPUT" || echo "code=true" >> "$GITHUB_OUTPUT"
  # tjs legs, CI tier (user decision 2026-07-11): every OS in the release
  # matrix on every push, ONE arch each — the manifest (scripts/tjs-legs.mjs)
  # owns the list, the reusable workflow owns the job; nothing is duplicated
  # against release.yml. VM legs run soft-fail until they earn hard status
  # (house rule); the native legs keep their historical hard gate. The tjs
  # build restores from the shared cache on native legs, so a typical push
  # pays only bundle+blobulate+smoke there; VM legs pay the guest boot + in-guest
  # build.
  #
  # SPLIT IN TWO (measured from run 33959009299, 2026-09-05): `needs:` is
  # JOB-level, not matrix-leg-level, so the four oracle jobs below (and the
  # three Windows jobs) — which between them consume only TWO of this tier's
  # 29 artifacts (tjs-linux-x64-musl, tjs-darwin-arm64, tjs-windows-amd64,
  # tjs-windows-arm64 — every one a FAST leg) — were blocking on the slowest
  # leg in the whole matrix (netbsd-mips64eb, 113 minutes that run) to use
  # artifacts that exist at ~9 minutes. This job now runs only:fast (native
  # runners, alpine containers, cross-blobulate builds — everything
  # scripts/tjs-legs.mjs's SLOW_CI_LEG calls fast); `tjs-slow` below runs the
  # rest. The split is a leg PROPERTY (guest-platform VM vs. tier2's
  # from-source cross-toolchain build), never a name list here, so a leg that
  # changes shape re-partitions itself with no YAML edit. Every consumer of
  # this job (`needs: tjs`) already only ever downloaded a fast-job artifact,
  # so NONE of their `needs:` lines change — keeping this job's name `tjs`
  # (rather than renaming it `tjs-fast`) is what makes that true with a
  # minimal diff.
  tjs:
    needs: changes
    # THE heavy matrix this whole `changes` job exists to gate: a full OS
    # sweep. Skips outright on a docs-only push (task-7); on a real code
    # push it is unaffected. See `changes`'s own header for why this must
    # fail open rather than fail silent.
    #
    # DO NOT "simplify" this to `needs.changes.outputs.code == 'true'` — that
    # reads more naturally but is the exact bug fix round 1 caught (Finding
    # 1, CRITICAL): an `if:` with no status-check function is implicitly
    # ANDed with success(), so if the `changes` JOB itself dies before its
    # classify step runs (checkout timeout, a dead runner, any infra
    # hiccup) — as opposed to the classify STEP failing, which the script's
    # own fail-open logic already covers — `outputs.code` is never set,
    # `success()` is false, and `== 'true'` is false too: the ENTIRE heavy
    # matrix vanishes, reported as skipped, not failed. That is verbatim
    # "strictly worse than the problem being fixed." `!cancelled()` supplies
    # an explicit status-check function (suppressing the implicit
    # success()), and `!= 'false'` means unknown/empty/errored all default
    # to RUNNING — the same default-deny posture the classifier itself
    # takes — while a genuine `code=false` (docs-only, computed
    # successfully) is still the literal string 'false' and still skips.
    if: needs.changes.outputs.code != 'false' && !cancelled()
    uses: ./.github/workflows/tjs-legs.yml
    permissions:
      contents: read
      # Read-only, additive: lets each leg's scripts/ci-ccache.sh `report` step ask
      # actions/cache/usage for the repo-wide cache budget alongside its HITS/MISSES/
      # VERDICT line (see that script's report_usage() and
      # .superpowers/sdd/guest-carve-and-ccache.md for why VERDICT=ALL-MISS everywhere
      # was capacity/LRU eviction, not broken wiring). Nothing here can fail a leg: a
      # scope this workflow had not granted degrades to a stated "usage unknown".
      actions: read
    with:
      tier: ci
      only: fast
      # tjs-fast-plan/tjs-fast-smoke below own the deferred check — see
      # tjs-legs.yml's defer-smoke input for why this is the ONE call site
      # allowed to set it.
      defer-smoke: "true"
  # The slow half of the split above: VM/qemu guests + the from-source NetBSD
  # cross-toolchain fleet (scripts/tjs-legs.mjs's SLOW_CI_LEG) — everything
  # the fast `tjs` job above does not build. Nothing in this workflow
  # `needs:` this job; it exists purely so those legs still run on every push
  # (a re-partition, not a reduction — same 29 legs across the two jobs as
  # ran in the single `tjs` job before the split). Same `changes` gate as
  # `tjs`, for the same reason: it must skip in lockstep on a docs-only push
  # rather than spin up guest VMs for nothing. `!= 'false'` not `== 'true'`
  # — see `tjs`'s own comment above (fix round 1, Finding 1: a dead
  # `changes` job must not silently skip this too).
  tjs-slow:
    needs: changes
    if: needs.changes.outputs.code != 'false' && !cancelled()
    uses: ./.github/workflows/tjs-legs.yml
    permissions:
      contents: read
      actions: read  # same reason as the `tjs` job above: ci-ccache.sh's usage line
    with:
      tier: ci
      only: slow
  # Full smoke, DEFERRED (measured run 33959009299 baseline vs. current-HEAD
  # job 101287474377, `tjs / leg (linux-x64-musl)`): the engine artifact every
  # downstream consumer needs was complete at ~9s into that job, but the leg
  # then spent ~8.3 more minutes (of an 8.55min total) on build-leg's own
  # full-smoke step (a ~419s ephemeral-quaude blobulate + MCP probe + rg
  # inventory) — work no downstream job consumes. `needs:` on a `uses:` call
  # is JOB-level and atomic: `tjs` (this workflow's call to tjs-legs.yml,
  # tier:ci/only:fast) does not finish until ALL SEVEN of its fast legs do,
  # so every one of them paying that ~7min tax — not only the four legs the
  # oracle/Windows jobs actually download — was what held up every
  # `needs: tjs` job below. The `tjs` job above now passes
  # `defer-smoke: "true"` (tjs-legs.yml's own input, forwarded to build-leg
  # as ci-fast-defer-smoke), which skips build-leg's full-smoke for every
  # leg in that one call; `tjs` now finishes once each leg's builder is
  # blobulated and uploaded, not once it's also been smoked.
  #
  # These two jobs run that SAME check (the .github/actions/full-smoke
  # composite — one source, so build-leg's synchronous copy and this
  # deferred copy cannot check different things) against the artifact
  # `tjs`'s legs already uploaded, instead of re-blobulating from source. The
  # smoke still runs on every push and can still fail the run — it fails
  # THIS job instead of `leg`, which is the whole point: nothing downstream
  # needs THIS job to finish, only `tjs` (now fast) does.
  #
  # plan mirrors tjs-legs.yml's own `plan` job (same script, same tier/only
  # pair) so the leg list here can never drift from what `tjs` actually
  # built — scripts/tjs-legs.mjs stays the one source; nothing here declares
  # a leg name of its own.
  tjs-fast-plan:
    needs: changes
    if: needs.changes.outputs.code != 'false' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions
      - id: legs
        run: echo "legs=$(node scripts/tjs-legs.mjs ci fast)" >> "$GITHUB_OUTPUT"
  tjs-fast-smoke:
    needs: [changes, tjs, tjs-fast-plan]
    # Gated on `tjs` (not just tjs-fast-plan) so this never races the leg
    # job's own artifact upload; gated on `changes` for the same reason every
    # artifact-downloading job here is (task-7, docs-only push skips in
    # lockstep). `!= 'false'` not `== 'true'` — see `tjs`'s own comment (fix
    # round 1, Finding 1: a dead `changes` job must not silently skip this
    # too).
    if: needs.changes.outputs.code != 'false' && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.tjs-fast-plan.outputs.legs) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions
      # Same computation build-leg's own "Name the builder artifact" step
      # does (scripts/canonical-name.cjs is the one source for both) — the
      # artifact name must match EXACTLY what that step uploaded, floor
      # included (only darwin-arm64 carries one in the fast tier).
      - name: Name the builder artifact (matches build-leg's own naming)
        id: name
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then V="${GITHUB_REF_NAME#v}"; else V="$(cat VERSION)"; fi
          ASSET="$(node scripts/canonical-name.cjs asset '${{ matrix.leg }}' "$V" '${{ matrix.floor || '' }}')"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
      # ci tier never sets `publish` (legsFor('ci') strips it — see
      # scripts/tjs-legs.mjs), so build-leg's own upload is always the
      # smoke- prefixed name, never the bare release name.
      - uses: actions/download-artifact@v8.0.2
        with:
          name: smoke-${{ steps.name.outputs.asset }}
          path: .
      - name: Restore the executable bit (artifact upload/download can drop it)
        run: chmod +x "${{ steps.name.outputs.asset }}" || true
      - uses: ./.github/actions/full-smoke
        with:
          asset: ${{ steps.name.outputs.asset }}
  # Windows shim + sync-primitive coverage (windows-tjs-port spec). Windows is
  # the ONE platform whose shim + sync-primitive layer diverges from POSIX
  # (CRLF, cmd.exe/PATHEXT, drive paths, O_BINARY, the Win32 C sync primitives
  # mod_fs_sync/mod_spawn_sync) — POSIX legs get this coverage free from the
  # host node:test suite on the dev box, but it can only be exercised on a
  # real Windows kernel against a real tjs.exe. Consumes the windows-amd64 leg's
  # tjs-windows-amd64 engine; the leg's own exec=host job does build+blobulate+PONG+
  # publish (subsuming the old blobulate-build/blobulate-run/builder-smoke jobs). Because
  # this installs the pinned @anthropic-ai/claude-code (UPSTREAM_PIN) it is also
  # the Windows bundle-bump gate. These finer signals isolate a C-primitive regression from
  # a shim/Bash-tool regression — what the leg's end-to-end PONG cannot.
  windows-amd64-tests:
    needs: [changes, tjs]
    # Run once `tjs` FINISHES, whatever its conclusion — do NOT skip because some
    # OTHER leg failed. This job consumes ONE named artifact; a leg it does not use
    # has no bearing on whether it can run. Plain `needs: tjs` skips the moment any
    # HARD leg fails, which silently deletes this signal: when haiku-x64 was promoted
    # to gating (2026-07-17), a single real haiku regression skipped this job and the
    # three windows jobs in one stroke — a broken gate masking working gates, the
    # exact disease that let the dep-closure P0 through (node-shim-oracle skipped at
    # 9e968b4 for the same reason). If the artifact this job needs is genuinely
    # missing, download-artifact fails it LOUDLY, which is the honest answer.
    #
    # ALSO gated on `changes`: this job downloads a `tjs` artifact, so it must
    # skip in lockstep with `tjs` on a docs-only push (task-7) rather than
    # run and fail loudly on a missing artifact. `!= 'false'` not `== 'true'`
    # — see `tjs`'s own comment (fix round 1, Finding 1: a dead `changes` job
    # must not silently skip this too).
    if: needs.changes.outputs.code != 'false' && !cancelled()
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions
      - uses: actions/download-artifact@v8.0.2
        with:
          name: tjs-windows-amd64
          path: .
      - name: Install the Claude provider (npm, pinned — the bundle-bump gate)
        run: |
          V=$(sed -n 's/^claude-code //p' UPSTREAM_PIN)
          echo "provider pin: @anthropic-ai/claude-code@$V (deliberately behind upstream — see UPSTREAM_PIN)"
          npm i -g @anthropic-ai/claude-code@"$V" 2>&1 | tail -3
      - name: Install runtime deps (semver et al.) for the oracles
        id: deps
        run: npm ci --prefix deps/claude
      - name: Sync-primitive battery on the real Windows kernel
        run: |
          set -euo pipefail
          chmod +x ./tjs.exe || true
          ./tjs.exe run test/win-sync-battery.js | tee battery.out
          grep -q '^BATTERY OK' battery.out
      # The stat identity and os oracles judge node-shim against this runner's node on the
      # Windows rules (libuv's FileId ino, volume-serial dev, lstat at reparse points; node's
      # devNull): files, a directory and a symlink. They skip without CLODE_TJS, so this job is
      # the only place they run on Windows at all.
      - name: node-shim oracles (roundtrip + agentic + stat identity + os) on the real Windows kernel
        # Its own gate, not the battery's dependent: a red battery must not hide these
        # (test/ci-step-chaining.test.cjs). Still red if either fails.
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          set -euo pipefail
          PROV="$(node scripts/stage-provider.mjs)" || exit 1
          echo "provider: $PROV"
          node -e "require('fs').mkdirSync(process.env.RUNNER_TEMP + '/gates', { recursive: true })"
          CLODE_TJS="$PWD/tjs.exe" CLODE_PROVIDER_BIN="$PROV" \
            node --require ./test/file-watchdog-preload.cjs --test --test-concurrency=1 \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=./test/cell-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/gates/oracles.jsonl" \
              test/node-shim-roundtrip.test.cjs \
              test/node-shim-agentic.test.cjs \
              test/node-shim-fs-stat-identity.test.cjs \
              test/node-shim-os-devnull.test.cjs \
              test/node-shim-os-priority.test.cjs \
              test/node-shim-fs-readlink.test.cjs \
              test/node-shim-fs-noinherit.test.cjs \
              test/node-shim-fs-readdir.test.cjs \
              test/node-shim-fs-exclusive-win32.test.cjs \
              test/node-shim-resource-usage.test.cjs

      # THIS JOB'S GATE LIST (observability plan Task 5): every record test/cell-reporter.mjs wrote above, for ci.yml's
      # gates-ran-in-ci job to hold against test/ci-gates.cjs. Uploaded whatever happened above: a red job's list still
      # says which gates ran, and a job that uploads none is itself a finding there.
      - name: Upload this job's gate list (judged by gates-ran-in-ci)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gates-ran-windows-amd64-tests
          path: ${{ runner.temp }}/gates
          if-no-files-found: warn
          overwrite: true   # a re-run attempt replaces its own list (artifacts are run-scoped and immutable)

  # Windows ConPTY TUI render (windows-tjs-port spec, sub-project D). The FIRST
  # CI PTY harness on any platform: build a real quaude (`clode build`) and drive
  # IT directly (tjs.exe + node-shim + the real Claude Code bundle → Ink; no
  # launcher involved — a blobulated quaude carries its own engine and deps as
  # members) inside a real ConPTY (node-pty) with an xterm emulator on the far
  # end, and assert the welcome box painted. Runs the SAME
  # test/e2e-tui-tjs.test.cjs as POSIX, forcing CLODE_LIVE_RENDER=1 here — a
  # no-op now that the test's own gate (test/live-render-helper.cjs) already
  # defaults to "run" off darwin. There is no Keychain GUI modal on Windows to
  # hang on. CORRECTED: this comment used to claim that was also "the reason
  # POSIX CI can't run it" — false; POSIX here means Linux, which likewise has
  # no Keychain (there is no `security` binary on PATH at all), so Linux CI can
  # run this file too (see .superpowers/sdd/2026-09-02-phase2-name-the-steps/
  # linux-pty-experiment.md) — it simply never had a tjs binary available to
  # do so. Consumes the windows-amd64 leg's tjs-windows-amd64 engine.
  # Because it installs the latest provider it is also a Windows render bump gate.
  # Render-only; the ConPTY INPUT round-trip is the tracked follow-on (D2).
  windows-amd64-tui:
    needs: [changes, tjs]
    # Run once `tjs` FINISHES, whatever its conclusion — do NOT skip because some
    # OTHER leg failed. This job consumes ONE named artifact; a leg it does not use
    # has no bearing on whether it can run. Plain `needs: tjs` skips the moment any
    # HARD leg fails, which silently deletes this signal: when haiku-x64 was promoted
    # to gating (2026-07-17), a single real haiku regression skipped this job and the
    # three windows jobs in one stroke — a broken gate masking working gates, the
    # exact disease that let the dep-closure P0 through (node-shim-oracle skipped at
    # 9e968b4 for the same reason). If the artifact this job needs is genuinely
    # missing, download-artifact fails it LOUDLY, which is the honest answer.
    #
    # ALSO gated on `changes`: this job downloads a `tjs` artifact, so it must
    # skip in lockstep with `tjs` on a docs-only push (task-7) rather than
    # run and fail loudly on a missing artifact. `!= 'false'` not `== 'true'`
    # — see `tjs`'s own comment (fix round 1, Finding 1: a dead `changes` job
    # must not silently skip this too).
    if: needs.changes.outputs.code != 'false' && !cancelled()
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions
      - uses: actions/download-artifact@v8.0.2
        with:
          name: tjs-windows-amd64
          path: .
      - name: Install the Claude provider (npm, pinned — the render bump gate)
        run: |
          V=$(sed -n 's/^claude-code //p' UPSTREAM_PIN)
          echo "provider pin: @anthropic-ai/claude-code@$V (deliberately behind upstream — see UPSTREAM_PIN)"
          npm i -g @anthropic-ai/claude-code@"$V" 2>&1 | tail -3
      - name: Install root runtime deps (render seed deps)
        id: deps
        run: npm ci --prefix deps/claude
      - name: Install the PTY harness (node-pty win32-x64 prebuilt + @xterm/headless)
        id: harness
        run: npm install --prefix test
      - name: Preflight — node-pty can open a ConPTY on this kernel
        run: node test/harness-preflight.cjs
      # The two gates below each run whatever the gate before concluded, needing only the
      # setup they use (test/ci-step-chaining.test.cjs); the job is still red if any failed.
      - name: Render the real TUI under ConPTY and assert the welcome box
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.harness.outcome == 'success' }}
        run: |
          set -euo pipefail
          PROV="$(node scripts/stage-provider.mjs)" || exit 1
          echo "provider: $PROV"
          chmod +x ./tjs.exe || true
          node -e "require('fs').mkdirSync(process.env.RUNNER_TEMP + '/gates', { recursive: true })"
          CLODE_TJS="$PWD/tjs.exe" CLODE_CLAUDE_BIN="$PROV" CLODE_LIVE_RENDER=1 \
            node --require ./test/file-watchdog-preload.cjs --test --test-concurrency=1 \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=./test/cell-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/gates/tui.jsonl" \
              test/e2e-tui-tjs.test.cjs
      - name: Characterize the node-shim TTY input path under ConPTY (D2)
        if: ${{ !cancelled() && steps.harness.outcome == 'success' }}
        run: |
          set -euo pipefail
          chmod +x ./tjs.exe || true
          # Hermetic tjs-vs-node stdin/TTY differential (raw-keystroke ordering,
          # paused-mode read() as Ink reads, setRawMode, UTF-8 split-write) under
          # a real ConPTY. No provider/network — CLODE_TJS + the node-pty harness
          # (already installed above) are all it needs. First CI TTY-input coverage
          # on any platform; a failure pinpoints a shim divergence from node.
          node -e "require('fs').mkdirSync(process.env.RUNNER_TEMP + '/gates', { recursive: true })"
          CLODE_TJS="$PWD/tjs.exe" \
            node --require ./test/file-watchdog-preload.cjs --test --test-concurrency=1 \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=./test/cell-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/gates/tty.jsonl" \
              test/node-shim-tty.test.cjs

      # THIS JOB'S GATE LIST (observability plan Task 5): every record test/cell-reporter.mjs wrote above, for ci.yml's
      # gates-ran-in-ci job to hold against test/ci-gates.cjs. Uploaded whatever happened above: a red job's list still
      # says which gates ran, and a job that uploads none is itself a finding there.
      - name: Upload this job's gate list (judged by gates-ran-in-ci)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gates-ran-windows-amd64-tui
          path: ${{ runner.temp }}/gates
          if-no-files-found: warn
          overwrite: true   # a re-run attempt replaces its own list (artifacts are run-scoped and immutable)

  # Windows shim + sync-primitive coverage on the ARM64 kernel — the same
  # rationale as windows-amd64-tests, exercised against the windows-arm64 leg's
  # native MSVC ARM64 engine. No tui counterpart yet (out of scope).
  windows-arm64-tests:
    needs: [changes, tjs]
    # Run once `tjs` FINISHES, whatever its conclusion — do NOT skip because some
    # OTHER leg failed. This job consumes ONE named artifact; a leg it does not use
    # has no bearing on whether it can run. Plain `needs: tjs` skips the moment any
    # HARD leg fails, which silently deletes this signal: when haiku-x64 was promoted
    # to gating (2026-07-17), a single real haiku regression skipped this job and the
    # three windows jobs in one stroke — a broken gate masking working gates, the
    # exact disease that let the dep-closure P0 through (node-shim-oracle skipped at
    # 9e968b4 for the same reason). If the artifact this job needs is genuinely
    # missing, download-artifact fails it LOUDLY, which is the honest answer.
    #
    # ALSO gated on `changes`: this job downloads a `tjs` artifact, so it must
    # skip in lockstep with `tjs` on a docs-only push (task-7) rather than
    # run and fail loudly on a missing artifact. `!= 'false'` not `== 'true'`
    # — see `tjs`'s own comment (fix round 1, Finding 1: a dead `changes` job
    # must not silently skip this too).
    if: needs.changes.outputs.code != 'false' && !cancelled()
    runs-on: windows-11-arm
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions
      - uses: actions/download-artifact@v8.0.2
        with:
          name: tjs-windows-arm64
          path: .
      - name: Install the Claude provider (npm, pinned — the bundle-bump gate)
        run: |
          V=$(sed -n 's/^claude-code //p' UPSTREAM_PIN)
          echo "provider pin: @anthropic-ai/claude-code@$V (deliberately behind upstream — see UPSTREAM_PIN)"
          npm i -g @anthropic-ai/claude-code@"$V" 2>&1 | tail -3
      - name: Install runtime deps (semver et al.) for the oracles
        id: deps
        run: npm ci --prefix deps/claude
      - name: Sync-primitive battery on the real Windows kernel
        run: |
          set -euo pipefail
          chmod +x ./tjs.exe || true
          ./tjs.exe run test/win-sync-battery.js | tee battery.out
          grep -q '^BATTERY OK' battery.out
      # The stat identity and os oracles judge node-shim against this runner's node on the
      # Windows rules (libuv's FileId ino, volume-serial dev, lstat at reparse points; node's
      # devNull): files, a directory and a symlink. They skip without CLODE_TJS, so this job is
      # the only place they run on Windows at all.
      - name: node-shim oracles (roundtrip + agentic + stat identity + os) on the real Windows kernel
        # Its own gate, not the battery's dependent: a red battery must not hide these
        # (test/ci-step-chaining.test.cjs). Still red if either fails.
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          set -euo pipefail
          PROV="$(node scripts/stage-provider.mjs)" || exit 1
          echo "provider: $PROV"
          node -e "require('fs').mkdirSync(process.env.RUNNER_TEMP + '/gates', { recursive: true })"
          CLODE_TJS="$PWD/tjs.exe" CLODE_PROVIDER_BIN="$PROV" \
            node --require ./test/file-watchdog-preload.cjs --test --test-concurrency=1 \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=./test/cell-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/gates/oracles.jsonl" \
              test/node-shim-roundtrip.test.cjs \
              test/node-shim-agentic.test.cjs \
              test/node-shim-fs-stat-identity.test.cjs \
              test/node-shim-os-devnull.test.cjs \
              test/node-shim-fs-readlink.test.cjs \
              test/node-shim-fs-noinherit.test.cjs \
              test/node-shim-fs-readdir.test.cjs \
              test/node-shim-fs-exclusive-win32.test.cjs \
              test/node-shim-resource-usage.test.cjs

      # THIS JOB'S GATE LIST (observability plan Task 5): every record test/cell-reporter.mjs wrote above, for ci.yml's
      # gates-ran-in-ci job to hold against test/ci-gates.cjs. Uploaded whatever happened above: a red job's list still
      # says which gates ran, and a job that uploads none is itself a finding there.
      - name: Upload this job's gate list (judged by gates-ran-in-ci)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gates-ran-windows-arm64-tests
          path: ${{ runner.temp }}/gates
          if-no-files-found: warn
          overwrite: true   # a re-run attempt replaces its own list (artifacts are run-scoped and immutable)

  # templates-drift MOVED OUT OF ci.yml (2026-08-24).
  #
  # It compared the published pack's engine recipe against this tree's, on every
  # push — so it went red the moment engine sources moved past the last release,
  # which is the NORMAL state of a repo doing engine work. That is a STATE, not a
  # fault, and "cut a release" was never a fix: it reset the baseline until the
  # next engine commit. The cost was real — main was permanently red, so "is main
  # green?" stopped being a usable question, which is precisely how an ambient red
  # hid a P0 across 13 jobs before (see BACKLOG).
  #
  # Worse, the hazard it warned about was defended NOWHERE. libexec/clode-templates
  # .cjs checked only the coarse tjsPin (txiki version + short sha), so two clodes
  # with the same pin and different patch stacks both accepted the same pack.
  #
  # The defence now lives where a wrong answer costs someone something: obtainEngine
  # compares the manifest's recipe (stamped by 4f86738) against the recipe baked
  # into the running clode (__CLODE_BAKED_ENGINE_RECIPE__) and REFUSES a mismatched
  # pack at fetch. Missing on either side is reported as "cannot check", never
  # treated as a match. See test/clode-templates.test.cjs.
  #
  # And the drift check itself moved to release.yml, where "we are about to publish
  # templates that do not match this tree" IS a fault.


  test:
    uses: ./.github/workflows/suite.yml
    permissions:
      contents: read

  # node-shim oracle — the node-vs-tjs behavioral diff, run under a REAL tjs.
  # WHY THIS JOB EXISTS: the `test` job above (npm test) never builds a tjs, so
  # every `skipUnlessTjs` node-shim oracle test SILENTLY SKIPS there — the diff
  # that catches shim-vs-node divergence was disabled in the default path. That
  # gap let a real bug ship: fs.readFileSync returned a bare Uint8Array (not a
  # Buffer), so .toString('hex')/.readUInt8 were silently wrong and the Edit tool
  # failed under tjs — no wall, no crash, green everywhere (fixed 2026-07-15,
  # A1 audit). A dedicated, visible job is the standing guard: this class cannot
  # hide again. Reuses the CI-tier linux-x64-musl leg's bare-engine artifact
  # (tjs-<leg>, uploaded expressly "for oracle jobs") — no rebuild. Same run
  # pattern release.yml's be-oracle proved green on s390x-musl.
  node-shim-oracle:
    needs: [changes, tjs]
    # Run once `tjs` FINISHES, whatever its conclusion — do NOT skip because some
    # OTHER leg failed. This job consumes ONE named artifact; a leg it does not use
    # has no bearing on whether it can run. Plain `needs: tjs` skips the moment any
    # HARD leg fails, which silently deletes this signal: when haiku-x64 was promoted
    # to gating (2026-07-17), a single real haiku regression skipped this job and the
    # three windows jobs in one stroke — a broken gate masking working gates, the
    # exact disease that let the dep-closure P0 through (node-shim-oracle skipped at
    # 9e968b4 for the same reason). If the artifact this job needs is genuinely
    # missing, download-artifact fails it LOUDLY, which is the honest answer.
    #
    # ALSO gated on `changes`: this job downloads a `tjs` artifact, so it must
    # skip in lockstep with `tjs` on a docs-only push (task-7) rather than
    # run and fail loudly on a missing artifact. `!= 'false'` not `== 'true'`
    # — see `tjs`'s own comment (fix round 1, Finding 1: a dead `changes` job
    # must not silently skip this too).
    if: needs.changes.outputs.code != 'false' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # LIKE-FOR-LIKE LIBC, ON PURPOSE — the reference node runs under musl because
    # the engine does.
    #
    # This job diffs a MUSL-built engine against "host node". On a stock
    # ubuntu-latest, host node is a GLIBC build, so the premise "our engine vs the
    # node on this host" is false and the ratchet was really measuring libc. It
    # caught itself doing that on 2026-08-23 (run 32606247462), three rows red with
    # BOTH SIDES CORRECT:
    #   os.constants.signals   ours had SIGUNUSED: 31, node's did not
    #   os.constants.dlopen    ours 4 members, node's 5 (RTLD_DEEPBIND)
    # musl's arch/*/bits/signal.h literally says `#define SIGUNUSED SIGSYS`, and
    # musl's dlfcn.h has no RTLD_DEEPBIND; glibc 2.39 says the opposite on both
    # (verified directly: `echo '#include <signal.h>' | gcc -E -dM -` on Ubuntu
    # 24.04 prints SIGSYS 31 and no SIGUNUSED). Since f8546da/0decc98 the engine
    # reports what ITS OWN headers say — that is the entire point of the generated
    # constants work, it is what abolished the hand-maintained platform tables — so
    # a glibc reference makes an exact gate fail for something that is not a defect.
    #
    # The fix is the INSTRUMENT, not the ratchet. There is deliberately NO exception
    # list, NO skip list, NO "allowed libc differences" file: every entry in such a
    # file is a hole in a gate whose whole value is being exact, and a curated table
    # of blessed divergences is the hand-maintained platform table walking back in
    # through the side door. Make the comparison honest instead.
    #
    # WHY A CONTAINER AND NOT setup-node: actions/setup-node serves the official
    # nodejs.org builds, which are glibc-only — there is no musl node it can give
    # us. The image IS the reference node. Its tag is pinned to the SAME version as
    # .tool-versions and asserted below, so a bump to one and not the other is a
    # named failure rather than a silent skew.
    container:
      image: node:24.22.0-alpine
    defaults:
      run:
        shell: bash
    steps:
      # BEFORE checkout on purpose: a `run:` step in a container job needs no repo,
      # and actions/checkout with no git on PATH silently degrades to a REST tarball
      # download. Each package is load-bearing; alpine ships none of them:
      #   bash        `defaults.run.shell: bash`, and the steps below are bash
      #   git         so checkout is a real clone, not the degraded fallback
      #   openssl     two rows (node-shim-http-client, node-shim-http-proxy) MINT A
      #               CERTIFICATE and t.skip() without it. A skipped oracle row is
      #               not a pass — that silent-green is the disease this whole job
      #               exists to prevent, so the container must not reintroduce it.
      #   procps      node-shim-signals reads `ps -o state= -p PID` to prove SIGSTOP
      #               actually stopped the child. busybox's ps has no `state`
      #               column, so the probe would return 'GONE' and the row would
      #               fail for the tool, not the shim.
      #   libstdc++   the Bun-packaged provider binary links it. node:alpine
      #               already pulls it in for node itself; named explicitly so the
      #               dependency is stated rather than inherited by luck.
      #   tzdata      node-shim-intl runs its rows at TZ=America/New_York. node and
      #               native carry ICU's own zone data; the engine reads local time
      #               through libc, and musl without /usr/share/zoneinfo answers UTC
      #               for every zone (measured 2026-11-21: 15 rows off by the zone's offset). That
      #               divergence is real and named in BACKLOG.md; this row asks the
      #               formatting question, on a box that has the zone.
      # The other externals these tests reach for — /bin/echo, /bin/cat, /bin/sh,
      # /bin/sleep, /bin/pwd, mkfifo, kill, uname, true — are busybox applets that
      # alpine already symlinks into place, and every row that uses one runs the
      # SAME binary on both sides of the diff, so busybox-vs-coreutils cannot skew
      # a comparison here.
      - name: musl prerequisites (bash, git, openssl, procps, tzdata — see above)
        shell: sh
        run: |
          set -e
          # `procps` is the provides-name; the real package is procps-ng on
          # alpine >= 3.19. Asking for the provides-name works on both sides of
          # that rename.
          apk add --no-cache bash git openssl procps libstdc++ tzdata
          # Name the tool failure HERE rather than letting it surface as a red
          # SIGSTOP row two steps later. procps-ng installs /usr/bin/ps, which
          # precedes busybox's /bin/ps on alpine's PATH.
          ps -o state= -p $$ >/dev/null \
            || { echo "ps has no 'state' column — node-shim-signals' SIGSTOP probe cannot work" >&2; exit 1; }
      - uses: actions/checkout@v7.0.1
      # The same .tool-versions skew guard suite.yml runs, PLUS the assertion that
      # makes this job's premise checkable instead of assumed. If someone ever drops
      # the container: key, or the image starts shipping a glibc node, this fails by
      # name here rather than reappearing as a mystery constants diff.
      - name: Assert the reference node matches the .tool-versions pin AND is musl
        run: |
          set -euo pipefail
          want=$(sed -n 's/^nodejs //p' .tool-versions)
          have=$(node -v); have=${have#v}
          [ "$have" = "$want" ] || {
            echo "node skew: .tool-versions=$want but this container's node=$have." >&2
            echo "           Bump the container: image: tag in this job to node:$want-alpine." >&2
            exit 1; }
          # process.report is node's own answer about its own linkage: a glibc build
          # reports header.glibcVersionRuntime, a musl build has no such field. That
          # is arch-independent and does not depend on ldd's output format.
          node -e '
            const h = process.report.getReport().header;
            if (h.glibcVersionRuntime) {
              console.error("reference node is GLIBC-linked (" + h.glibcVersionRuntime + "),");
              console.error("but this job diffs a musl engine against it. The comparison would");
              console.error("be measuring libc, not shim fidelity. Restore the alpine container.");
              process.exit(1);
            }
            console.log("reference node: " + process.version + ", musl-linked (no glibcVersionRuntime)");
          '
      - uses: actions/download-artifact@v8.0.2
        with:
          name: tjs-linux-x64-musl   # bare static engine from the CI-tier leg
          path: ${{ runner.temp }}/tjs
      - name: Install the runtime dep closure (ws/yaml/semver/string-width/... for the shim)
        run: npm ci --prefix deps/claude
      # The naude-vs-quaude parity gate stages cli.cjs from a real Bun-packaged
      # provider; with none present it SKIPS, which is exactly the silent-green
      # this job exists to prevent. Same provisioning the windows-amd64 job uses.
      # Under the musl container npm resolves the optional dep
      # @anthropic-ai/claude-code-linux-x64-musl (upstream publishes it beside the
      # glibc one), so the provider is musl too — the same like-for-like the
      # reference node is here for.
      - name: Install the Claude provider (npm, pinned — the parity gate's input)
        run: |
          V=$(sed -n 's/^claude-code //p' UPSTREAM_PIN)
          echo "provider pin: @anthropic-ai/claude-code@$V (deliberately behind upstream — see UPSTREAM_PIN)"
          npm i -g @anthropic-ai/claude-code@"$V" 2>&1 | tail -3
      # Live-network gate (regression guard): nothing else in CI makes a real
      # outbound connection — every API turn is opt-in and skips — which is how an
      # IPv6-first fetch-connect regression once shipped (f8f6e1d: connected to only
      # the first resolved address, so a v4-only host died at wsi=NULL). A
      # credential-free HEAD proves the built engine can DNS + TLS-connect + get a
      # response. Retries so a transient network blip doesn't flake the gate.
      - name: Live-connect smoke — the engine reaches the internet over TLS
        env:
          CLODE_TJS: ${{ runner.temp }}/tjs/tjs
        run: |
          set -uo pipefail
          chmod +x "$CLODE_TJS"
          # Raw `tjs eval` has no node-shim `process`, so signal via a marker the
          # shell checks (a rejected fetch -> no OK marker -> the gate fails).
          P='fetch("https://example.com/",{method:"HEAD"}).then(function(r){console.log("LIVE-CONNECT-OK "+r.status)}).catch(function(e){console.log("LIVE-CONNECT-FAIL "+String(e))})'
          for i in 1 2 3; do
            out=$("$CLODE_TJS" eval "$P" 2>&1 || true); echo "$out"
            case "$out" in *LIVE-CONNECT-OK*) exit 0 ;; esac
            echo "retry $i…"; sleep 3
          done
          echo "live-connect smoke: the engine could not establish a TLS connection" >&2; exit 1
      - name: node-shim oracle suite (every module diffed vs host node, under tjs)
        env:
          CLODE_TJS: ${{ runner.temp }}/tjs/tjs
        run: |
          set -euo pipefail
          chmod +x "$CLODE_TJS"
          "$CLODE_TJS" eval 'console.log("linux-x64-musl tjs alive:", tjs.version)'
          # EXCLUDED — the PTY tests, which need a controlling terminal + the
          # node-pty harness dep this bare-engine runner has neither of:
          #   node-shim-tty        no controlling terminal on a headless runner
          # (Ctrl-Z is no longer a node-shim test: node-shim-ctrlz-pty was replaced by
          #  test/e2e-ctrlz-tui.test.cjs — a real quaude TUI survives-Ctrl-Z regression
          #  guard, opt-in via CLODE_LIVE_RENDER; the SIGTSTP/SIGCONT wiring stays in
          #  node-shim-signals. The new node-shim-api-surface-gate IS picked up here —
          #  it hard-gates upstream Bun.*/require drift against the latest provider.)
          # node-shim-core and node-shim-bunshim are NO LONGER excluded: the two
          # Linux-portability bugs they caught are FIXED and now gated here —
          #   node-shim-core     os.constants.signals is OS-derived per platform
          #                      (SIGBUS 7 etc. on Linux; os.cjs SIGNALS_LINUX +
          #                      __tjs_signals), no longer a hardcoded darwin table.
          #   node-shim-bunshim  bun:ffi suffix is platform-aware ('so' on Linux).
          # node-shim-child-process was un-excluded earlier: its `spawnSync: cwd` row
          # failed because musl rejected posix_spawn cwd (the addchdir_np gate was
          # #ifdef __GLIBC__), so tar's KAT and `clode fetch node` died "no tar
          # tool found on PATH". Fixed in txiki-sync-spawn.patch (parent-side chdir
          # dance on musl); this file runs on musl as the standing guard.
          EXCLUDE='node-shim-tty|node-shim-agentic'
          FILES=$(ls test/node-shim-*.test.cjs | grep -vE "$EXCLUDE")
          # The glob carries test/node-shim-differential.test.cjs (observability Task 3): every call the carve
          # makes to a shim module, judged against this job's node. It needs exactly CLODE_TJS and
          # CLODE_PROVIDER_BIN, both set here, and skips without them, so the skip count below names it.
          # node-shim-agentic is out of the glob and named here: it drives this job's Bash and Edit cells
          # (test/build-gates/tool-coverage-gates.test.cjs, CELL_JOBS), and a claimed file is named in a run line.
          FILES="$FILES test/node-shim-agentic.test.cjs"
          # The parity gate's input: cli.cjs is staged from this provider and run
          # under BOTH targets' runtimes (naude = node, quaude = tjs+shim), then
          # diffed. Fail loud if it is missing — a skipped oracle is not a pass.
          PROV="$(node scripts/stage-provider.mjs)" || exit 1
          echo "provider: $PROV"
          export CLODE_PROVIDER_BIN="$PROV"
          # test/shim-surface.test.cjs (task-8, phase 5) needs exactly this job's
          # two inputs — CLODE_TJS above, CLODE_PROVIDER_BIN just set — and nothing
          # else. It had been skipping in `test` (suite.yml, npm test) since
          # upstream 2.1.243, silently: that job has neither input, and the file's
          # own header warns a skipped run there "would contribute zero gaps and
          # read exactly like a clean one." This job already carries both.
          FILES="$FILES test/shim-surface.test.cjs"
          # test/guard-subcommands-gate.test.cjs (task-8, phase 5) reads the REAL
          # ~/.cache/clode/<version>/ carve — deliberately os.homedir(), ignoring
          # CLODE_CACHE/CLODE_STATE_ROOT (see the file's own header) — so it was
          # ALSO skipping in `test` (an empty cache there), and this job's EXISTING
          # provider staging cannot satisfy it either: stage-provider.mjs's
          # minimised copy lives in a temp dir with no /versions/ or /providers/
          # marker in its path, so clode-resolve.cjs's cacheKey() falls back to a
          # content hash instead of the pin, and nothing here has ever populated a
          # PIN-VERSIONED cache entry. Seed one directly, with the SAME
          # extractIfNeeded() that `clode build` itself calls
          # (libexec/clode-build.cjs's stageUpstreamCli) — without paying for a
          # whole quaude blobulate just to get one cache entry on disk.
          PIN=$(sed -n 's/^claude-code //p' UPSTREAM_PIN)
          node -e '
            const path = require("node:path");
            const { extractIfNeeded } = require("./libexec/clode-extract.cjs");
            const { clodeCacheDir } = require("./libexec/clode-paths.cjs");
            const pin = process.argv[1];
            const cacheDir = path.join(clodeCacheDir(process.env), pin);
            extractIfNeeded({ bin: process.env.CLODE_PROVIDER_BIN, cacheDir, libexec: "libexec", key: pin });
            console.log("seeded real cache:", cacheDir);
          ' "$PIN"
          FILES="$FILES test/guard-subcommands-gate.test.cjs"
          # test/engine-regexp-reuse.test.cjs tests the ENGINE, not the shim: the
          # REGEXP-REUSE-SAME-FLAGS patch (a RegExp rebuilt with its own flags reuses
          # its compiled bytecode), by timing and by semantics against this job's node.
          # It needs CLODE_TJS and nothing else, and the suite job has no engine, so
          # without this line it would run on dev boxes only.
          FILES="$FILES test/engine-regexp-reuse.test.cjs"
          # test/engine-regexp-captures.test.cjs tests the ENGINE too: REGEXP-CAPTURE-U16 (a RegExp may
          # carry 32,768 capture groups, native's limit), its semantics against this job's node. It needs
          # CLODE_TJS and nothing else, so it is placed exactly as its sibling above.
          FILES="$FILES test/engine-regexp-captures.test.cjs"
          # The gates that read the pinned carve seeded above, or stage the provider (which needs CLODE_TJS):
          # each skipped in both suite rows of CI run 44572930594 ("pinned carve not found", "provider found but
          # staging it failed"), and no job ran them (observability Task 5; test/ci-gates.cjs PLACED). Measured
          # before adding them, in node:24.22.0-alpine with this job's engine, provider and seeded carve: every
          # gate passed and none of the five added a skip.
          FILES="$FILES test/build-gates/dep-closure-gates.test.cjs test/build-gates/lexical-code-mask.test.cjs"
          FILES="$FILES test/build-gates/renameable-positions.test.cjs test/zlib-zstd-stream-gap.test.cjs"
          FILES="$FILES test/fidelity/regexp-capture-census.test.cjs"
          mkdir -p "$RUNNER_TEMP/cells"
          node --require ./test/file-watchdog-preload.cjs --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./test/cell-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/cells/node-shim-oracle.jsonl" \
            $FILES 2>&1 | tee shim-oracle.out
          # A SKIPPED run must be distinguishable from a clean one, never a silent pass. This step used to assert an
          # anonymous `skipped 2`; a third, legitimate skip (a Windows-only row, CI run 44629240081) turned it red while
          # a renamed one could have kept it green. The skips this job accepts are named instead (below).
          # Skips are judged BY NAME, not counted: gates-ran-in-ci holds this job to every file it runs (test/ci-gates.cjs
          # FILES, a skip accepted only by its test name; ci-gate-placement refuses a file a job runs that FILES does not judge).
      # DOES THE LAST RELEASE STILL HOST HEAD'S BUILD? Every engine leg's first step runs on the
      # pinned bootstrap engine (scripts/bootstrap-engine.sh), and CI run 44443821699 found out it
      # could not -- on every leg at once, after six weeks of nobody running the opt-in test that
      # asks. It is cheap (one ~4MB range request, a few seconds) and this job already has the
      # network, a node and the runtime dep closure, so it asks on every push. The slice it fetches
      # is linux-amd64 (musl, static), this runner's. ZERO skips: a skipped answer is no answer.
      - name: The pinned release's engine still hosts HEAD's build (bootstrap, online)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          # curl, not busybox wget: the resolver asks for a byte RANGE, and busybox wget refuses
          # a 206 it did not ask for with its own -c (it dies "server returned error").
          apk add --no-cache curl
          # Under test/cell-reporter.mjs: gates-ran-in-ci holds this job to the file by name (FILES), so a skipped row,
          # which answers nothing, is red there.
          mkdir -p "$RUNNER_TEMP/cells"
          CLODE_BOOTSTRAP_ONLINE=1 node --require ./test/file-watchdog-preload.cjs --test --test-concurrency=1 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./test/cell-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/cells/bootstrap-online.jsonl" \
            test/bootstrap-engine-online.test.cjs 2>&1 | tee bootstrap-online.out
      # THE CELLS this job drives (test/build-gates/tool-coverage-gates.test.cjs, CELL_JOBS): every test that runs a
      # claimed driver's control PASSED above, on this engine, as test/cell-reporter.mjs recorded it. A skip, a failure or
      # a test that never ran means the tool x mode cell ran nowhere, and this step names it (observability plan Task 1).
      - name: Cells — every tool x mode cell this job claims, it ran
        if: ${{ !cancelled() }}
        run: |
          node -e "require('fs').mkdirSync(process.env.RUNNER_TEMP + '/gates', { recursive: true })"
          CLODE_CELL_JOB=node-shim-oracle CLODE_CELL_RAN="$RUNNER_TEMP/cells" node --require ./test/file-watchdog-preload.cjs --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./test/cell-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/gates/cells-check.jsonl" \
            --test-name-pattern=cells-ran-in-ci-job test/build-gates/tool-coverage-gates.test.cjs

      # THIS JOB'S GATE LIST (observability plan Task 5): every record test/cell-reporter.mjs wrote above, for ci.yml's
      # gates-ran-in-ci job to hold against test/ci-gates.cjs. Uploaded whatever happened above: a red job's list still
      # says which gates ran, and a job that uploads none is itself a finding there.
      # ONE upload path: in a container job (node-shim-oracle) the runner rewrites only the FIRST line of a multi-line
      # `path` to the container's mount, so a second directory was silently left out (CI run 44597568635 lost its
      # gates/). Both directories are copied under one first.
      - name: Stage this job's gate list in one directory
        if: ${{ !cancelled() }}
        run: node -e "const fs=require('fs'),p=require('path'),t=process.env.RUNNER_TEMP;for(const d of ['cells','gates'])if(fs.existsSync(p.join(t,d)))fs.cpSync(p.join(t,d),p.join(t,'gates-ran',d),{recursive:true})"
      - name: Upload this job's gate list (judged by gates-ran-in-ci)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gates-ran-node-shim-oracle
          path: ${{ runner.temp }}/gates-ran
          if-no-files-found: warn
          overwrite: true   # a re-run attempt replaces its own list (artifacts are run-scoped and immutable)

  # The BUILDER and the PACKAGED TARGETS — on glibc, on purpose.
  #
  # Two standing guards that were the tail of node-shim-oracle until that job had
  # to move into a musl container to make its comparison honest (see its header).
  # They could not follow it: both build and RUN a naude, and a naude embeds the
  # pinned official Node from nodejs.org — a glibc binary that does not exec on
  # alpine. Splitting them off costs a second artifact download, a second
  # deps/claude install and a second provider install; the alternative was one job
  # whose libc had to be wrong for one half of it or the other.
  #
  # Consumes the SAME tjs-linux-x64-musl artifact — the engine is static, so it
  # runs on either libc; it is only the REFERENCE side of a comparison that has to
  # match, and nothing here compares against host node.
  native-builder-oracle:
    needs: [changes, tjs]
    # Same rationale as node-shim-oracle's: run once `tjs` FINISHES whatever its
    # conclusion. This job consumes ONE named artifact; a leg it does not use has
    # no bearing on whether it can run, and a job that skips is a gate that is not
    # there. If the artifact is genuinely missing, download-artifact fails LOUDLY.
    #
    # ALSO gated on `changes`: this job downloads a `tjs` artifact, so it must
    # skip in lockstep with `tjs` on a docs-only push (task-7) rather than
    # run and fail loudly on a missing artifact. `!= 'false'` not `== 'true'`
    # — see `tjs`'s own comment (fix round 1, Finding 1: a dead `changes` job
    # must not silently skip this too).
    if: needs.changes.outputs.code != 'false' && !cancelled()
    runs-on: ubuntu-latest
    # 45 is NOT above test/clode-native.test.cjs's own limits (its 80-minute watchdog OVERRIDES entry sums two
    # 30-minute wall ceilings sized for a starved dev box). CI relies on the measured builds instead: this whole job
    # took 285-472 s over the 10 green ci.yml runs before 2026-11-19 (gh api run jobs), so 45 is about 6x its
    # longest. Here the job timeout, not the watchdog, is the backstop that fires first, and it names the job.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions
      # SETUP, each with an id: the gates below run whatever an earlier GATE concluded
      # (!cancelled()), but only on setup that succeeded — and the SHIPPED ARTIFACT BROKEN
      # banner speaks only when it did (test/ci-step-chaining.test.cjs).
      - uses: actions/download-artifact@v8.0.2
        id: engine
        with:
          name: tjs-linux-x64-musl   # bare static engine from the CI-tier leg
          path: ${{ runner.temp }}/tjs
      - name: Install the runtime dep closure (the blobulate's ext-dep closure)
        id: deps
        run: npm ci --prefix deps/claude
      # Fail loud if absent, below — a skipped acceptance is not a pass.
      - name: Install the Claude provider (npm, pinned — the acceptances' input)
        id: provider
        run: |
          V=$(sed -n 's/^claude-code //p' UPSTREAM_PIN)
          echo "provider pin: @anthropic-ai/claude-code@$V (deliberately behind upstream — see UPSTREAM_PIN)"
          npm i -g @anthropic-ai/claude-code@"$V" 2>&1 | tail -3
      - name: mark the engine executable
        id: engineexec
        run: chmod +x "${{ runner.temp }}/tjs/tjs"
      # The BUILDER, driven the way a user drives it: blobulate a native clode, then
      # make THAT binary build a quaude with node absent from PATH.
      #
      # WHY THIS STEP EXISTS (same disease as this job's own header, caught again
      # 2026-07-16): clode-native's acceptances 2+3 are the only proof that the
      # node-free builder can build the product, and they skip silently without
      # CLODE_PROVIDER_BIN. No workflow named the file, so they ran ONLY under
      # `npm test` — a job with no tjs and no provider, where they always skipped.
      # A commit then made the dep-closure gate spawn `process.execPath -e` to
      # introspect the bun-shim; under a blobulated builder process.execPath IS the
      # blobulated clode (no node on the box, no `-e`), so EVERY `clode build` under
      # clode-native died at the gate — on pushed main, with CI fully green. The
      # binary that is the entire point of the Q1 split was 100% broken and
      # nothing said a word. This step is the standing guard.
      #
      # It used to run as the last steps of node-shim-oracle, sharing that job's
      # tjs + deps/claude + provider. It moved here when that job went into a musl
      # container (see its header): this step and the one after it BUILD AND RUN a
      # naude, and a naude embeds the pinned OFFICIAL Node from nodejs.org, which
      # is a glibc build that will not exec on alpine. So the split is along the
      # libc line, which is the honest place for it: the shim oracle needs a musl
      # reference, the naude guards need glibc, and one job cannot be both.
      # Cache the pinned Node naude embeds so acceptance 4 (below) downloads it
      # from nodejs.org at most once per pin, not every run — and a transient
      # nodejs.org outage reuses the cache instead of turning this step red. Keyed
      # on the pin file so a version bump misses and re-fetches automatically.
      - name: Cache the pinned Node (naude engine)
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/clode-nodes
          key: pinned-node-${{ hashFiles('deps/clode/node-pin.json') }}-${{ runner.os }}-${{ runner.arch }}
      - name: the native builder BUILDS THE PRODUCT (node-free, real provider)
        id: build
        env:
          CLODE_TJS: ${{ runner.temp }}/tjs/tjs
          # acceptance 4 (naude) fetches the pinned Node into this persistent,
          # cached store instead of a per-run temp dir (test/clode-native.test.cjs
          # honors CLODE_NODES); acceptances 1-3 (quaude) ignore it.
          CLODE_NODES: ${{ runner.temp }}/clode-nodes
        run: |
          set -euo pipefail
          # `clode bootstrap` embeds this; without it the blobulate has no payload.
          node scripts/build-clode-main.mjs
          # Provision postject into deps/clode: quaude-blobulate.js carries it as a
          # builder member (soft — skipped if absent), and acceptance 4's naude
          # build needs it on disk. Without this the blobulated clode-native ships no
          # postject and the naude assembly dies "Cannot find module .../postject".
          npm ci --prefix deps/clode 2>&1 | tail -3
          PROV="$(node scripts/stage-provider.mjs)" || exit 1
          echo "provider: $PROV"
          # The acceptances prove node-freeness by running the blobulated builder with
          # PATH=/usr/bin:/bin, and they SKIP if a node lives there ("cannot prove
          # node-freeness here"). Surface that up front: if this runner image ever
          # puts node on the minimal PATH, the skipped-0 assertion below would fail
          # with a confusing message about skips instead of the real reason.
          if PATH=/usr/bin:/bin command -v node; then
            echo "ERROR: this runner has node on /usr/bin:/bin, so the node-free proof cannot run." >&2
            echo "       Give test/clode-native.test.cjs a synthetic minimal PATH, or run this step" >&2
            echo "       on an image without a system node — do NOT just drop the assertion." >&2
            exit 1
          fi
          echo "minimal PATH has no node — the node-free proof can run"
          # A skipped acceptance is not a pass: this test skips itself when the
          # provider is absent, so assert it actually RAN rather than trusting a
          # green exit. That distinction is the whole reason this step exists.
          # Both summary forms are matched on purpose — node prints "ℹ skipped N"
          # (spec reporter) or "# skipped N" (tap), and pinning the wrong one
          # would make this guard fire always or never. Verified locally: node 24
          # emits the spec form even when piped.
          mkdir -p "$RUNNER_TEMP/cells"
          CLODE_PROVIDER_BIN="$PROV" CLODE_CLAUDE_BIN="$PROV" \
            node --require ./test/file-watchdog-preload.cjs --test --test-timeout=1200000 \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=./test/cell-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/cells/native-builder.jsonl" \
              test/clode-native.test.cjs 2>&1 | tee native.out
          # Skips are judged BY NAME, not counted: gates-ran-in-ci holds this job to every file it runs (test/ci-gates.cjs
          # FILES, a skip accepted only by its test name; ci-gate-placement refuses a file a job runs that FILES does not judge).

      # The packaged targets themselves: build a real naude (Node SEA) and a real
      # quaude (blobulated tjs) from the same CC and diff them. The model oracle above
      # runs cli.cjs under two engines; only this covers the PACKAGING. Nothing in
      # CI built a naude before, which is how a bug that killed every naude on its
      # first boot ("sea.getRawAsset is not a function") stayed green.
      - name: full-binary oracle — real naude vs real quaude
        id: oracle
        # Packages its own naude and quaude: a red build step above must not hide it, but it
        # needs the setup (test/ci-step-chaining.test.cjs).
        if: ${{ !cancelled() && steps.engine.outcome == 'success' && steps.deps.outcome == 'success' && steps.provider.outcome == 'success' && steps.engineexec.outcome == 'success' }}
        env:
          # /tjs/tjs, not /tjs: download-artifact unpacks INTO ${{ runner.temp }}/tjs,
          # so that dir is the artifact, and the engine is the file inside it. Pointing
          # CLODE_TJS at the DIRECTORY made `clode build` read it as the template —
          # "EISDIR: illegal operation on a directory, read". Wrong since this step was
          # written, and invisible twice over: the job used to die at an earlier step
          # (the drifted autoupdater anchor), and then skipped entirely once a hard leg
          # failed. The two steps above always had it right.
          CLODE_TJS: ${{ runner.temp }}/tjs/tjs
          CLODE_ORACLE_BINARIES: '1'
        run: |
          set -euo pipefail
          PROV="$(node scripts/stage-provider.mjs)" || exit 1
          mkdir -p "$RUNNER_TEMP/cells"
          CLODE_PROVIDER_BIN="$PROV" CLODE_CLAUDE_BIN="$PROV" \
            node --require ./test/file-watchdog-preload.cjs --test --test-timeout=1200000 \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=./test/cell-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/cells/oracle-binaries.jsonl" \
              test/oracle-binaries.test.cjs

      # THE ORACLE PROPERTY the step above spends: naude is only a control for quaude
      # because it carries the bun-shim and NOT the node-shim. The gate for that reads a
      # BUILT naude's SEA asset table, so it belongs HERE, in the one job that has one —
      # under `npm test` it would skip forever, which is the 2026-08-25 disease (sixteen
      # tests skipping in CI since forever, invisibly). A skip is red by name in gates-ran-in-ci
      # (FILES accepts none for it), for the same reason as clode-native's acceptances: a gate that skipped is a gate
      # that is not there.
      - name: naude shim boundary — the bytes that make the oracle an oracle
        if: ${{ !cancelled() && steps.engine.outcome == 'success' && steps.deps.outcome == 'success' && steps.provider.outcome == 'success' && steps.engineexec.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cells"
          node --require ./test/file-watchdog-preload.cjs --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./test/cell-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/cells/naude-shim-boundary.jsonl" \
            test/naude-shim-boundary.test.cjs 2>&1 | tee boundary.out
          # Skips are judged BY NAME, not counted: gates-ran-in-ci holds this job to every file it runs (test/ci-gates.cjs
          # FILES, a skip accepted only by its test name; ci-gate-placement refuses a file a job runs that FILES does not judge).

      # THE CELLS this job drives (test/build-gates/tool-coverage-gates.test.cjs, CELL_JOBS): every test that runs a
      # claimed driver's control PASSED above, on this engine, as test/cell-reporter.mjs recorded it. A skip, a failure or
      # a test that never ran means the tool x mode cell ran nowhere, and this step names it (observability plan Task 1).
      - name: Cells — every tool x mode cell this job claims, it ran
        if: ${{ !cancelled() }}
        run: |
          node -e "require('fs').mkdirSync(process.env.RUNNER_TEMP + '/gates', { recursive: true })"
          CLODE_CELL_JOB=native-builder-oracle CLODE_CELL_RAN="$RUNNER_TEMP/cells" node --require ./test/file-watchdog-preload.cjs --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./test/cell-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/gates/cells-check.jsonl" \
            --test-name-pattern=cells-ran-in-ci-job test/build-gates/tool-coverage-gates.test.cjs

      # THIS JOB'S GATE LIST (observability plan Task 5): every record test/cell-reporter.mjs wrote above, for ci.yml's
      # gates-ran-in-ci job to hold against test/ci-gates.cjs. Uploaded whatever happened above: a red job's list still
      # says which gates ran, and a job that uploads none is itself a finding there.
      # ONE upload path: in a container job (node-shim-oracle) the runner rewrites only the FIRST line of a multi-line
      # `path` to the container's mount, so a second directory was silently left out (CI run 44597568635 lost its
      # gates/). Both directories are copied under one first.
      - name: Stage this job's gate list in one directory
        if: ${{ !cancelled() }}
        run: node -e "const fs=require('fs'),p=require('path'),t=process.env.RUNNER_TEMP;for(const d of ['cells','gates'])if(fs.existsSync(p.join(t,d)))fs.cpSync(p.join(t,d),p.join(t,'gates-ran',d),{recursive:true})"
      - name: Upload this job's gate list (judged by gates-ran-in-ci)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gates-ran-native-builder-oracle
          path: ${{ runner.temp }}/gates-ran
          if-no-files-found: warn
          overwrite: true   # a re-run attempt replaces its own list (artifacts are run-scoped and immutable)

      # REQUIRED-GATE MARKER (BACKLOG item 4 / phase 5 task 10). This job "sat as one red
      # among twenty-two" — it BUILDS THE PRODUCT (node-free, real provider) and is the
      # closest thing we have to a gate on the thing users actually get; it would have
      # caught the zstd carve break on day one. Measured 2026-09-04, before writing this:
      # `gh api repos/schmonz/clode/branches/main/protection` -> 404 "Branch not
      # protected" — this repo has NO branch-protection required-status-checks at all, for
      # ANY job, so "required" in GitHub's own sense is a repo-settings action (or a
      # mutating `gh api`/ruleset call) outside this file's reach; a human with admin on
      # the repo has to flip that switch separately. What THIS file can do is make a red
      # here unmistakable the moment it happens.
      #
      # FIX ROUND 1 (review finding 1): a bare `if: failure()` cannot tell "the product is
      # broken" from "an npm registry timeout / a transient nodejs.org outage stopped us
      # from checking" — exactly the ambiguity this phase's doctrine forbids everywhere
      # else. So the loud "SHIPPED ARTIFACT BROKEN" claim is now conditioned on the
      # OUTCOME of the two steps that actually build/diff the product (`id: build` above,
      # "the native builder BUILDS THE PRODUCT"; `id: oracle`, "full-binary oracle — real
      # naude vs real quaude"). Any OTHER failure in this job (checkout, artifact
      # download, npm ci, the provider install, the cache action, or the shim-boundary
      # step after these two) gets the quieter, honest "could not verify" message instead
      # — it does not assert the product is broken, only that this job could not prove it
      # isn't.
      - name: if THE PRODUCT build/oracle failed, say so plainly (the shipped artifact is broken)
        # failure() is load-bearing: an `if:` naming no status function is ANDed with an
        # implicit success(), so the bare outcome test this had could never be true when it
        # mattered — the banner was skipped exactly when build or oracle failed. And it needs
        # the setup to have SUCCEEDED: an oracle run on a missing engine or provider fails too,
        # and that is "could not verify" (the step below), never "the artifact is broken".
        if: ${{ failure() && steps.engine.outcome == 'success' && steps.deps.outcome == 'success' && steps.provider.outcome == 'success' && steps.engineexec.outcome == 'success' && (steps.build.outcome == 'failure' || steps.oracle.outcome == 'failure') }}
        run: |
          MSG='native-builder-oracle failed at the build or the full-binary oracle step: this job builds THE PRODUCT node-free with a real provider (clode-native builds a quaude+naude and diffs the two packaged targets). A red HERE means the ARTIFACT USERS GET is broken -- the same class of break as the 2.1.251-era zstd carve regression this job exists to catch on day one -- not an ordinary test failure to triage whenever there is time.'
          echo "::error title=SHIPPED ARTIFACT BROKEN::$MSG"
          { echo '### :rotating_light: SHIPPED ARTIFACT BROKEN'; echo "$MSG"; } >> "$GITHUB_STEP_SUMMARY"
      - name: if something ELSE in this job failed, say THAT plainly (no claim about the artifact)
        # Exactly the complement of the banner above, within failure().
        if: ${{ failure() && !(steps.engine.outcome == 'success' && steps.deps.outcome == 'success' && steps.provider.outcome == 'success' && steps.engineexec.outcome == 'success' && (steps.build.outcome == 'failure' || steps.oracle.outcome == 'failure')) }}
        run: |
          MSG='native-builder-oracle failed, but NOT at the build or the full-binary oracle step (checkout, an artifact download, a provider/dep install, the cache action, the shim-boundary step, or the cells check) -- so this job could not verify the shipped artifact this run, which is a DIFFERENT condition from proving it broken. Could be a real regression in this job'"'"'s own plumbing, or infrastructure flake (a registry timeout, a transient fetch failure). Look at which step actually failed above before assuming either.'
          echo "::warning title=native-builder-oracle: could not verify the shipped artifact::$MSG"
          { echo '### :warning: native-builder-oracle: could not verify the shipped artifact'; echo "$MSG"; } >> "$GITHUB_STEP_SUMMARY"

  # Linux PTY / live-render coverage — the FIRST CI run of these files on any
  # POSIX platform. test/live-render-helper.cjs's CLODE_LIVE_RENDER gate used to
  # bundle two justifications of different scope ("touches the Keychain, may
  # touch the network"); Keychain is darwin-only, so 803756f made the gate
  # platform-aware — every non-darwin platform now runs these tests BY DEFAULT.
  # Nothing changed that in CI until this job: the Linux `test` job above (npm
  # test, suite.yml) has no tjs, so every one of these files skipped there
  # ("no tjs binary") regardless of the gate. BACKLOG's "last 5 skips" entry
  # (2026-09-02, corrected 2026-09-03) counted 13 CLODE_LIVE_RENDER-gated tests
  # + the 3 CLODE_QUAUDE-gated update-notify tests as the addressable ~16.
  #
  # Measured before writing this job (not assumed): a Linux container (see
  # .superpowers/sdd/2026-09-02-phase2-name-the-steps/linux-pty-ci-report.md)
  # built a real blobulated quaude from the pinned provider and ran these exact
  # files/commands — quaude-build 10/10, e2e-tui-tjs 1/1, e2e-ctrlz-tui 1/1,
  # interactive-render-diff 2/2, interactive-resize-diff 2/2, update-notify.pty
  # 3/3 (11 CLODE_LIVE_RENDER tests + 3 update-notify = 14 running here).
  #
  # NOT included, out of the 13 — two fail the "must be able to fail
  # MEANINGFULLY" bar for a reason specific to THIS environment, not the
  # platform gate, both discovered by actually running them here:
  #   e2e-doctor-parity.test.cjs (2)    needs a LOGGED-IN provider profile for
  #                                      /doctor to open its full-screen report
  #                                      — without one it hard-FAILS (no
  #                                      precondition-skip guard the way
  #                                      stale-frames.pty has one): "both
  #                                      /doctor renders were captured" and the
  #                                      parity assertion both threw here. That
  #                                      would make this job permanently red
  #                                      for an environmental gap, not a
  #                                      regression — a gate that CANNOT pass
  #                                      is not a signal. Needs a seeded
  #                                      logged-in fixture before it can join.
  #   fidelity/stale-frames.pty.test.cjs (2)  same missing-login precondition,
  #                                      but this file guards it correctly
  #                                      (t.skip, not a thrown assertion) —
  #                                      verified 2/2 skip cleanly here. Left
  #                                      out anyway: with no logged-in fixture
  #                                      it would skip on every run forever,
  #                                      asserting nothing for its share of
  #                                      the job's runtime.
  # (interactive-live-turn.test.cjs's 2 are also CLODE_LIVE_RENDER-gated but
  # counted separately by BACKLOG — CLODE_LIVE_ONLINE, real API calls/tokens,
  # a different axis entirely, out of scope here on its own merits.)
  #
  # update-notify.pty builds its own quaude now (built-binary.cjs's
  # builtQuaude(), like the other files here); CLODE_QUAUDE is an OPTIMIZATION
  # that skips that build when a prebuilt binary is already on hand. The
  # dedicated `clode build` step below is therefore a cost saver, not a
  # precondition — 30s measured in the (warm) verification container, likely
  # more on a cold CI runner — BACKLOG's own estimate for a `clode build` is
  # ~7 minutes. Included because it is the only PTY coverage of the
  # auto-update NOTIFY surface (see the file's own header), and the cost is
  # paid once and shared by its 3 tests.
  linux-x64-pty:
    needs: [changes, tjs]
    # Run once `tjs` FINISHES, whatever its conclusion — do NOT skip because some
    # OTHER leg failed. This job consumes ONE named artifact; a leg it does not use
    # has no bearing on whether it can run. Plain `needs: tjs` skips the moment any
    # HARD leg fails, which silently deletes this signal: when haiku-x64 was promoted
    # to gating (2026-07-17), a single real haiku regression skipped this job and the
    # three windows jobs in one stroke — a broken gate masking working gates, the
    # exact disease that let the dep-closure P0 through (node-shim-oracle skipped at
    # 9e968b4 for the same reason). If the artifact this job needs is genuinely
    # missing, download-artifact fails it LOUDLY, which is the honest answer.
    #
    # ALSO gated on `changes`: this job downloads a `tjs` artifact, so it must
    # skip in lockstep with `tjs` on a docs-only push (task-7) rather than
    # run and fail loudly on a missing artifact. `!= 'false'` not `== 'true'`
    # — see `tjs`'s own comment (fix round 1, Finding 1: a dead `changes` job
    # must not silently skip this too).
    if: needs.changes.outputs.code != 'false' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions
      # linux-x64-musl is a STATIC musl build (same artifact node-shim-oracle and
      # native-builder-oracle already consume on this same runner OS) — it runs
      # fine on this glibc runner, confirmed the same way those jobs rely on it.
      - uses: actions/download-artifact@v8.0.2
        with:
          name: tjs-linux-x64-musl   # bare static engine from the CI-tier leg
          path: ${{ runner.temp }}/tjs
      - name: mark the engine executable
        run: chmod +x "${{ runner.temp }}/tjs/tjs"
      - name: Install the Claude provider (npm, pinned — also puts `claude` on PATH for the differentials below)
        run: |
          V=$(sed -n 's/^claude-code //p' UPSTREAM_PIN)
          echo "provider pin: @anthropic-ai/claude-code@$V (deliberately behind upstream — see UPSTREAM_PIN)"
          npm i -g @anthropic-ai/claude-code@"$V" 2>&1 | tail -3
      # THE TEXT ORACLE (CellSegmenter phase 3). libexec/unicode-text.cjs clusters, sizes and
      # slices text exactly as ONE native Bun does, and its generated header names that
      # native; every text gate SKIPS against any other version (ruling R11), so without
      # this step they skipped here forever. It judges, it is never built from, so it is
      # independent of UPSTREAM_PIN and read from the header, the one place that says which
      # native the tables came from. The two name the same version (2.1.330, both moved on
      # 2026-11-21) only because each was measured there; neither follows the other. A header
      # that names no version refuses (exit 2) rather than install `@undefined`.
      - name: Install the TEXT ORACLE native (the Claude version the unicode table was generated from)
        id: oracle
        run: |
          set -euo pipefail
          OV=$(node scripts/oracle-native-version.cjs)
          echo "text oracle: @anthropic-ai/claude-code-linux-x64@$OV (independent of UPSTREAM_PIN: it judges, it is never built from)"
          npm i --prefix "$RUNNER_TEMP/oracle" @anthropic-ai/claude-code-linux-x64@"$OV" 2>&1 | tail -2
          ORACLE="$RUNNER_TEMP/oracle/node_modules/@anthropic-ai/claude-code-linux-x64/claude"
          test -x "$ORACLE" || { echo "ERROR: no native claude at $ORACLE after installing $OV" >&2; exit 1; }
          echo "CLODE_NATIVE_ORACLE=$ORACLE" >> "$GITHUB_ENV"
      # Every pin in scripts/unicode-inputs.json, not only the header's two versions (its
      # `unicode` and `cell.unicode`): the freshness gate REGENERATES the table, and the
      # generator's version choice reads every pinned version's EastAsianWidth + emoji-data;
      # cell-profile-diff reads GraphemeBreakTest at the cell version. The text steps below
      # run OFFLINE from this cache, so a cache that lacks anything they read shows up as a
      # skip, which gates-ran-in-ci turns red by name (FILES accepts none). A fetch that fails here (network,
      # or bytes that no longer hash to their pin) FAILS THIS STEP by name (ruling R17).
      - name: Warm the pinned UCD cache (online, once — the text gates run offline from it)
        id: ucd
        run: |
          node -e '
            const path = require("node:path");
            const ucd = require("./scripts/lib/ucd.cjs");
            const { clodeCacheDir } = require("./libexec/clode-paths.cjs");
            const cacheDir = path.join(clodeCacheDir(process.env), "unicode");
            (async () => {
              for (const [ver, files] of Object.entries(ucd.pins())) {
                for (const name of Object.keys(files)) {
                  await ucd.fetchVerified(ver, name, { cacheDir });
                  console.log("verified " + ver + "/" + name);
                }
              }
            })().catch((e) => { console.error("UCD warm-up FAILED: " + e.message); process.exit(1); });
          '
      - name: Install the runtime dep closure (the blobulate's ext-dep closure)
        id: deps
        run: npm ci --prefix deps/claude
      - name: Install the PTY harness (node-pty + @xterm/headless)
        id: harness
        run: npm install --prefix test
      - name: Preflight — node-pty can open a PTY on this kernel
        run: node test/harness-preflight.cjs
      # From here every gate runs whatever an earlier one concluded, needing only the setup it
      # uses (test/ci-step-chaining.test.cjs): a red TUI step must not hide the notify surface.
      - name: quaude-build + e2e-tui-tjs + e2e-ctrlz-tui + interactive-render/frame/resize-diff
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.harness.outcome == 'success' }}
        # Named explicitly rather than a glob, so a future reader can tell what
        # is covered without running it. Each of these files builds its OWN
        # throwaway quaude internally — no shared state between them, hence no
        # single combined `clode build` step above for this group.
        env:
          CLODE_TJS: ${{ runner.temp }}/tjs/tjs
        run: |
          set -euo pipefail
          PROV="$(node scripts/stage-provider.mjs)" || exit 1
          echo "provider: $PROV"
          mkdir -p "$RUNNER_TEMP/cells"
          CLODE_PROVIDER_BIN="$PROV" CLODE_CLAUDE_BIN="$PROV" \
            node --require ./test/file-watchdog-preload.cjs --test --test-concurrency=1 \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=./test/cell-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/cells/pty-build.jsonl" \
              test/quaude-build.test.cjs \
              test/e2e-tui-tjs.test.cjs \
              test/e2e-ctrlz-tui.test.cjs \
              test/fidelity/interactive-render-diff.test.cjs \
              test/fidelity/interactive-frame-diff.test.cjs \
              test/fidelity/interactive-resize-diff.test.cjs
      # update-notify.pty is gated on a PREBUILT quaude (CLODE_QUAUDE), not on
      # tjs/provider directly — build one explicitly (cost: see this job's
      # header comment). Paid once, shared by the 3 tests below.
      - name: Build a quaude for update-notify.pty (CLODE_QUAUDE)
        id: notifyquaude
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          CLODE_TJS: ${{ runner.temp }}/tjs/tjs
        run: |
          set -euo pipefail
          PROV="$(node scripts/stage-provider.mjs)" || exit 1
          # `clode build --out` does not mkdir -p its own parent — a bare path
          # under a fresh runner.temp dies ENOENT after the blobulate already ran.
          mkdir -p "${{ runner.temp }}/quaude-notify"
          CLODE_CLAUDE_BIN="$PROV" scripts/stage0.mjs build --out "${{ runner.temp }}/quaude-notify/quaude"
      - name: fidelity/update-notify.pty — the auto-update NOTIFY surface
        if: ${{ !cancelled() && steps.notifyquaude.outcome == 'success' && steps.harness.outcome == 'success' }}
        env:
          CLODE_QUAUDE: ${{ runner.temp }}/quaude-notify/quaude
        run: |
          mkdir -p "$RUNNER_TEMP/cells"
          node --require ./test/file-watchdog-preload.cjs --test --test-concurrency=1 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./test/cell-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/cells/pty-notify.jsonl" \
            test/fidelity/update-notify.pty.test.cjs
      # THE SESSION GATES (CellSegmenter phase 5): four scripted multi-frame sessions
      # (test/fidelity/sessions.cjs: type-edit, resize, scroll, slash-menu), a frame per step
      # taken once output settles, compared cell for cell. Three `node --test` runs, one file
      # each, in THIS order -- node --test sorts the files it is given, so one run would take
      # session-determinism last:
      #   1. session-determinism       native repaints every session identically twice. The
      #                                precondition, so it runs first and alone: a racy script
      #                                fails HERE, as a racy script, and set -e stops the step
      #                                before any quaude is judged against a native that cannot
      #                                repeat itself.
      #   2. interactive-session-diff  native vs the quaude this tree builds (builtQuaude, as
      #                                interactive-frame-diff gets one), a guard per session. Its
      #                                build warms built-binary.cjs's STABLE_CACHE with this
      #                                step's provider carve, which 3 copies instead of extracting.
      #   3. reset-invisibility        a quaude whose CellSegmenter pool resets fire before every
      #                                segment() call vs the unpatched one, and the check that the
      #                                patch landed.
      # THE PIN'S BUNDLE PAINTS WITH CellSegmenter (since 2.1.283; the pin is 2.1.330), so all three RUN
      # and this step accepts NO skip: a session gate that skipped (a missing harness, native,
      # engine or quaude; the full-suite marker CLODE_TEST_FULL_SUITE, which only test/run.mjs
      # sets; or the reset guards' no-consumer reason, scripts/lib/reset-patch.cjs's NO_CONSUMER,
      # which on this bundle would mean the carve lost its consumer) judged nothing. Until the
      # pin moved (2.1.251, no consumer), 1 and 2 judged only the classic painter and the step
      # accepted the reset guards' two named skips; it no longer does. The paint()/setCell()
      # damage these screens cannot see (upstream damages every region it repaints) is the paint
      # gate's, in the text step below.
      # Own step, `!cancelled()`: a red frame or notify step above must not mask these, or the
      # reverse.
      - name: Session gates — native repaints each session identically, then native vs quaude, then pool-reset invisibility
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.harness.outcome == 'success' }}
        env:
          CLODE_TJS: ${{ runner.temp }}/tjs/tjs
        run: |
          set -euo pipefail
          PROV="$(node scripts/stage-provider.mjs)" || exit 1
          echo "provider: $PROV"
          export CLODE_PROVIDER_BIN="$PROV" CLODE_CLAUDE_BIN="$PROV"
          : > session-gates.out
          mkdir -p "$RUNNER_TEMP/cells"
          for f in test/fidelity/session-determinism.test.cjs \
                   test/fidelity/interactive-session-diff.test.cjs \
                   test/fidelity/reset-invisibility.test.cjs; do
            node --require ./test/file-watchdog-preload.cjs --test --test-concurrency=1 \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=./test/cell-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/cells/pty-session-$(basename "$f" .test.cjs).jsonl" \
              "$f" 2>&1 | tee -a session-gates.out
          done
          # Skips are judged BY NAME, not counted: gates-ran-in-ci holds this job to every file it runs (test/ci-gates.cjs
          # FILES, a skip accepted only by its test name; ci-gate-placement refuses a file a job runs that FILES does not judge).
      # THE TEXT GATES against the oracle installed above: Bun.ant.CellSegmenter,
      # Bun.stringWidth, Intl.Segmenter, Bun.sliceAnsi and Bun.wrapAnsi, ours under the tjs
      # engine quaude ships vs native Bun, exact equality over ~1.18M strings (wrapAnsi at
      # BASIC_WRAPS on each, plus corpusWraps() at FULL_WRAPS: scripts/lib/text-probe.cjs); the freshness gate (the
      # generated table is what the generator makes from the pinned UCD + that native); the
      # UAX #29 conformance test; the check that the segmenter gate's painted-style column
      # still restates the bundle's own ansiCodes()/SC; the check that every one of the carve's
      # Bun.wrapAnsi call sites (its floor in text-probe-gates) passes an option shape the wrap gates judge
      # (text-probe-wrap-options); and the carve-time tripwire that no
      # Bun.sliceAnsi call in the oracle's bundle passes an ellipsis (CLODE_PROVIDER_BIN is the
      # oracle here, so the bundle literals, the style check and the tripwire read the bundle
      # the tables were generated from). And CellSegmenter's paint()/setCell() (phase 5): the
      # screen cells and the packed return (end column, damage x1..x2) of every op in
      # scripts/lib/paint-corpus.cjs, ours under tjs vs the oracle's own, exactly -- the one
      # gate that judges damage, which no screen session can see. It drives the shim directly,
      # so it judges CellSegmenter whatever bundle UPSTREAM_PIN names. With it, the two phase-5
      # carve checks, which SKIP on a bundle with no CellSegmenter caller (any before 2.1.278):
      # the paint probe's word and damage packing restated against the carve
      # (paint-probe-gates), and the pool-reset sites the session step's reset-invisibility
      # patches, found exactly once (reset-patch-gates). Here they read the ORACLE's carve; the
      # suite legs (suite.yml), whose CLODE_PROVIDER_BIN is the pin, read the pin's.
      # They run whenever their own preconditions succeeded, not only when every PTY step
      # above did: a broken PTY gate must not mask working text gates, or the reverse.
      # A skip is red by name in gates-ran-in-ci (FILES), because every one of these SKIPS without its oracle or its
      # cache, and a green run whose gates skipped is the lie this job keeps catching.
      - name: Text and paint gates — ours vs the TEXT ORACLE native, per consumer (offline, from the warm cache)
        if: ${{ !cancelled() && steps.oracle.outcome == 'success' && steps.ucd.outcome == 'success' && steps.deps.outcome == 'success' }}
        env:
          CLODE_TJS: ${{ runner.temp }}/tjs/tjs
          CLODE_OFFLINE: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cells"
          CLODE_PROVIDER_BIN="$CLODE_NATIVE_ORACLE" \
            node --require ./test/file-watchdog-preload.cjs --test --test-concurrency=1 \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=./test/cell-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/cells/pty-text.jsonl" \
              test/native-oracle.test.cjs \
              test/unicode-data-fresh.test.cjs \
              test/unicode-text.test.cjs \
              test/fidelity/text-differential.test.cjs \
              test/fidelity/paint-differential.test.cjs \
              test/build-gates/text-probe-gates.test.cjs \
              test/build-gates/paint-probe-gates.test.cjs \
              test/build-gates/reset-patch-gates.test.cjs \
              test/bun-slice-ansi-arity.test.cjs 2>&1 | tee text-gates.out
          # Skips are judged BY NAME, not counted: gates-ran-in-ci holds this job to every file it runs (test/ci-gates.cjs
          # FILES, a skip accepted only by its test name; ci-gate-placement refuses a file a job runs that FILES does not judge).
      # The detector the freshness gate cannot be (ruling R24): CELL_UNICODE is a measured
      # constant, so a Bun clusterer bump moves nothing the generator reads. This re-measures
      # bun-cell and uax29 against the oracle's own two clusterers (GraphemeBreakTest at both
      # versions, emoji-test, probes and the 25.6M-string sweep; ~30 s). It REFUSES (exit 2)
      # a native of another version than the header names, so it cannot pass by judging
      # against the wrong one.
      - name: cell-profile-diff — both clusterer profiles vs the oracle's own (offline)
        if: ${{ !cancelled() && steps.oracle.outcome == 'success' && steps.ucd.outcome == 'success' }}
        env:
          CLODE_OFFLINE: '1'
        run: node scripts/cell-profile-diff.cjs --native "$CLODE_NATIVE_ORACLE"
      # THE rg GATES (grep-native plan, Task 11). quaude answers rg itself (libexec/rg-native.cjs), and searches
      # with the HOST's ugrep: ugrep proposes candidate lines, quaude's own Rust-regex port decides. ugrep is
      # never vendored and never shipped; rg-native refuses one older than UGREP_MIN (5.0.0, measured: 3.11.2
      # exits 0 on a failed read). ubuntu-latest's apt ugrep is 5.0.0, exactly the floor, so this leg also
      # judges the oldest ugrep quaude supports; the step fails here, by name, if apt ever hands it less.
      # zsh too: the gate's Bash-route column judges every shell it finds (bash required, zsh optional), and the
      # Bash tool runs a user's zsh as readily as bash.
      - name: Install ugrep (>= rg-native's UGREP_MIN) and zsh for the rg gates
        id: ugrep
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ugrep zsh
          node -e '
            const { UGREP_MIN } = require("./libexec/rg-native.cjs");
            const out = require("node:child_process").execFileSync("ugrep", ["--version"], { encoding: "utf8" });
            const have = (/^ugrep (\d+\.\d+\.\d+)/.exec(out) || [])[1];
            const n = (v) => v.split(".").map(Number);
            const ok = have && n(have).reduce((c, x, i) => c || (x > n(UGREP_MIN)[i] ? 1 : x < n(UGREP_MIN)[i] ? -1 : 0), 0) >= 0;
            console.log(`ugrep ${have} (quaude needs >= ${UGREP_MIN})`);
            if (!ok) { console.error(`ERROR: ugrep ${have} is older than UGREP_MIN ${UGREP_MIN}: quaude refuses to search with it`); process.exit(1); }
          '
      # quaude's rg judged BYTE FOR BYTE against native's EMBEDDED rg (the pinned provider run as rg):
      #   rg-differential     every argv upstream's Grep and Glob tools build, over the fixture trees, through the
      #                       interception the bundle hits; then the same cells and BASH_ROWS through the Bash
      #                       tool's route (native's snapshot vs quaude's, a quaude AND a naude built from this
      #                       tree), and the tripwire rows (a host rg first on PATH).
      #   agentic-grep-glob   the real Grep, Glob and Bash tools in a built quaude, one -p turn of 27 calls against
      #                       a canned mock, every tool_result equal to native's recorded answer, on a PATH with no
      #                       rg and one with a tripwire rg. CLODE_E2E_NATIVE=1 runs its instrument too: native's
      #                       own turn here must still give those recorded answers, so a Linux native that moved
      #                       is named, not hidden.
      #   tools-local         Read, Write and NotebookEdit (one -p turn of 9 calls, every-tool Task 2), the Task*
      #                       tools and TaskStop (14 calls, Task 3), Skill, the worktree and cron tools and
      #                       ScheduleWakeup (12 calls, Task 4), and ReportFindings, Workflow and ListAgents (7 calls,
      #                       Task 5) in a built quaude, every tool_result (and the tree
      #                       left) equal to native's recorded answer; its native tests run this native against the
      #                       same answers. This is the one job with both a built quaude
      #                       and a native that RUNS, so it drives those tools' print cell on linux-x64-musl.
      #   webfetch            WebFetch's print cell: one -p turn to a local TLS 1.2, rsa_pss_rsae_sha256 target (the
      #                       shape that made WebFetch answer "Network Error" on a NetBSD release candidate), in a built
      #                       quaude and in native, each answered by the mock with the fetched page's own token.
      #   tjs-tls-trust       the engine's TLS trust (security review 2026-11-20): a forged TLS 1.2 PSS handshake refused,
      #                       the CA globals gone from a built quaude and an unparseable NODE_EXTRA_CA_CERTS block dropped.
      #   rg-regex-gates, rg-types-gates   the generated rg tables are what their generators make from THIS native
      #                       run as rg (the suite's minimised provider does not run as rg, so they skipped there).
      #   rg-spawn            needs the engine AND a POSIX shell for a ugrep stub as a non-root user; it skipped in
      #                       the suite rows and ran in no job (observability Task 5; lead-scrub-equivalence, which
      #                       ran here beside it, was retired 2026-11-21 with its hook). Measured before adding all four, on ubuntu:24.04 as a non-root user with this native,
      #                       ugrep 5.0.0 and the musl engine: 43 tests, 43 pass, 0 skipped. That count is history: the step
      #                       has since grown (tools-local, webfetch), and what holds it now is the by-name skip rule below.
      # postject into deps/clode because the gate builds a naude (test/built-binary.cjs builtNaude), which also
      # fetches the pinned Node. The gate's named normalizations (compareRg: walk order, --json elapsed times, and
      # on THIS x86_64 runner the CPU-read simd(runtime) line of `rg --version`) are the only differences forgiven.
      # ONE skip is accepted, by name: rg-differential's "macOS only" row (macOS native printing its own record of
      # the RG-MMAP-EVERYWHERE divergence), which cannot run on Linux. Any other skip — a missing native, engine,
      # ugrep, bash, quaude or naude — means the gates judged nothing, and fails the step.
      - name: rg gates — quaude's rg vs native's embedded rg (rg-differential), Grep/Glob/Bash rg and the local tools end to end
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.ugrep.outcome == 'success' }}
        env:
          CLODE_TJS: ${{ runner.temp }}/tjs/tjs
          CLODE_E2E_NATIVE: '1'
        run: |
          set -euo pipefail
          npm ci --prefix deps/clode 2>&1 | tail -3
          # The oracle must RUN (as rg, and as Claude Code for the end-to-end turn), so it is the pinned native
          # binary itself, never stage-provider's minimised carve, which only clode reads: UPSTREAM_PIN's
          # platform package, installed on its own as the text oracle above is (its purpose is to be RUN and
          # judged against; the gates also build their quaude and naude from it, as a dev box builds from the
          # provider it has). A header that names no version refuses rather than install `@`.
          V=$(sed -n 's/^claude-code //p' UPSTREAM_PIN)
          [ -n "$V" ] || { echo "ERROR: UPSTREAM_PIN names no claude-code version" >&2; exit 2; }
          npm i --prefix "$RUNNER_TEMP/rg-oracle" @anthropic-ai/claude-code-linux-x64@"$V" 2>&1 | tail -2
          NATIVE="$RUNNER_TEMP/rg-oracle/node_modules/@anthropic-ai/claude-code-linux-x64/claude"
          test -x "$NATIVE" || { echo "ERROR: no native claude at $NATIVE after installing $V" >&2; exit 1; }
          echo "native: $NATIVE ($V)"
          mkdir -p "$RUNNER_TEMP/cells"
          CLODE_PROVIDER_BIN="$NATIVE" CLODE_CLAUDE_BIN="$NATIVE" \
            node --require ./test/file-watchdog-preload.cjs --test --test-concurrency=1 \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=./test/cell-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/cells/pty-rg.jsonl" \
              test/fidelity/rg-differential.test.cjs \
              test/fidelity/agentic-grep-glob.test.cjs \
              test/fidelity/tools-local.test.cjs \
              test/fidelity/webfetch.test.cjs \
              test/tjs-tls-trust.test.cjs \
              test/build-gates/rg-regex-gates.test.cjs \
              test/build-gates/rg-types-gates.test.cjs \
              test/rg-spawn.test.cjs 2>&1 | tee rg-gates.out
          SKIPPED=$(sed -nE 's/^(ℹ|#) skipped ([0-9]+)$/\2/p' rg-gates.out | tail -1)
          NAMED=$(grep -cE '# macOS only$' rg-gates.out || true)
          echo "skipped: ${SKIPPED:-?}; accepted by name (macOS only): $NAMED"
          [ "${SKIPPED:-x}" = 1 ] && [ "$NAMED" = 1 ] \
            || { echo "ERROR: an rg gate SKIPPED beyond the one macOS-only row (see its reason above) — it judged nothing, so this is not a pass" >&2; grep -E 'skipped|# SKIP|﹣' rg-gates.out >&2; exit 1; }
      # SANDBOXED BASH FAILS CLOSED (8b088ef): until then an enabled sandbox let every Bash call after the first run
      # UNSANDBOXED under quaude, and no job ran Bash with the sandbox on. This is the Bash x sandbox:on cell
      # (test/build-gates/tool-coverage-gates.test.cjs) on this engine: a built quaude, one turn per settings source.
      # The runner gets bubblewrap and socat, so native WOULD sandbox here and the fail-closed test (which holds the
      # cell's controls) runs; without them it skips, and the cells step below fails by name. The D2 test (where
      # native would not sandbox, quaude warns and runs as native does, USER ruling D2) is the ONE skip accepted here.
      # quaude's refusal is its own (node-shim has no net.createServer), so for quaude bwrap need not work, only be present.
      # NATIVE's sandbox must work, though: the native first-call test runs its Bash inside bwrap + apply-seccomp, which
      # needs a (nested) unprivileged user namespace, and this Ubuntu 24.04 runner refuses one by default
      # (kernel.apparmor_restrict_unprivileged_userns = 1: "apply-seccomp: write /proc/self/setgroups (nested userns is
      # capability-restricted ...): Permission denied", CI 45017307973). A user's machine that runs native's sandbox allows
      # it, so the runner is made to, in two parts, each measured:
      #   - the sysctl: on a stock Ubuntu 24.04.5 VM with bubblewrap, at 1 bwrap and a nested `unshare -Ur` both fail, at 0
      #     both run (unprivileged_userns_clone is already 1);
      #   - the runner ALSO confines bwrap with Ubuntu's bwrap-userns-restrict AppArmor profile (bwrap gets a userns, its
      #     children are stacked with unpriv_bwrap, which denies every capability), so at 0 the nested namespace still
      #     failed there: "unshare: write failed /proc/self/uid_map: Operation not permitted" (CI 45052931964). That
      #     profile loaded on the VM reproduces it exactly, and unloading every AppArmor profile for bwrap clears it. A
      #     24.04 user who installed bubblewrap without that profile, or any Debian or Fedora user, has this configuration.
      # Verified before the tests, and the native first-call test may not skip here (gates-ran-in-ci; and the check below).
      - name: sandboxed Bash fails closed — agentic-sandbox-fail-closed against a built quaude
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          CLODE_TJS: ${{ runner.temp }}/tjs/tjs
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends bubblewrap socat
          command -v bwrap && command -v socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo 'AppArmor profiles for bwrap before:'; sudo grep -E '(^|[^a-z_])(unpriv_)?bwrap' /sys/kernel/security/apparmor/profiles || echo '  (none)'
          for f in $(sudo grep -lE '^[[:space:]]*profile[[:space:]]+(unpriv_)?bwrap([[:space:]]|$)' /etc/apparmor.d/* 2>/dev/null || true); do
            echo "unloading $f"; sudo apparmor_parser -R "$f"
          done
          for p in $(sudo sed -nE 's/^((unpriv_)?bwrap) \(.*\)$/\1/p' /sys/kernel/security/apparmor/profiles); do
            echo "removing loaded profile $p"; printf '%s' "$p" | sudo tee /sys/kernel/security/apparmor/.remove >/dev/null
          done
          echo 'AppArmor profiles for bwrap after:'; sudo grep -E '(^|[^a-z_])(unpriv_)?bwrap' /sys/kernel/security/apparmor/profiles || echo '  (none)'
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-user --unshare-pid -- unshare --user --map-root-user true \
            || { echo "ERROR: native's sandbox still cannot make a nested user namespace on this runner (see above)" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/cells"
          PROV="$(node scripts/stage-provider.mjs)" || exit 1
          CLODE_PROVIDER_BIN="$PROV" CLODE_CLAUDE_BIN="$PROV" \
            node --require ./test/file-watchdog-preload.cjs --test --test-concurrency=1 \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=./test/cell-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/cells/pty-sandbox.jsonl" \
              test/fidelity/agentic-sandbox-fail-closed.test.cjs 2>&1 | tee sandbox.out
          if grep -E '^﹣ native, started on the startup rows' sandbox.out; then
            echo 'ERROR: the native first-call test SKIPPED on a runner made able to sandbox (its reason above): it judged nothing' >&2; exit 1
          fi
          # Skips are judged BY NAME, not counted: gates-ran-in-ci holds this job to every file it runs (test/ci-gates.cjs
          # FILES, a skip accepted only by its test name; ci-gate-placement refuses a file a job runs that FILES does not judge).
      # THE CELLS this job drives (test/build-gates/tool-coverage-gates.test.cjs, CELL_JOBS): every test that runs a
      # claimed driver's control PASSED above, on this engine, as test/cell-reporter.mjs recorded it. A skip, a failure or
      # a test that never ran means the tool x mode cell ran nowhere, and this step names it (observability plan Task 1).
      - name: Cells — every tool x mode cell this job claims, it ran
        if: ${{ !cancelled() }}
        run: |
          node -e "require('fs').mkdirSync(process.env.RUNNER_TEMP + '/gates', { recursive: true })"
          CLODE_CELL_JOB=linux-x64-pty CLODE_CELL_RAN="$RUNNER_TEMP/cells" node --require ./test/file-watchdog-preload.cjs --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./test/cell-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/gates/cells-check.jsonl" \
            --test-name-pattern=cells-ran-in-ci-job test/build-gates/tool-coverage-gates.test.cjs

      # THIS JOB'S GATE LIST (observability plan Task 5): every record test/cell-reporter.mjs wrote above, for ci.yml's
      # gates-ran-in-ci job to hold against test/ci-gates.cjs. Uploaded whatever happened above: a red job's list still
      # says which gates ran, and a job that uploads none is itself a finding there.
      # ONE upload path: in a container job (node-shim-oracle) the runner rewrites only the FIRST line of a multi-line
      # `path` to the container's mount, so a second directory was silently left out (CI run 44597568635 lost its
      # gates/). Both directories are copied under one first.
      - name: Stage this job's gate list in one directory
        if: ${{ !cancelled() }}
        run: node -e "const fs=require('fs'),p=require('path'),t=process.env.RUNNER_TEMP;for(const d of ['cells','gates'])if(fs.existsSync(p.join(t,d)))fs.cpSync(p.join(t,d),p.join(t,'gates-ran',d),{recursive:true})"
      - name: Upload this job's gate list (judged by gates-ran-in-ci)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gates-ran-linux-x64-pty
          path: ${{ runner.temp }}/gates-ran
          if-no-files-found: warn
          overwrite: true   # a re-run attempt replaces its own list (artifacts are run-scoped and immutable)

  # node-shim oracle on DARWIN — the same node-vs-tjs behavioral diff as
  # node-shim-oracle above, but on macOS against a real darwin tjs.
  # WHY A SEPARATE JOB: the node-shim is darwin-oriented (signal table, dylib
  # suffix, spawn env handling), so a class of divergences appears ONLY on
  # darwin and the linux oracle cannot see it. Concretely: a process.env mutation
  # did not reach a default-env spawned child under tjs — but only on darwin,
  # because on linux tjs mirrors env into the real environ, so node-shim-env
  # passed there and the bug was invisible in CI until a dev box hit it
  # (2026-07-18). No darwin shim run = that whole class hides. This job is the
  # standing guard. It also runs the child-process/core/bunshim tests the linux
  # oracle must EXCLUDE for musl/signal/dylib portability — on darwin they are
  # native behavior and pass. Consumes the darwin-arm64 leg's bare engine.
  node-shim-oracle-darwin:
    needs: [changes, tjs]
    # Run once `tjs` FINISHES, whatever its conclusion (same rationale as the
    # windows/node-shim-oracle jobs): this consumes ONE named artifact; a leg it
    # does not use has no bearing on whether it can run.
    #
    # ALSO gated on `changes`: this job downloads a `tjs` artifact, so it must
    # skip in lockstep with `tjs` on a docs-only push (task-7) rather than
    # run and fail loudly on a missing artifact. `!= 'false'` not `== 'true'`
    # — see `tjs`'s own comment (fix round 1, Finding 1: a dead `changes` job
    # must not silently skip this too).
    if: needs.changes.outputs.code != 'false' && !cancelled()
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions
      - uses: actions/download-artifact@v8.0.2
        with:
          name: tjs-darwin-arm64   # bare arm64 engine from the CI-tier darwin leg
          path: ${{ runner.temp }}/tjs
      - name: Install the runtime dep closure (ws/yaml/semver/string-width/... for the shim)
        run: npm ci --prefix deps/claude
      # The parity/roundtrip oracles stage cli.cjs from a real Bun-packaged
      # provider; with none present they SKIP, the silent-green these jobs exist
      # to prevent. Same provisioning as the linux oracle.
      - name: Install the Claude provider (npm, pinned — the oracle's input)
        run: |
          V=$(sed -n 's/^claude-code //p' UPSTREAM_PIN)
          echo "provider pin: @anthropic-ai/claude-code@$V (deliberately behind upstream — see UPSTREAM_PIN)"
          npm i -g @anthropic-ai/claude-code@"$V" 2>&1 | tail -3
      # Live-network gate (regression guard) — see the linux node-shim-oracle copy.
      # A credential-free HEAD proves the darwin engine can DNS + TLS-connect.
      - name: Live-connect smoke — the engine reaches the internet over TLS
        env:
          CLODE_TJS: ${{ runner.temp }}/tjs/tjs
        run: |
          set -uo pipefail
          chmod +x "$CLODE_TJS"
          # Raw `tjs eval` has no node-shim `process`, so signal via a marker the
          # shell checks (a rejected fetch -> no OK marker -> the gate fails).
          P='fetch("https://example.com/",{method:"HEAD"}).then(function(r){console.log("LIVE-CONNECT-OK "+r.status)}).catch(function(e){console.log("LIVE-CONNECT-FAIL "+String(e))})'
          for i in 1 2 3; do
            out=$("$CLODE_TJS" eval "$P" 2>&1 || true); echo "$out"
            case "$out" in *LIVE-CONNECT-OK*) exit 0 ;; esac
            echo "retry $i…"; sleep 3
          done
          echo "live-connect smoke: the engine could not establish a TLS connection" >&2; exit 1
      - name: node-shim oracle suite (every module diffed vs host node, under a darwin tjs)
        env:
          CLODE_TJS: ${{ runner.temp }}/tjs/tjs
        run: |
          set -euo pipefail
          chmod +x "$CLODE_TJS"
          "$CLODE_TJS" eval 'console.log("darwin-arm64 tjs alive:", tjs.version)'
          # EXCLUDE only node-shim-tty (needs a controlling terminal, covered by
          # windows-amd64-tui + the POSIX e2e). Everything else runs here — including
          # child-process/core/bunshim (which the linux oracle excludes for portability)
          # AND the new node-shim-api-surface-gate (hard-gates upstream Bun.*/require
          # drift against the latest provider this job installs). (Ctrl-Z moved to the
          # opt-in test/e2e-ctrlz-tui.test.cjs; the wiring stays in node-shim-signals.)
          EXCLUDE='node-shim-tty|node-shim-agentic'
          FILES=$(ls test/node-shim-*.test.cjs | grep -vE "$EXCLUDE")
          # The glob carries test/node-shim-differential.test.cjs (observability Task 3): every call the carve
          # makes to a shim module, judged against this job's node. It needs exactly CLODE_TJS and
          # CLODE_PROVIDER_BIN, both set here, and skips without them, so the skip count below names it.
          # node-shim-agentic is out of the glob and named here: it drives this job's Bash and Edit cells
          # (test/build-gates/tool-coverage-gates.test.cjs, CELL_JOBS), and a claimed file is named in a run line.
          FILES="$FILES test/node-shim-agentic.test.cjs"
          PROV="$(node scripts/stage-provider.mjs)" || exit 1
          echo "provider: $PROV"
          export CLODE_PROVIDER_BIN="$PROV"
          # test/credential-store-attempted.test.cjs (C1, final whole-branch review of
          # phase 5, 2026-09-05) is the phase's own P0 guard — "the artifact ATTEMPTS
          # the platform credential store" — and it had run in ZERO CI jobs: it skips
          # unless process.platform === 'darwin' (test/credential-store-attempted.test.cjs
          # itself), and neither `test` (suite.yml, ubuntu+windows only) nor `ci.yml`
          # gave it a darwin runner with both a real `git` on PATH and this job's two
          # inputs (CLODE_TJS above, CLODE_PROVIDER_BIN just set). This job is the one
          # place in CI those three preconditions already hold — macos-latest, a real
          # git, a staged provider — so it needs nothing further, the same placement fix
          # Task 8 made for shim-surface/guard-subcommands-gate.
          FILES="$FILES test/credential-store-attempted.test.cjs"
          mkdir -p "$RUNNER_TEMP/cells"
          node --require ./test/file-watchdog-preload.cjs --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./test/cell-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/cells/node-shim-oracle-darwin.jsonl" \
            $FILES 2>&1 | tee darwin-oracle.out
          # A SKIPPED run of the newly-added file must be distinguishable from a clean
          # one — never a silent pass (same phase-5 doctrine as the linux oracle's own
          # skip-count assertion below it in this file). `2` is this job's PRE-EXISTING,
          # environment-appropriate skip count — MEASURED directly (coordinator,
          # 2026-09-05) against this exact 66-file set, on a real darwin-arm64 box, with
          # CLODE_TJS + CLODE_PROVIDER_BIN pointed at the ACTUAL pinned 2.1.251 provider
          # (`node --test --test-concurrency=1` over all of test/node-shim-*.test.cjs
          # minus node-shim-tty, plus credential-store-attempted.test.cjs): 308 tests,
          # 306 pass, 2 skipped, 0 failed. The two skips are `node-shim-agentic.test.cjs`'s
          # darwin-branch row (this job never sets CLODE_DARWIN_PROVIDER_BIN, a DIFFERENT
          # variable from CLODE_PROVIDER_BIN, on purpose — that row wants this repo's own
          # fetched provider, not the staged one) and `node-shim-roundtrip.test.cjs`'s
          # CLODE_LIVE_ROUNDTRIP opt-in finale. credential-store-attempted itself ran
          # fully (6/6 passed, 0 skipped) against the pinned provider and must not add a
          # third skip here — a skip there means the P0 guard went right back to running
          # nowhere.
          # Skips are judged BY NAME, not counted: gates-ran-in-ci holds this job to every file it runs (test/ci-gates.cjs
          # FILES, a skip accepted only by its test name; ci-gate-placement refuses a file a job runs that FILES does not judge).
      # The interactive cell (every-tool Task 5 fix round 2): tools-local types its turn into a pty, through the same
      # harness linux-x64-pty installs (node-pty + @xterm/headless under test/). agentic-grep-glob's quaude searches
      # with the host's ugrep (libexec/rg-native.cjs, UGREP_MIN), which macos-latest does not ship.
      - name: Install the PTY harness (node-pty + @xterm/headless) and ugrep for the end-to-end turns
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          npm install --prefix test
          node test/harness-preflight.cjs
          brew install ugrep
          ugrep --version | head -1
      # THE LOCAL TOOLS ON DARWIN (every-tool Tasks 2-5: all 18 Phase A tools, Read through ListAgents, and Agent):
      # test/fidelity/tools-local.test.cjs against a quaude built from this tree (judged against native's recorded
      # answers) and against native itself, in print, interactive, unlisted and every permission mode; and
      # test/fidelity/agentic-grep-glob.test.cjs (Grep, Glob and the Bash tool's rg, in print and every permission mode),
      # with CLODE_E2E_NATIVE=1 so its native instrument runs too; and test/fidelity/webfetch.test.cjs (WebFetch, print); and test/tjs-tls-trust.test.cjs (the engine's TLS trust, in a built quaude too). The staged provider above is a minimised carve that cannot run, so this step installs UPSTREAM_PIN's
      # darwin-arm64 platform package on its own, as linux-x64-pty's rg step does for linux: a native that RUNS, which
      # the quaude is also built from. Both tests must pass; no skip is accepted (test/ci-gates.cjs FILES).
      - name: Local tools end to end — tools-local and agentic-grep-glob against a built quaude and native
        if: ${{ !cancelled() }}
        env:
          CLODE_TJS: ${{ runner.temp }}/tjs/tjs
          CLODE_E2E_NATIVE: '1'
        run: |
          set -euo pipefail
          V=$(sed -n 's/^claude-code //p' UPSTREAM_PIN)
          [ -n "$V" ] || { echo "ERROR: UPSTREAM_PIN names no claude-code version" >&2; exit 2; }
          npm i --prefix "$RUNNER_TEMP/native-darwin" @anthropic-ai/claude-code-darwin-arm64@"$V" 2>&1 | tail -2
          NATIVE="$RUNNER_TEMP/native-darwin/node_modules/@anthropic-ai/claude-code-darwin-arm64/claude"
          test -x "$NATIVE" || { echo "ERROR: no native claude at $NATIVE after installing $V" >&2; exit 1; }
          echo "native: $NATIVE ($V)"
          mkdir -p "$RUNNER_TEMP/cells"
          CLODE_PROVIDER_BIN="$NATIVE" CLODE_CLAUDE_BIN="$NATIVE" \
            node --require ./test/file-watchdog-preload.cjs --test --test-concurrency=1 \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=./test/cell-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/cells/darwin-tools-local.jsonl" \
              test/fidelity/tools-local.test.cjs test/fidelity/agentic-grep-glob.test.cjs test/fidelity/webfetch.test.cjs \
              test/tjs-tls-trust.test.cjs
      # THE CELLS this job drives (test/build-gates/tool-coverage-gates.test.cjs, CELL_JOBS): every test that runs a
      # claimed driver's control PASSED above, on this engine, as test/cell-reporter.mjs recorded it. A skip, a failure or
      # a test that never ran means the tool x mode cell ran nowhere, and this step names it (observability plan Task 1).
      - name: Cells — every tool x mode cell this job claims, it ran
        if: ${{ !cancelled() }}
        run: |
          node -e "require('fs').mkdirSync(process.env.RUNNER_TEMP + '/gates', { recursive: true })"
          CLODE_CELL_JOB=node-shim-oracle-darwin CLODE_CELL_RAN="$RUNNER_TEMP/cells" node --require ./test/file-watchdog-preload.cjs --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./test/cell-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/gates/cells-check.jsonl" \
            --test-name-pattern=cells-ran-in-ci-job test/build-gates/tool-coverage-gates.test.cjs

      # ITEM 5 (BACKLOG / phase 5 task 10): "No CI leg builds against more than one
      # platform's graph. That is why a merger corruption that broke linux shipped green
      # on darwin." Measured 2026-09-04, before writing this: this job (the only macOS job
      # in ci.yml) never ran `clode build` at all — the node-shim oracle above diffs
      # SHIM BEHAVIOR against host node, it never stages+merges a provider. So there was
      # no existing build here to add a second one next to; this step IS the first.
      #
      # Bun constant-folds process.platform into a provider binary at CARVE time
      # (libexec/extract-claude-js.cjs's providerPlatformOf, libexec/clode-build.cjs's
      # TARGET-MATCHED ASSEMBLY gate) — so a linux-carved provider is a DIFFERENT module
      # graph than the darwin one every other build in this repo's CI merges, with
      # different dead-coded branches and different cyclic-require shapes for
      # libexec/graph-scc-merge.cjs to fold. The merge itself always runs under the HOST's
      # own tjs (CLODE_TJS), never the target's — see clode-extract.cjs's resolveEngine and
      # clode-build.cjs's own CROSS-BLOBULATE comment ("the worker still runs under the host
      # template... the host cannot exec the foreign output"). So a linux graph has never
      # been merged by anything other than a linux host. This step forces exactly that
      # combination: this darwin host's tjs merging a LINUX-carved graph, cross-blobulating into
      # a linux-x64 engine template this host only ever touches as bytes, never executes.
      #
      # The linux-x64 provider is fetched by `npm pack` (not `npm i`), because
      # @anthropic-ai/claude-code-linux-x64 declares os:["linux"] and a plain install
      # refuses on darwin — `npm pack` has no such gate, and clode only ever CARVES the
      # provider's bytes, never runs it (same "read the bytes, never execute" doctrine
      # the rest of the provider-lookup machinery relies on).
      #
      # NOTE FOR PHASE 3: `--target linux-x64` is today's invocation string (matches
      # test/clode-target-build.test.cjs, test/clode-manifest-fetch.test.cjs et al.) — if
      # phase 3's target-naming work renames it (e.g. to a fully-dashed canonical
      # `linux-amd64`), that is ONE LINE of churn here, not a rewrite.
      # Independent of the local-tools turns above: a red turn must not hide the graph oracle
      # (test/ci-step-chaining.test.cjs), so these three chain only on each other.
      - uses: actions/download-artifact@v8.0.2
        id: linuxengine
        if: ${{ !cancelled() }}
        with:
          name: tjs-linux-x64-musl   # a SECOND platform's engine — bytes only, never executed here
          path: ${{ runner.temp }}/tjs-linux
      - name: Stage a second platform's provider (linux-x64, via npm pack — carved, never run)
        id: linuxprovider
        if: ${{ !cancelled() && steps.linuxengine.outcome == 'success' }}
        run: |
          set -euo pipefail
          chmod +x "${{ runner.temp }}/tjs-linux/tjs"
          V=$(sed -n 's/^claude-code //p' UPSTREAM_PIN)
          DIR="${{ runner.temp }}/linux-provider"
          mkdir -p "$DIR"
          npm pack "@anthropic-ai/claude-code-linux-x64@$V" --pack-destination "$DIR" 2>&1 | tail -3
          tar xzf "$DIR"/anthropic-ai-claude-code-linux-x64-*.tgz -C "$DIR"
          test -s "$DIR/package/claude"
          echo "LINUX_PROVIDER=$DIR/package/claude" >> "$GITHUB_ENV"
      - name: SECOND-PLATFORM graph oracle — cross-build a linux-x64 quaude from this darwin host
        if: ${{ !cancelled() && steps.linuxprovider.outcome == 'success' }}
        env:
          CLODE_TJS: ${{ runner.temp }}/tjs/tjs
          CLODE_TARGET_TEMPLATE: ${{ runner.temp }}/tjs-linux/tjs
        run: |
          set -euo pipefail
          # LINUX_PROVIDER: exported via GITHUB_ENV by the step above, inherited here like
          # any other env var a prior step sets (same idiom as suite.yml's CLODE_PROVIDER_BIN).
          # `clode build --out` does not mkdir -p its own parent (see linux-x64-pty's
          # same note) — a bare path under a fresh runner.temp dies ENOENT.
          mkdir -p "${{ runner.temp }}/quaude-linux-graph-check"
          CLODE_CLAUDE_BIN="$LINUX_PROVIDER" \
            node scripts/stage0.mjs build --target linux-x64 --out "${{ runner.temp }}/quaude-linux-graph-check/quaude"
          test -s "${{ runner.temp }}/quaude-linux-graph-check/quaude"

      # THIS JOB'S GATE LIST (observability plan Task 5): every record test/cell-reporter.mjs wrote above, for ci.yml's
      # gates-ran-in-ci job to hold against test/ci-gates.cjs. Uploaded whatever happened above: a red job's list still
      # says which gates ran, and a job that uploads none is itself a finding there.
      # ONE upload path: in a container job (node-shim-oracle) the runner rewrites only the FIRST line of a multi-line
      # `path` to the container's mount, so a second directory was silently left out (CI run 44597568635 lost its
      # gates/). Both directories are copied under one first.
      - name: Stage this job's gate list in one directory
        if: ${{ !cancelled() }}
        run: node -e "const fs=require('fs'),p=require('path'),t=process.env.RUNNER_TEMP;for(const d of ['cells','gates'])if(fs.existsSync(p.join(t,d)))fs.cpSync(p.join(t,d),p.join(t,'gates-ran',d),{recursive:true})"
      - name: Upload this job's gate list (judged by gates-ran-in-ci)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gates-ran-node-shim-oracle-darwin
          path: ${{ runner.temp }}/gates-ran
          if-no-files-found: warn
          overwrite: true   # a re-run attempt replaces its own list (artifacts are run-scoped and immutable)

  # THE GATE LISTS, JUDGED (observability plan Task 5; user doctrine 2026-10-05: "Job 0 is always to be able to observe
  # our current state more accurately than yesterday"). Every job above that runs a gate uploads what
  # test/cell-reporter.mjs recorded (gates-ran-<job>; the suite rows from test/run.mjs, the engine legs from the
  # build-leg action). This job downloads them all and holds each job to test/ci-gates.cjs: every gate it must run
  # PASSED there, by name. A skip, a failure, a gate that never appeared, or a job that uploaded no list at all is a
  # finding, so a gate that stops running anywhere turns CI red instead of going dark (shim-surface was dark in the
  # suite since 2.1.243 and passed in node-shim-oracle only as one of an anonymous "skipped 2"). Runs once every job it
  # judges FINISHES, whatever its conclusion: a red job's list still says what ran, and a missing list is the finding.
  gates-ran-in-ci:
    needs: [changes, tjs, tjs-slow, test, node-shim-oracle, node-shim-oracle-darwin, native-builder-oracle, linux-x64-pty, windows-amd64-tests, windows-arm64-tests, windows-amd64-tui]
    if: needs.changes.outputs.code != 'false' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: gates-ran-*
          path: ${{ runner.temp }}/gates-ran
      - name: Gates — every gate each CI job must run, it ran (test/ci-gates.cjs)
        if: ${{ !cancelled() }}
        env:
          # Each judged job's result: a list missing because its job was cancelled, skipped or failed is named
          # UNOBSERVED (re-run it), one missing or short from a job that succeeded is DARK. Both are red.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          mkdir -p "$RUNNER_TEMP/gates-ran"
          ls "$RUNNER_TEMP/gates-ran"
          CLODE_GATES_RAN="$RUNNER_TEMP/gates-ran" node --require ./test/file-watchdog-preload.cjs --test \
            --test-name-pattern=gates-ran-in-ci test/gates-ran-in-ci.test.cjs
