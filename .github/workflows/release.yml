name: release

# THE release workflow (unified 2026-07-10, user call — formerly two files:
# the SEA-only release.yml and this matrix; the SEA legs themselves retired
# Phase 4, 2026-07-13): tjs builder legs (T1 native, T1.5 Alpine/musl x8, T2
# VM guests — fuse and smoke run INSIDE the guest; a BSD binary has no binfmt
# escape on a Linux host) are now the ONLY builder family. The release job
# gates on every hard leg succeeding, or nothing publishes; soft legs
# (continue-on-error) contribute artifacts only when green. A release-gate
# tripwire additionally refuses to publish without a windows-arm64 builder
# (Phase 4 dropped the SEA arm64 leg with no tjs replacement yet). One
# SHA256SUMS covers every asset; every asset is SLSA-attested.
# Publishes ONLY clode builders (canon: quaude is derived work, never leaves
# a runner). glibc Linux legs are CI-smoke only (Decision 3) — the published
# Linux artifacts are the musl-static ones. Phase 3 adds the T3 own-qemu
# legs (netbsd aarch64/sparc/i386) through ./.github/actions/guest, whose
# YAML shape is fixed here from day one.
#
# Triggers: a version tag, or manual dispatch (default: artifacts only, no
# release — the dry-run mode; 'draft' mints a draft prerelease to inspect).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: "release handling: skip = artifacts only (dry-run), draft = draft prerelease"
        type: choice
        options: [skip, draft]
        default: skip

permissions:
  contents: read

jobs:
  # The leg matrix lives in scripts/tjs-legs.mjs (single source of truth,
  # shared with per-push CI — user decision 2026-07-11: no duplication
  # between the two GHA builds); the job itself is the reusable
  # tjs-legs.yml. tier: release = the full matrix, publish/attest live.
  # Job stays named 'leg' so the needs: edges below hold.
  # Everything EXCEPT the 4 darwin slices. Split out so the darwin-universal lipo
  # (and the daily-driver darwin artifact) doesn't wait on the whole matrix — the
  # slow NetBSD fleet legs in particular. Job stays named 'leg' so be-bytecode-oracle's and
  # the release gate's needs: edges hold. (Revert = drop only:notdarwin here +
  # only:darwin on darwin-slices, fold darwin-universal's needs back to [leg].)
  leg:
    uses: ./.github/workflows/tjs-legs.yml
    permissions:
      contents: read
      id-token: write        # actions/attest-build-provenance
      attestations: write
    with:
      tier: release
      only: notdarwin

  # The 4 darwin slices (arm64/x64/x86/ppc) as their OWN job so darwin-universal
  # gates on just these, not the full matrix.
  darwin-slices:
    uses: ./.github/workflows/tjs-legs.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      tier: release
      only: darwin

  # 64-bit big-endian oracle (plan T1.5): the node-shim suite against the
  # THE big-endian gate: is serialized bytecode identical on LE and BE?
  #
  # Replaces the old `be-oracle`, which replayed ~140 node-shim rows on a BE engine
  # under qemu. In 30 runs it never caught a big-endian bug; its green was bought
  # with a five-file exclude list added in answer to reds that were NOT endianness
  # (945bc5f says so outright); its one endianness assertion was
  # `assert.ok(x === 'LE' || x === 'BE')`; 13 rows self-skipped for want of a
  # provider, while ci.yml treats that same skip as exit 1; and it carried the
  # musl-engine-vs-glibc-node defect fixed in c7db1c7, so it was a red waiting on a
  # tag. It also cost coverage elsewhere -- tjs-legs.mjs claimed "PONG-class smoke
  # lives in the be-oracle job", which was never true.
  #
  # This asks the actual canonical-LE question instead: serialize one corpus under
  # the LE and BE engines FROM THIS RUN and diff. Seconds, no provider, no exclude
  # list, no libc mismatch.
  #
  # RATCHETED rather than pass/fail. Regexp literals genuinely differ -- libregexp
  # stores its compiled program in host order -- and that is BENIGN: a regexp
  # serialized on LE deserializes and RUNS correctly on BE (measured, with an LE
  # control). Failing releases on that helps nobody; tolerating a silent change to
  # it is how the next divergence hides. The baseline records the verdict per item
  # and this fails when it moves in EITHER direction.
  be-bytecode-oracle:
    needs: leg
    if: ${{ !cancelled() }}    # run even when an unrelated leg failed; a missing artifact fails loudly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .tool-versions
      - uses: docker/setup-qemu-action@v4.2.0   # fix-binary binfmt: host node spawns the s390x tjs
      - uses: actions/download-artifact@v8.0.1
        with:
          name: tjs-linux-s390x-musl
          path: ${{ runner.temp }}/tjs-be
      - uses: actions/download-artifact@v8.0.1
        with:
          name: tjs-linux-x64-musl
          path: ${{ runner.temp }}/tjs-le
      - name: LE/BE serialized-bytecode equivalence
        run: |
          set -euo pipefail
          chmod +x "${{ runner.temp }}/tjs-be/tjs" "${{ runner.temp }}/tjs-le/tjs"
          node scripts/bc-le-gate.mjs \
            --le "${{ runner.temp }}/tjs-le/tjs" \
            --be "${{ runner.temp }}/tjs-be/tjs"
      # The rows be-oracle ran that WERE endianness-sensitive, kept: the sha256/HMAC
      # known-answer test and the 891-case URL golden corpus, against the BE engine.
      # Everything else it ran was shim behaviour the LE legs already cover, and
      # needs no provider -- so nothing self-skips into a false pass.
      - name: Install the runtime dep closure
        run: npm ci --prefix deps/claude
      - name: BE-sensitive rows (crypto KAT + URL golden) on the big-endian engine
        env:
          CLODE_TJS: ${{ runner.temp }}/tjs-be/tjs
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            test/node-shim-crypto.test.cjs test/url-characterization.test.cjs


  # The four-arch macOS universal binary: lipo the four darwin ENGINE slices
  # (ppc/i386/x86_64/arm64) into one fat Mach-O, then fuse ONE canonical-LE
  # trailer over it — the trailer is arch-agnostic (canonical-LE proven on
  # real ppc), so every slice reads it. Runs on macos-arm64: the fat
  # template's arm64 slice drives the fuse worker + codesign (proven to
  # handle a ppc-containing fat). HARD (no continue-on-error): the universal is
  # four arches or it is not release-ready — the lipo step exit-1's on any
  # missing slice, and that must block the release, not silently ship an
  # incomplete darwin (all four slice legs are hard too). `if: !cancelled()` so
  # a failed slice leg still runs this job to surface the exact "missing slice"
  # error before it fails. Publishes clode-<ver>-macos (picked up by
  # the release job's clode-* pattern); the bare fat engine stays a CI artifact.
  darwin-universal:
    needs: darwin-slices
    if: ${{ !cancelled() }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .tool-versions
      - name: Download the four darwin engine slices
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: tjs-darwin-*
          path: ${{ runner.temp }}/slices
      - name: lipo the four slices into a fat engine + gate
        id: fat
        run: |
          set -euo pipefail
          S="${{ runner.temp }}/slices"
          for a in arm64 x64 x86 ppc; do test -f "$S/tjs-darwin-$a/tjs" || { echo "missing slice $a" >&2; exit 1; }; done
          FAT="${{ runner.temp }}/tjs-darwin-universal"
          lipo -create -output "$FAT" \
            "$S/tjs-darwin-arm64/tjs" "$S/tjs-darwin-x64/tjs" \
            "$S/tjs-darwin-x86/tjs" "$S/tjs-darwin-ppc/tjs"
          chmod +x "$FAT"
          info=$(lipo -info "$FAT"); echo "$info"
          for a in ppc i386 x86_64 arm64; do
            case "$info" in *"$a"*) ;; *) echo "ERROR: fat binary missing $a slice" >&2; exit 1 ;; esac
          done
          # per-slice floors intact (each carries its own LC_VERSION_MIN /
          # LC_BUILD_VERSION — canonical-LE lets one trailer span them all).
          for a in ppc i386 x86_64 arm64; do
            v=$(otool -arch "$a" -l "$FAT" | awk '/LC_VERSION_MIN_MACOSX/{m=1} m&&/version/{print $2; exit}')
            echo "  $a: LC_VERSION_MIN_MACOSX ${v:-<build-version>}"
          done
          echo "fat=$FAT" >> "$GITHUB_OUTPUT"
      - name: Name the universal builder
        id: name
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then V="${GITHUB_REF_NAME#v}"; else V="$(cat VERSION)"; fi
          # Shipped as plain `macos`: the whole point of a Universal binary is that
          # you do NOT pick an arch — one download works everywhere. It also carries
          # no floor (unlike clode-<ver>-netbsd10.1-sparc) because it spans four of
          # them, one per slice.
          echo "asset=clode-$V-macos" >> "$GITHUB_OUTPUT"
      - name: Upload the bare fat engine (CI artifact)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tjs-darwin-universal
          path: ${{ steps.fat.outputs.fat }}
          if-no-files-found: error
      - name: Install deps + esbuild the clode-main bundle
        run: |
          npm ci --prefix deps/claude
          node scripts/build-clode-main.mjs
      - name: Fat-fuse the universal builder (arm64 slice drives; trailer spans all)
        env:
          CLODE_TJS: ${{ steps.fat.outputs.fat }}
          # So any build/<artifact-name>/ this invocation touches matches the
          # SHIPPED asset name — see scripts/platform-tag.cjs's artifactDir.
          CLODE_ASSET_NAME: ${{ steps.name.outputs.asset }}
        run: node bin/clode build --self --out "${{ steps.name.outputs.asset }}"
      - name: Self-smoke the arm64 slice
        run: ./"${{ steps.name.outputs.asset }}" --version
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: ${{ steps.name.outputs.asset }}
      - name: Upload the universal builder (published)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.name.outputs.asset }}
          path: ${{ steps.name.outputs.asset }}
          if-no-files-found: error

  # The compiler-free cross-build PACK (universal-cross-build spec): assemble the
  # templates manifest + the pin-versioned bare engines a downloaded clode fetches
  # to cross-build a quaude for any published target. The SAME aggregate job
  # pack.yml iterates on, here over the whole release matrix. Engines are the bare
  # tjs each leg already uploads (tjs-<leg>) — no rebuild, no compiler. With many
  # legs the pattern download nests each under tjs-<leg>/ (as darwin-universal
  # reads slices/tjs-darwin-<a>/tjs), which is what collectInputs expects.
  # Published as clode-templates-<pin> so the release job's clode-* + merge-multiple
  # flattens the manifest + engines into dist/ — a clode then fetches
  # templates-<pin>.json + each tjs-<target>-<pin>.gz by URL on demand (engines ship
  # gzip'd; clode inflates + sha-verifies the decompressed engine — manifest.compression).
  # templates-drift IS NOT A JOB ANY MORE, in either workflow.
  #
  # I moved it here from ci.yml on 2026-08-24 reasoning that "we are about to
  # publish a mismatched pack" is a fault rather than a state. It is — but the
  # script compares against `releases/LATEST` (templates-drift.mjs:128), which on a
  # release run is the PREVIOUS release. So it would have failed on exactly the
  # staleness the release exists to fix, blocking the fix. A gate that cannot pass
  # when you do the right thing is worse than no gate.
  #
  # Verifying the pack we are about to publish is pointless in the other direction:
  # templates-pack builds it from THIS run's leg artifacts, so it matches this tree
  # by construction.
  #
  # The real defence lives at fetch time now: obtainEngine compares the pack's
  # recipe against the recipe baked into the running clode and REFUSES a mismatch
  # (libexec/clode-templates.cjs, test/clode-templates.test.cjs). That is the moment
  # a mismatch costs a user something, and it is exact where the old tjsPin check
  # was coarse. scripts/templates-drift.mjs is kept for running by hand.

  templates-pack:
    needs: [leg, darwin-slices]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .tool-versions
      - name: Download every leg's bare engine
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: tjs-*
          path: engines
      - name: Assemble the manifest + pin-versioned pack
        run: |
          set -euo pipefail
          node scripts/build-templates-manifest.mjs \
            --engines engines --tier release \
            --out "$RUNNER_TEMP/templates.json" --pack pack
          echo "=== manifest ==="; cat pack/templates-*.json
          echo "=== pack ==="; ls -lh pack
          # The pack is EXACTLY two assets now (Follow-up 5): the blob and its
          # manifest. Before 2026-08 it was the manifest plus ~38 loose
          # `<engine>.gz` rows, which buried the builder list the release exists
          # to show. Assert the shape here rather than discovering a regression
          # by counting rows on the published release page.
          n=$(ls -1 pack | wc -l | tr -d ' ')
          [ "$n" = 2 ] || { echo "expected 2 pack assets (blob + manifest), got $n:" >&2; ls -1 pack >&2; exit 1; }
      # v<version>-<sha7> — the same pin clode's thisTjsPin derives from PINS.md
      # (and build-templates-manifest stamps into the manifest). sed, not node, to
      # avoid nesting quotes inside this YAML run scalar.
      - name: Name the pack (pin)
        id: name
        run: |
          set -euo pipefail
          pin=$(sed -n 's/^txiki\.js \(v[0-9.]*\) \([0-9a-f]\{7\}\).*/\1-\2/p' spike/quickjs/PINS.md)
          [ -n "$pin" ] || { echo "could not derive tjs pin from PINS.md" >&2; exit 1; }
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: Upload the pack for the release job
        uses: actions/upload-artifact@v7.0.1
        with:
          name: clode-templates-${{ steps.name.outputs.pin }}
          path: pack
          if-no-files-found: error

  # DETERMINISTIC RELEASE (user doctrine 2026-07-14): a release ships a FIXED
  # manifest — every publishing leg. On the release tier soft-fail is stripped
  # from publishers (scripts/tjs-legs.mjs), so `needs: [leg]` requires the WHOLE
  # matrix green: a TCG/qemu flake FAILS the leg job → release is skipped → no
  # mint (rerun-failed the flaked legs until green — slow over non-deterministic).
  # Only engine-only legs (darwin-x86/ppc, publish:false) stay soft — they ship
  # no asset. The gate below is a secondary asset-presence guard.
  # The full node:test suite, at RELEASE time, on the tag itself.
  #
  # WHY THIS EXISTS (2026-08-01). A tag was gated by build + smoke + be-oracle and
  # by nothing else: ci.yml has NO tag trigger, so tagging never ran the unit or
  # fidelity suite, and release.yml only ran be-oracle's node-shim subset. Pair
  # that with ci.yml's `cancel-in-progress` on main -- a newer push (Renovate
  # bumped twice in one hour today) cancels the superseded run -- and a commit can
  # reach a tag having had NEITHER a completed ci.yml run NOR any suite run here.
  #
  # That is not hypothetical: the hermeticity violation that broke this release
  # candidate lived in 6bd9088, whose ci.yml run was cancelled by supersession. It
  # surfaced only because the NEXT commit's run happened to complete. One more
  # bot push at the wrong moment and it ships unnoticed.
  #
  # Calls the SAME reusable suite.yml ci.yml calls — not a copy of it. The first
  # cut of this job hand-mirrored ci.yml's steps, which is precisely the
  # two-lists-that-must-agree shape that produced the release-gate `.exe` bug and
  # the SHA256SUMS blob omission earlier the same day. ~3 minutes, two jobs, and
  # the tag gates on byte-identical evidence to main: IF WE SHIP IT, CI GATES IT.
  suite:
    uses: ./.github/workflows/suite.yml
    permissions:
      contents: read

  release:
    needs: [leg, darwin-slices, darwin-universal, templates-pack, suite, be-bytecode-oracle]
    if: github.ref_type == 'tag' || inputs.release == 'draft'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: clode-*          # published builders (smoke-* and tjs-* stay CI artifacts)
          path: dist
          merge-multiple: true
      - name: Release gate — required-platform assets present
        run: |
          set -euo pipefail
          # Asset globs that MUST be in the release, floor-agnostic
          # (`clode-*-netbsd*-sparc` matches the floored
          # `clode-<ver>-netbsd10.1-sparc`). Only currently-existing required legs
          # go here so the gate stays SATISFIABLE. macOS ships exactly ONE asset —
          # `clode-<ver>-macos`, the four-arch Universal binary — and it carries no
          # arch suffix by design, which is why this is a glob list rather than the
          # former {os arch} pairs.
          # TRAILING `*` IS LOAD-BEARING — it matches the per-OS runnable
          # extension that scripts/canonical-name.cjs appends (windows `.exe`,
          # cosmo `.com`, everything else none). Without it this gate blocked the
          # 0.20260801.1 release: windows-arm64 uploaded
          # `clode-0.20260801.1-windows-arm64.exe` and the extensionless glob
          # `clode-*-windows*-arm64` did not match, so a release with all 48 jobs
          # green refused to publish. The extension arrived with the canonical
          # vocabulary refactor (b63233b); this list was written against the older
          # extensionless names and nothing tied the two together. CI never saw it
          # because this gate only runs in the release tier.
          # test/release-gate-globs.test.cjs now asserts these globs against the
          # names canonical-name.cjs actually produces.
          REQUIRED="clode-*-windows*-arm64*  clode-*-netbsd*-sparc*  clode-*-macos*"
          missing=0
          for g in $REQUIRED; do
            if ! ls dist/$g >/dev/null 2>&1; then
              echo "RELEASE GATE: missing required asset matching $g" >&2
              missing=1
            fi
          done
          [ "$missing" = 0 ] || { echo "refusing to publish an incomplete release" >&2; exit 1; }
          echo "release gate ok: all required-platform assets present"
      - name: Attach builders + shas to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          chmod +x clode-*
          # The pack rides in via the clode-templates-<pin> artifact (merge-multiple
          # flattened it here). Cover it in SHA256SUMS too — globbed only if present
          # so a pack-less run (none built) still succeeds.
          #
          # `templates-*` NOT `templates-*.json`: since the blob pack (2026-08-01) the
          # engines ship as ONE extensionless `templates-<pin>` asset, which the old
          # `.json` glob did not match — and `tjs-*` no longer matches anything either,
          # because the per-engine `.gz` rows are gone. Together those would have
          # shipped every engine byte UNCHECKSUMMED while SHA256SUMS still looked
          # complete. `tjs-*` is kept for a `--loose` pack.
          sha256sum clode-* $(ls tjs-* templates-* 2>/dev/null || true) > SHA256SUMS
          # A blob pack MUST be covered. Silence here would mean the one asset holding
          # every engine is unverifiable by the checksums file that claims to cover the
          # release.
          for f in templates-*; do
            [ -e "$f" ] || continue
            grep -q "  $f\$" SHA256SUMS || { echo "SHA256SUMS is missing $f" >&2; exit 1; }
          done
          cat SHA256SUMS
          cd ..
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
            # A previous run of this same workflow (e.g. re-dispatch) may
            # already have created this release — attach, don't duplicate;
            # create only if we got here first.
            # Release notes = this version's CHANGELOG.md section (single source
            # of truth). Keyed off VERSION, not the tag, so it works whether the
            # tag carries a v-prefix or not. Falls back to a generic line if a
            # version has no entry — a missing changelog must never block a release.
            VER="$(cat VERSION)"
            awk -v v="## $VER" '$0==v{g=1;next} /^## /&&g{exit} g{print}' \
              CHANGELOG.md > "$RUNNER_TEMP/relnotes.md"
            [ -s "$RUNNER_TEMP/relnotes.md" ] \
              || echo "Automated release (tjs matrix)." > "$RUNNER_TEMP/relnotes.md"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                   --target "$GITHUB_SHA" --title "clode $VER" \
                   --notes-file "$RUNNER_TEMP/relnotes.md"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            V="$(cat VERSION)"; TAG="v$V-matrix-test.$GITHUB_RUN_NUMBER"
            echo "Draft prerelease $TAG with: $(ls dist)"
            gh release create "$TAG" --draft --prerelease \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$TAG" \
              --notes "Matrix dry-run. Assets: $(ls dist | tr '\n' ' ')" \
              dist/*
          fi
